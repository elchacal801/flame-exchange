name: "Submit a Threat Path Manually"
description: "Submit a fraud threat path for review without using the AI intake pipeline."
title: "[Manual] "
labels: ["manual-submission", "review-needed", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Manual Threat Path Submission
        Use this form to submit a threat path directly. For AI-assisted intake from a URL,
        use the Intel Submission template instead.

        Please prepare your threat path markdown file following the template in
        `Templates/threat-path-template.md` and attach it or paste the content below.

  - type: input
    id: title
    attributes:
      label: "Threat Path Title"
      description: "Descriptive title for the fraud scheme"
      placeholder: "e.g., Payroll Diversion via HR Portal Compromise"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: "Your Name or Handle"
      description: "How you'd like to be credited"
      placeholder: "Your name or GitHub handle"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "Submission Category"
      options:
        - "Threat Path (fraud scheme mapping)"
        - "Baseline (environmental profiling)"
        - "Detection Logic (rules/queries/analytics)"
    validations:
      required: true

  - type: dropdown
    id: sector
    attributes:
      label: "Primary Sector"
      description: "Which financial sector is most affected?"
      options:
        - Banking
        - Credit Union
        - Cross-sector
        - Crypto
        - Education
        - Employment
        - Fintech
        - Government
        - Healthcare
        - Insurance
        - Investment
        - Payments
        - Real Estate
        - Retail
        - Staffing
        - Trade
        - Travel
        - Web3
    validations:
      required: true

  - type: checkboxes
    id: fraud_types
    attributes:
      label: "Fraud Types (select all that apply)"
      options:
        - label: "Identity Fraud (synthetic identity, account takeover, impersonation)"
        - label: "Payment Fraud (wire, ACH, check, card-not-present)"
        - label: "Social Engineering (BEC, phishing, vishing, smishing)"
        - label: "Digital/Cyber (deepfake, credential stuffing, malware-enabled)"
        - label: "Insider/First-Party (employee fraud, first-party fraud, collusion)"
        - label: "Other (describe in content below)"

  - type: checkboxes
    id: cfpf_phases
    attributes:
      label: "CFPF Phases (select all that apply)"
      options:
        - label: "P1 — Recon"
        - label: "P2 — Initial Access"
        - label: "P3 — Positioning"
        - label: "P4 — Execution"
        - label: "P5 — Monetization"

  - type: textarea
    id: content
    attributes:
      label: "Threat Path Content"
      description: "Paste the full markdown content of your threat path, or describe the scheme and we will help structure it."
      placeholder: "Paste markdown content here..."
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: "Confirmation"
      options:
        - label: "The content is TLP:WHITE or based on publicly available information"
          required: true
        - label: "I have reviewed the existing FLAME database for potential duplicates"
          required: true
