name: FLAME Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'ThreatPaths/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Baselines/**'
      - 'config/**'
      - 'data/cfpf_techniques.json'
      - 'mcp_server/**'
      - 'requirements.txt'
      - '.github/workflows/build-and-deploy.yml'
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Fetch Regulatory Data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  validate:
    name: Validate Submissions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate all threat paths
        run: |
          for f in ThreatPaths/TP-*.md; do
            echo "Validating $f..."
            python scripts/validate_submission.py "$f"
          done

  build:
    name: Build Database & STIX
    runs-on: ubuntu-latest
    needs: validate
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build FLAME database
        run: python scripts/build_database.py

      - name: Export STIX bundle
        run: python scripts/export_flame_stix.py

      - name: Export MISP galaxy and feed
        run: python scripts/export_misp.py

      - name: Export static TAXII endpoints
        run: python scripts/export_taxii.py

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A database/ api/ data/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: rebuild database, STIX bundle, and stats [skip ci]"
            git pull --rebase
            git push
          fi
