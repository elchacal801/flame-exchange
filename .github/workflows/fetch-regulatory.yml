name: Fetch Regulatory Data

on:
  schedule:
    - cron: '0 6 * * 1-5'   # Weekdays at 6 AM UTC
    - cron: '0 18 * * 1-5'  # Weekdays at 6 PM UTC
  workflow_dispatch:  # Manual trigger

concurrency:
  group: fetch-regulatory-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch regulatory data
        run: python scripts/fetch_regulatory_data.py --output data/regulatory_alerts.csv
        timeout-minutes: 15

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/regulatory_alerts.csv
          git diff --cached --quiet || git commit -m "chore: update regulatory alerts [automated]"
          git pull --rebase -X theirs
          git push
