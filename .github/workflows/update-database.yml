name: Update Database

on:
  push:
    branches: [main]
    paths:
      - 'ThreatPaths/**'
      - 'Baselines/**'
      - 'data/cfpf_techniques.json'
      - 'data/regulatory_alerts.csv'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch regulatory data
        run: python scripts/fetch_regulatory_data.py --output data/regulatory_alerts.csv
        timeout-minutes: 15
        continue-on-error: true

      - name: Build database
        run: python scripts/build_database.py

      - name: Export STIX bundle
        run: python scripts/export_flame_stix.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          git diff --cached --quiet || git commit -m "Rebuild database [automated]"
          git pull --rebase
          git push
