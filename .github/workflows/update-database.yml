name: Update Database

on:
  push:
    branches: [main]
    paths:
      - 'ThreatPaths/**'
      - 'Baselines/**'
      - 'DetectionLogic/**'
      - 'data/cfpf_techniques.json'
      - 'data/regulatory_alerts.csv'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch regulatory data
        run: python scripts/fetch_regulatory_data.py --output data/regulatory_alerts.csv
        timeout-minutes: 15
        continue-on-error: true

      - name: Build database
        run: python scripts/build_database.py

      - name: Export STIX bundle
        run: python scripts/export_flame_stix.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          git diff --cached --quiet || git commit -m "Rebuild database [automated]"
          git push
