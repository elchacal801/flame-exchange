name: Validate PR

on:
  pull_request:
    paths:
      - 'ThreatPaths/**'
      - 'Baselines/**'
      - 'scripts/**'
      - 'requirements.txt'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security scan (Bandit)
        run: pip install bandit && bandit -r scripts/ -ll -q

      - name: Dependency vulnerability check (pip-audit)
        run: pip install pip-audit && pip-audit --strict --desc 2>&1 || true

      - name: Code formatting check (Ruff)
        run: pip install ruff && ruff check scripts/ --select E9,F63,F7,F82 --no-fix

      # SECURITY FIX: Git SHAs moved to env: block to prevent expression injection.
      # While SHAs are hex-constrained, this follows defense-in-depth best practice.
      - name: Find changed submission files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'ThreatPaths/*.md' 'Baselines/*.md' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      # SECURITY FIX: File list moved to env: block and iterated safely with proper
      # quoting to prevent filename injection (e.g., filenames containing shell metacharacters).
      - name: Validate submissions
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          echo "$CHANGED_FILES" | tr ' ' '\n' | while IFS= read -r file; do
            [ -n "$file" ] && python scripts/validate_submission.py "$file"
          done

