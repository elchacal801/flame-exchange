# regulatory_sources.yaml — Configuration for FLAME regulatory feed sources.
#
# Each source block contains:
#   enabled          - whether the source is active
#   url / feed_url / base_url / sdn_url  - endpoint(s) to fetch
#   category_mapping - maps regulatory categories to FLAME TP IDs
#
# TP IDs reference threat paths defined in ThreatPaths/.

sources:

  fincen:
    enabled: true
    url: "https://www.fincen.gov/resources/advisoriesbulletinsfact-sheets/advisories"
    category_mapping:
      synthetic-identity:
        - TP-0012
        - TP-0034
      money-laundering:
        - TP-0001
        - TP-0003
      identity-theft:
        - TP-0012
      elder-fraud:
        - TP-0027
      ransomware:
        - TP-0020
      human-trafficking:
        - TP-0047
      corruption:
        - TP-0044
      terrorism-financing:
        - TP-0055
      sanctions-evasion:
        - TP-0044
        - TP-0045
      # Fallback: parser sets category='Advisory' for all scraped entries
      Advisory:
        - TP-0001
        - TP-0003

  cfpb:
    enabled: true
    api_url: "https://www.consumerfinance.gov/data-research/consumer-complaints/search/api/v1/"
    category_mapping:
      credit-reporting:
        - TP-0003
      debt-collection:
        - TP-0062
      mortgage-fraud:
        - TP-0006
        - TP-0073
      credit-card-fraud:
        - TP-0035
        - TP-0038
      account-fraud:
        - TP-0001
        - TP-0016
      wire-fraud:
        - TP-0001
        - TP-0002
      student-loan:
        - TP-0012
      auto-loan:
        - TP-0016
      payday-loan:
        - TP-0012
      prepaid-card:
        - TP-0035
      consumer-complaint:
        - TP-0012
      elder-fraud:
        - TP-0027
      identity-theft:
        - TP-0012
      fair-lending:
        - TP-0052

  fbi_ic3:
    enabled: true
    url: "https://www.ic3.gov/CSA"
    category_mapping:
      business-email-compromise:
        - TP-0010
        - TP-0011
      ransomware:
        - TP-0020
      romance-scam:
        - TP-0030
      investment-fraud:
        - TP-0031
      tech-support-fraud:
        - TP-0032
      identity-theft:
        - TP-0012
      cryptocurrency-fraud:
        - TP-0033
      # Fallback: parser sets category='Industry Alert' for all scraped entries
      Industry Alert:
        - TP-0001
        - TP-0002
        - TP-0012
        - TP-0067

  occ:
    enabled: true
    url: "https://www.occ.gov/news-issuances/bulletins/index-bulletin-issuances.html"
    feed_url: "https://www.occ.gov/rss/bulletins.xml"
    category_mapping:
      bsa-aml:
        - TP-0001
        - TP-0003
      cybersecurity:
        - TP-0020
        - TP-0010
      third-party-risk:
        - TP-0060
      operational-risk:
        - TP-0061
      fair-lending:
        - TP-0052
      # Fallback: parser sets category='Bulletin' for all scraped entries
      Bulletin:
        - TP-0001
        - TP-0060
      Enforcement Action:
        - TP-0001
        - TP-0014
        - TP-0016

  sec:
    enabled: true
    base_url: "https://www.sec.gov"
    url: "https://www.sec.gov/litigation/litreleases.htm"
    feed_url: "https://efts.sec.gov/LATEST/search-index?q=%22litigation+release%22&forms=LIT&dateRange=custom&startdt=2024-01-01&enddt=2026-12-31"
    category_mapping:
      investment-fraud:
        - TP-0031
      insider-trading:
        - TP-0014
      market-manipulation:
        - TP-0076
      ponzi-scheme:
        - TP-0017
      accounting-fraud:
        - TP-0064
      cryptocurrency-fraud:
        - TP-0033
      # Fallback: parser sets category='Litigation Release' for all entries
      Litigation Release:
        - TP-0031

  ofac:
    enabled: true
    sdn_url: "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML"
    base_url: "https://ofac.treasury.gov"
    category_mapping:
      sanctions-evasion:
        - TP-0044
        - TP-0045
        - TP-0055
      terrorism-financing:
        - TP-0055
      narcotics-trafficking:
        - TP-0049
        - TP-0055
      weapons-proliferation:
        - TP-0044
      cyber-sanctions:
        - TP-0048
        - TP-0061
        - TP-0067
      # Fallback: unmapped SDN entries
      SDN List Addition:
        - TP-0044
        - TP-0045
