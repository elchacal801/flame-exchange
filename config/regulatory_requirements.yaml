regulations:
  - id: REG-PSD3-SCA
    name: "PSD3 Strong Customer Authentication"
    jurisdiction: EU
    category: authentication
    description: "Requires multi-factor authentication for electronic payments"
    relevant_fraud_types:
      - account-takeover
      - unauthorized-transaction
      - phishing

  - id: REG-UK-PSR-APP
    name: "UK PSR APP Reimbursement"
    jurisdiction: UK
    category: reimbursement
    description: "Mandatory reimbursement for APP fraud victims"
    relevant_fraud_types:
      - authorized-push-payment
      - impersonation
      - social-engineering

  - id: REG-FINCEN-AML
    name: "FinCEN AML/BSA"
    jurisdiction: US
    category: anti-money-laundering
    description: "Bank Secrecy Act anti-money laundering requirements"
    relevant_fraud_types:
      - money-laundering
      - mule-recruitment
      - wire-fraud

  - id: REG-FATF-R16
    name: "FATF Recommendation 16 (Travel Rule)"
    jurisdiction: International
    category: wire-transfer
    description: "Originator and beneficiary information for wire transfers"
    relevant_fraud_types:
      - wire-fraud
      - money-laundering

  - id: REG-MAS-SRF
    name: "MAS Shared Responsibility Framework"
    jurisdiction: Singapore
    category: shared-responsibility
    description: "Framework for sharing losses from authorized push payment scams"
    relevant_fraud_types:
      - authorized-push-payment
      - phishing

  - id: REG-AU-SPF
    name: "Australia Scam Prevention Framework"
    jurisdiction: Australia
    category: scam-prevention
    description: "Obligations for banks, telcos, and platforms to prevent scams"
    relevant_fraud_types:
      - authorized-push-payment
      - romance-scam
      - investment-fraud

  - id: REG-FFIEC-AUTH
    name: "FFIEC Authentication Guidance"
    jurisdiction: US
    category: authentication
    description: "Federal guidance on authentication and access risk management"
    relevant_fraud_types:
      - account-takeover
      - credential-stuffing

  - id: REG-CFPB-REGE
    name: "CFPB Regulation E"
    jurisdiction: US
    category: consumer-protection
    description: "Electronic fund transfer consumer protection, unauthorized transaction liability"
    relevant_fraud_types:
      - unauthorized-transaction
      - account-takeover
      - ACH-fraud

  - id: REG-DORA
    name: "EU DORA"
    jurisdiction: EU
    category: operational-resilience
    description: "Digital Operational Resilience Act for financial entities"
    relevant_fraud_types:
      - account-takeover
      - deepfake

  - id: REG-FCA-APP
    name: "FCA Confirmation of Payee"
    jurisdiction: UK
    category: payment-verification
    description: "Name-checking for faster payment recipients"
    relevant_fraud_types:
      - authorized-push-payment
      - wire-fraud

  - id: REG-FINCEN-CDD
    name: "FinCEN CDD Rule"
    jurisdiction: US
    category: customer-due-diligence
    description: "Customer Due Diligence requirements for financial institutions"
    relevant_fraud_types:
      - synthetic-identity
      - identity-theft
      - application-fraud

  - id: REG-SEC-SAR
    name: "SEC Suspicious Activity Reporting"
    jurisdiction: US
    category: reporting
    description: "Broker-dealer SAR filing requirements"
    relevant_fraud_types:
      - investment-fraud
      - insider
      - money-laundering

  - id: REG-OCC-FRAUD
    name: "OCC Fraud Risk Management"
    jurisdiction: US
    category: risk-management
    description: "OCC guidance on fraud risk management for national banks"
    relevant_fraud_types:
      - account-takeover
      - check-fraud
      - wire-fraud

  - id: REG-EU-AMLD6
    name: "EU 6th Anti-Money Laundering Directive"
    jurisdiction: EU
    category: anti-money-laundering
    description: "Enhanced AML requirements including corporate criminal liability"
    relevant_fraud_types:
      - money-laundering
      - mule-recruitment

  - id: REG-FBI-IC3
    name: "FBI IC3 Recovery Asset Team / Financial Fraud Kill Chain"
    jurisdiction: US
    category: recovery
    description: "FBI IC3 Financial Fraud Kill Chain (FFKC) for fraudulent transaction recovery. 2025 IC3 Annual Report: 1,008,597 complaints, $20.877B losses. FFKC expanded beyond BEC to cover ATO and tech support fraud; 3,900 incidents, $679M frozen, 58% success rate."
    relevant_fraud_types:
      - wire-fraud
      - BEC
      - account-takeover
      - tech-support-fraud
      - investment-scam
      - recovery-fraud
      - government-impersonation
      - crypto-laundering

  - id: REG-OFAC-SDN
    name: "OFAC Specially Designated Nationals List"
    jurisdiction: US
    category: sanctions
    description: "Treasury OFAC sanctions list prohibiting transactions with designated persons and entities"
    relevant_fraud_types:
      - sanctions-evasion
      - money-laundering
      - wire-fraud
      - deepfake-as-a-service
      - scam-compound-operations

  - id: REG-INTERPOL-GFFTA
    name: "INTERPOL Global Financial Fraud Threat Assessment"
    jurisdiction: International
    category: threat-assessment
    description: "INTERPOL biennial assessment of global financial fraud threats; 2nd edition March 2026 documents $442B global losses, AI-enhanced fraud 4.5x more profitable, FaaS proliferation, scam centre globalization across 80 nationalities"
    relevant_fraud_types:
      - fraud-as-a-service
      - deepfake-fraud
      - investment-scam
      - scam-compound-operations
      - sextortion
      - social-engineering

  - id: REG-INTERPOL-SHADOW-STORM
    name: "INTERPOL Operation Shadow Storm"
    jurisdiction: International
    category: enforcement
    description: "International task force for coordinated financial fraud enforcement across multiple jurisdictions"
    relevant_fraud_types:
      - fraud-as-a-service
      - state-criminal-convergence

  - id: REG-INTERPOL-HAECHI
    name: "INTERPOL Operation HAECHI VI"
    jurisdiction: International
    category: enforcement
    description: "International enforcement operation resulting in 32,835 arrests and $439M in asset recovery across multiple fraud categories"
    relevant_fraud_types:
      - wire-fraud
      - investment-scam
      - money-mule

  - id: REG-INTERPOL-REDCARD
    name: "INTERPOL Operation RED CARD 2.0"
    jurisdiction: Africa
    category: enforcement
    description: "Africa-focused fraud enforcement operation resulting in 651 arrests targeting investment scams and social engineering"
    relevant_fraud_types:
      - investment-scam
      - social-engineering

  - id: REG-UNODC-EMERGING-THREATS
    name: "UNODC Emerging Threats: AI & Automation in Cybercrime"
    jurisdiction: International
    category: threat-assessment
    description: "September 2025 UNODC report documenting AI-enhanced cybercrime including 600% deepfake surge in criminal channels, automated mule systems, multilingual chatbots in scam compounds, and $40B annual scam centre profits in SE Asia"
    relevant_fraud_types:
      - deepfake-fraud
      - scam-compound-operations
      - money-mule
      - automated-mule-infrastructure
      - chatbot-enabled-fraud

  - id: REG-UNODC-ORGANIZED-FRAUD-2024
    name: "UNODC Organized Fraud Issue Paper"
    jurisdiction: International
    category: typology
    description: "2024 UNODC issue paper presenting 7-category organized fraud typology (consumer products/services, employment, investment, impersonation, identity, relationship/trust, business/organization fraud), UNTOC Convention linkages, cross-cutting facilitators (mass-marketing, identity theft, money laundering, enabling technology), crime-as-a-service model, 4P response framework (Prevent-Pursue-Protect-Promote), ~25 case studies covering organized crime dimensions across all global regions"
    relevant_fraud_types:
      - romance-scam
      - investment-scam
      - impersonation
      - employment-fraud
      - purchase-scam
      - identity-theft
      - BEC
      - money-mule
      - fraud-as-a-service
      - social-engineering
      - deepfake-fraud
      - recovery-fraud
      - long-firm-fraud
      - crash-for-cash
      - auction-fraud

  - id: REG-STIX-FCI
    name: "OASIS STIX Financial Crime Intelligence Extension"
    jurisdiction: International
    category: standard
    description: "World's first open standard for exchanging financial crime intelligence (Njordium Cyber Group, August 2025). Covers AML attributes (suspicious transactions, risk assessments), KYC/KYB intelligence (UBO identification, profile inconsistencies), corruption and fraud indicators, and entity relationship data (beneficial ownership, PEP status, sanctions matches). Uses STIX 2.1 native extension-definition mechanism."
    relevant_fraud_types:
      - money-laundering
      - identity-theft
      - sanctions-evasion-infrastructure
      - BEC
      - fraud-as-a-service

  - id: REG-MITRE-F3
    name: "MITRE F3 (Fight Financial Fraud)"
    jurisdiction: International
    category: taxonomy
    description: "MITRE Center for Threat-Informed Defense framework announced May 2025, aiming to create the ATT&CK equivalent for financial fraud. Develops fraud-specific TTPs derived from FS-ISAC CFPF, NRF Retail Fraud Taxonomy, and Verizon DBIR. Models social engineering, money laundering, and cash-out activities."
    relevant_fraud_types:
      - social-engineering
      - money-mule
      - account-takeover
      - phishing
      - wire-fraud

  - id: REG-EBA-FT-V5
    name: "EBA Fraud Taxonomy v5.0"
    jurisdiction: EU
    category: taxonomy
    description: "European Banking Authority Fraud Taxonomy v5.0 (effective January 2025). Separates contact method ('how') from modus operandi ('what') — described as revolutionary by pilot adopters across 15 European countries. Standardizes fraud classification for reporting and analytics."
    relevant_fraud_types:
      - authorized-push-payment
      - account-takeover
      - phishing
      - social-engineering
      - impersonation

  - id: REG-FRAUD-KILL-CHAIN-V2
    name: "Fraud Kill Chain White Paper V2"
    jurisdiction: International
    category: taxonomy
    description: "Fraud Kill Chain V2 presented at RSA Conference April 2025. Operational fraud fusion model gaining traction in fraud departments. Maps fraud attack lifecycle phases complementary to FS-ISAC CFPF and MITRE F3."
    relevant_fraud_types:
      - social-engineering
      - account-takeover
      - wire-fraud
      - money-mule

  - id: REG-NRF-RFT-V1
    name: "NRF Retail Fraud Taxonomy v1.0"
    jurisdiction: US
    category: taxonomy
    description: "NRF/RH-ISAC/Target/Chertoff Group collaborative taxonomy (November 2024). 24 techniques (FT1001-FT1303.3) across 4-tactic lifecycle (Pre-Compromise, Initial Access, Control, Monetization), 20 mitigations, 11 detection sources. Covers Gift Card Fraud and Account Takeover schemes. One of three foundational inputs to MITRE F3 framework. V2.0 in development adding return/refund fraud."
    relevant_fraud_types:
      - gift-card-fraud
      - loyalty-point-fraud
      - account-takeover
      - credential-stuffing
      - returns-fraud
      - refunding-as-a-service
      - purchase-scam

  - id: REG-RF-CTA-2026-0319
    name: "Recorded Future CTA-2026-0319: 2025 Malicious Infrastructure Year in Review"
    jurisdiction: International
    category: threat-assessment
    description: "Recorded Future Insikt Group annual report documenting malicious infrastructure trends including TDS expansion, DPRK IT worker malware families, Threat Activity Enabler bulletproof hosting networks, sanctions evasion through corporate rebranding, and as-a-service ecosystem professionalization"
    relevant_fraud_types:
      - tds-exploitation
      - dprk-it-worker-fraud
      - fraud-as-a-service
      - state-criminal-convergence

  - id: REG-WCI-2024
    name: "World Cybercrime Index (WCI) — Oxford/UNSW Expert Survey"
    jurisdiction: International
    category: threat-assessment
    description: "Peer-reviewed expert survey (92 cybercrime intelligence/investigation professionals, 97 countries) establishing the first standardized geographic attribution framework for cybercrime production across 5 categories: technical products/services, attacks/extortion, data/identity theft, scams, cashing out/money laundering. Bruce et al. (2024) PLoS ONE 19(4): e0297312. DOI: 10.1371/journal.pone.0297312. Survey data collected March-October 2021."
    relevant_fraud_types:
      - state-criminal-convergence
      - fraud-as-a-service
      - money-laundering
      - social-engineering
      - investment-scam
      - romance-scam
      - dprk-it-worker-fraud
      - crypto-laundering
      - scam-compound-operations
      - sanctions-evasion-infrastructure
      - bph-migration

  - id: REG-FATF-STABLECOIN-2026
    name: "FATF Targeted Report on Stablecoins and Unhosted Wallets"
    jurisdiction: International
    category: virtual-assets
    description: "March 2026 FATF report documenting stablecoins as 84% of $154B illicit VA transaction volume (Chainalysis 2025). Identifies vulnerabilities in unhosted wallets, cross-chain bridges, and wrapped stablecoins defeating freeze capabilities. Contains 39 risk indicators in Annex A covering transaction patterns, anonymity indicators, and TF/PF red flags. Documents DPRK Lazarus Group ($1.46B Bybit theft laundering), IRGC stablecoin procurement for drone/weapons components, ISIL/Al-Qaeda stablecoin donation solicitation, and drug trafficking organization use of USDT/TRON for precursor procurement."
    relevant_fraud_types:
      - crypto-laundering
      - sanctions-evasion-infrastructure
      - money-laundering
      - state-criminal-convergence
      - stablecoin-freeze-evasion

  - id: REG-CROWDSTRIKE-GTR-2026
    name: "CrowdStrike 2026 Global Threat Report"
    jurisdiction: International
    category: threat-assessment
    description: "Annual threat report documenting 89% increase in AI-enabled adversary attacks, 29-minute average eCrime breakout time (down from 98 min in 2021), 82% malware-free detections. Covers DPRK PRESSURE CHOLLIMA $1.46B Bybit theft via Safe{Wallet} supply chain, FAMOUS CHOLLIMA GenAI fake persona operations (+109%), fake CAPTCHA campaigns (+563%), CHATTY SPIDER 4-minute vishing breakout targeting law firms, AiTM SaaS targeting by ShinyHunters and IMPERIAL KITTEN, and cloud-conscious intrusions (+37%)."
    relevant_fraud_types:
      - dprk-it-worker-fraud
      - account-takeover
      - vishing
      - social-engineering
      - state-criminal-convergence
      - crypto-laundering
      - fake-captcha-fraud
