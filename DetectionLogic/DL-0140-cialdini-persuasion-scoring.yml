title: Cialdini Persuasion Principle Scoring in Fraud Communications
id: 5d9a3c7e-1b4f-6e2a-c8d5-2f7a4b1e9c03
status: experimental
description: >
  Scores inbound communications (email, SMS, chat) for Cialdini's six principles of
  persuasion: Reciprocity, Consistency, Social Proof, Authority, Liking, and Scarcity.
  Research shows combining these features with BERT/SBERT embeddings improves phishing
  detection F1 by 2.62%. Communications exhibiting 3+ principles above threshold are
  flagged as high-probability social engineering. Directly applicable to romance fraud,
  investment scam, impersonation, and recovery fraud detection where psychological
  manipulation is the primary attack vector.
sigma_compatible: false
native_query_required: true
references:
  - "Organized fraud detection in 2026: a technical landscape report — LLMs and transformer models"
  - "Cialdini's six principles of persuasion as numerical features for phishing detection"
threat_paths:
  - TP-0011
  - TP-0025
  - TP-0065
  - TP-0062
cfpf_phase: P2
fraud_types:
  - social-engineering
  - romance-scam
  - investment-scam
  - impersonation
logsource:
  product: communication_analysis
  service: nlp_scoring
detection:
  selection:
    content_type:
      - email
      - sms
      - chat
  condition: >
    cialdini_principles_detected >= 3
    AND max_principle_score > 0.7
data_sources:
  native_fields:
    - message_id
    - channel
    - sender
    - recipient
    - body_text
  derived_fields:
    - reciprocity_score
    - consistency_score
    - social_proof_score
    - authority_score
    - liking_score
    - scarcity_score
    - cialdini_principles_detected
    - max_principle_score
queries:
  python: |-
    # Cialdini Persuasion Principle Scoring Pipeline
    # Each principle scored 0.0-1.0 based on linguistic markers

    PRINCIPLE_MARKERS = {
        'reciprocity': ['gift', 'free', 'bonus', 'reward', 'complimentary',
                        'as a thank you', 'in return'],
        'consistency': ['you previously agreed', 'as you committed',
                       'continuing your', 'as always', 'you already'],
        'social_proof': ['everyone is', 'thousands of people', 'most popular',
                        'trending', 'others like you', 'community'],
        'authority': ['official notice', 'government', 'compliance required',
                     'legal obligation', 'regulatory', 'certified', 'verified'],
        'liking': ['dear friend', 'I care about you', 'we have so much in common',
                  'I trust you', 'you are special', 'between us'],
        'scarcity': ['limited time', 'only X left', 'expires today',
                    'final chance', 'act now', 'once in a lifetime', 'exclusive']
    }

    def score_cialdini_principles(text):
        scores = {}
        for principle, markers in PRINCIPLE_MARKERS.items():
            # Marker count + SBERT semantic similarity to principle exemplars
            marker_hits = sum(1 for m in markers if m.lower() in text.lower())
            semantic_sim = sbert_similarity(text, principle_exemplars[principle])
            scores[principle] = min(1.0, (marker_hits * 0.2) + (semantic_sim * 0.6))

        detected = sum(1 for s in scores.values() if s > 0.5)
        return scores, detected

  splunk: |-
    `comment("Splunk SPL for Cialdini Persuasion Scoring")`
    `comment("Requires NLP scoring service via DSDL or API")`
    index=communications sourcetype=fraud:communications
    | apply cialdini_scoring_model
    | where cialdini_principles_detected >= 3
    | where max_principle_score > 0.7
    | table _time, channel, sender, recipient,
            reciprocity_score, consistency_score, social_proof_score,
            authority_score, liking_score, scarcity_score,
            cialdini_principles_detected

falsepositives:
  - Legitimate marketing using persuasion techniques
  - Fundraising and charity communications
  - Sales communications with urgency and social proof
level: medium
tags:
  - attack.t1566
  - cfpf.phase2.initial_access
  - flame.cialdini
  - flame.social-engineering
  - flame.nlp
