title: CMLN Wallet Cluster Velocity
id: 6013d91d-b3cc-4cbf-9246-f2f36abcafd2
status: experimental
date: 2026/03/05
threat_paths:
  - TP-0049
cfpf_phase: P5
fraud_types:
  - crypto-laundering-infrastructure
  - cmln-operations
description: >
  Detect cryptocurrency wallet clusters exhibiting CMLN operational
  characteristics: high transaction velocity (average processing time under
  2 minutes), incoming transfers from multiple unrelated sources, and rapid
  outbound distribution to exchange or OTC wallets.
logsource:
  product: crypto
  category: blockchain_analytics
  service: chain_monitoring
detection:
  selection:
    wallet_cluster: true
    avg_processing_time|lt: 120
    inbound_source_count|gt: 10
    outbound_to_exchange_ratio|gt: 0.7
  condition: selection
falsepositives:
  - High-frequency trading bots
  - Legitimate payment processors with rapid settlement cycles
level: high
tags:
  - cmln
  - wallet-cluster
  - transaction-velocity
  - black-u
  - crypto-laundering
  - TP-0049
