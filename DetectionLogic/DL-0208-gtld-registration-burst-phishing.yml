title: "New gTLD Domain Registration Burst with Phishing Characteristics"
id: "12723c28-6172-41ec-a45a-038daa320751"
status: experimental
description: >
  Detect bulk domain registrations (5+ in 24h from same registrant/nameserver)
  on high-abuse gTLDs (.TOP, .BOND, .XYZ, .SHOP, .XIN, .CFD, .LOL) with
  brand-keyword presence, domain age < 7 days, and low registration cost.
  Interisle found 37% of phishing domains were bulk-registered and new gTLDs
  accounted for 51% of all phishing domains.
references:
  - "https://interisle.net/PhishingLandscape2025.pdf"
threat_paths:
  - TP-0079
  - TP-0041
cfpf_phase: P1
fraud_types:
  - phishing
  - fraud-enabling-infrastructure
  - brand-impersonation
logsource:
  product: banking
  service: domain_intelligence
detection:
  selection:
    tld|re: "TOP|BOND|XYZ|SHOP|XIN|CFD|LOL"
    domain_age_days|lte: 7
    registration_count_24h|gte: 5
    shared_nameserver: true
  filter:
    brand_keyword_match: true
    random_string_pattern: true
  condition: selection and (1 of filter)
falsepositives:
  - "Domain portfolio investors acquiring multiple domains"
  - "Corporate brand protection bulk registrations"
  - "Legitimate product launches registering multiple TLD variants"
data_sources:
  native_fields:
    - domain_name
    - tld
  enrichment_required:
    - field: domain_age_days
      source: WHOIS enrichment (domain registration date lookup)
sigma_compatible: true
level: high
tags:
  - cfpf.phase1.recon
  - flame.infrastructure
  - flame.shared
