title: AiTM Session Token Replay Detection — User-Agent and IP Mismatch Post-MFA
id: 7a4e2c9f-8b1d-3f6a-e5c7-4d2b1a8f3e06
status: experimental
description: >
  Detects potential Adversary-in-the-Middle (AiTM) session token replay by identifying
  User-Agent string or IP address mismatches between MFA completion events and subsequent
  session access events. AiTM phishing kits capture session tokens during MFA relay,
  then replay them from attacker infrastructure with different User-Agent/IP characteristics.
  Sekoia.io identified 11 major AiTM kits (Tycoon 2FA most prevalent: 1,200+ domains,
  500K+ organizations/month). FIDO2 blocks 93.9% of AiTM campaigns.
sigma_compatible: false
native_query_required: true
references:
  - "Organized fraud detection in 2026: a technical landscape report — BEC and AiTM phishing"
  - "Sekoia.io, Tycoon 2FA phishing kit analysis (2025)"
  - "Canadian Centre for Cyber Security — FIDO2 AiTM effectiveness (93.9%)"
threat_paths:
  - TP-0067
  - TP-0002
cfpf_phase: P3
fraud_types:
  - aitm-phishing
  - account-takeover
  - phishing
logsource:
  product: azure
  service: signinlogs
detection:
  selection_mfa:
    AuthenticationRequirement: multiFactorAuthentication
    ResultType: 0
  timeframe: 4h
  condition: >
    session access from IP != MFA authentication IP
    OR session User-Agent != MFA User-Agent
data_sources:
  native_fields:
    - UserPrincipalName
    - IPAddress
    - UserAgent
    - AppId
    - AuthenticationRequirement
    - ResultType
    - TimeGenerated
queries:
  kql: |-
    // Microsoft Sentinel KQL: Detect AiTM session token replay
    let mfa_events = SigninLogs
    | where TimeGenerated > ago(24h)
    | where AuthenticationRequirement == "multiFactorAuthentication"
    | where ResultType == 0
    | project MFATime=TimeGenerated, UserPrincipalName, MFA_IP=IPAddress,
              MFA_UserAgent=UserAgent, MFA_AppId=AppId;
    let access_events = SigninLogs
    | where TimeGenerated > ago(24h)
    | where ResultType == 0
    | project AccessTime=TimeGenerated, UserPrincipalName, Access_IP=IPAddress,
              Access_UserAgent=UserAgent, Access_AppId=AppId;
    mfa_events
    | join kind=inner access_events on UserPrincipalName
    | where AccessTime > MFATime and AccessTime < MFATime + 4h
    | where MFA_IP != Access_IP or MFA_UserAgent != Access_UserAgent
    | project UserPrincipalName, MFATime, AccessTime,
              MFA_IP, Access_IP, MFA_UserAgent, Access_UserAgent

  splunk: |-
    `comment("Splunk SPL for AiTM Session Token Replay Detection")`
    index=azure sourcetype="azure:aad:signin" AuthenticationRequirement="multiFactorAuthentication" ResultType=0
    | rename IPAddress AS MFA_IP, UserAgent AS MFA_UserAgent
    | join UserPrincipalName [
      search index=azure sourcetype="azure:aad:signin" ResultType=0
      | rename IPAddress AS Access_IP, UserAgent AS Access_UserAgent
    ]
    | where Access_IP != MFA_IP OR Access_UserAgent != MFA_UserAgent
    | table UserPrincipalName, _time, MFA_IP, Access_IP, MFA_UserAgent, Access_UserAgent

falsepositives:
  - Users switching between VPN and direct connection during authentication
  - Mobile users with carrier IP changes between MFA and access
  - Users authenticating via one device and accessing via another (legitimate SSO patterns)
level: high
tags:
  - attack.t1557
  - attack.t1539
  - cfpf.phase3.positioning
  - flame.aitm
