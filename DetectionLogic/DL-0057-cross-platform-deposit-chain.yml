title: Cross-Platform Deposit and Withdrawal Chain
id: 3ba070d5-b6d5-452f-942b-955b2dcd4d44
status: experimental
description: 'Detects a pattern where funds are received via one payment rail (e.g., ACH, wire) and then immediately sent
  out via a different payment rail (e.g., Zelle, FedNow) within a short window. This cross-rail chaining is a common layering
  technique used to obscure the origin of funds and complicate tracing, often associated with money mule operations and authorized
  push payment fraud monetization.

  '
sigma_compatible: false
native_query_required: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://www.fatf-gafi.org/en/publications/Methodsandtrends/Money-laundering-terrorist-financing-trends.html
threat_paths:
- TP-0024
- TP-0012
cfpf_phase: P5
fraud_types:
- authorized-push-payment
- wire-fraud
- payment-diversion
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection_inbound:
    event_type: payment_received
    inbound_rail|contains:
    - ACH_IN
    - WIRE_IN
    - RTP_IN
    - FEDNOW_IN
  selection_outbound:
    event_type: instant_payment_initiated
    outbound_rail|contains:
    - ZELLE
    - FEDNOW
    - RTP
    - ACH_SAMEDAY
  filter_amount:
    outbound_amount_pct_of_inbound|gte: 80
  condition: selection_inbound and selection_outbound and filter_amount
  timeframe: 4h
data_sources:
  native_fields:
  - event_type
  - inbound_rail
  - outbound_rail
  enrichment_required:
  - field: outbound_amount_pct_of_inbound
    source: Transaction correlation enrichment (outbound-to-inbound amount ratio)
queries:
  logscale: |-
    // LogScale LQL for Cross-Platform Deposit and Withdrawal Chain
    // Repository: flame-banking-transaction-monitoring
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: (selection_inbound and selection_outbound and filter_amount) | temporal(ordered=true, maxspan=4h, by=account_id)
    event_type="payment_received"
    (inbound_rail="ACH_IN" OR inbound_rail="WIRE_IN" OR inbound_rail="RTP_IN" OR inbound_rail="FEDNOW_IN")
    event_type="instant_payment_initiated"
    (outbound_rail="ZELLE" OR outbound_rail="FEDNOW" OR outbound_rail="RTP" OR outbound_rail="ACH_SAMEDAY")
    outbound_amount_pct_of_inbound>=80
    // Temporal ordered correlation — use join() in LogScale
    | join({...}, field=account_id, mode=inner)
  splunk: |-
    `comment("Splunk SPL for Cross-Platform Deposit and Withdrawal Chain")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: (selection_inbound and selection_outbound and filter_amount) | temporal(ordered=true, maxspan=4h, by=account_id)")`
    index=flame_banking sourcetype=flame:transaction_monitoring
    event_type="payment_received"
    (inbound_rail="ACH_IN" OR inbound_rail="WIRE_IN" OR inbound_rail="RTP_IN" OR inbound_rail="FEDNOW_IN")
    event_type="instant_payment_initiated"
    (outbound_rail="ZELLE" OR outbound_rail="FEDNOW" OR outbound_rail="RTP" OR outbound_rail="ACH_SAMEDAY")
    outbound_amount_pct_of_inbound>=80
    | transaction account_id maxspan=4h
    | where eventcount >= 2
falsepositives:
- Freelancer receiving ACH payroll and immediately paying rent via Zelle
- Business account receiving wire payment and disbursing to vendors via instant payment
level: high
tags:
- cfpf.phase5.monetization
- attack.t1565
- flame.a2a
