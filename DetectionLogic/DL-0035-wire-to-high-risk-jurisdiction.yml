title: Wire to FATF High-Risk Jurisdiction
id: cbadea79-ead5-4450-bc9e-843779bc773b
status: experimental
description: >
  Detects wire transfers to jurisdictions on the FATF high-risk or increased monitoring
  lists. While not inherently fraudulent, wires to these jurisdictions combined with
  other risk factors (new beneficiary, unusual amount, after-hours) significantly
  elevate the risk of money laundering or fraud monetization.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.fatf-gafi.org/en/countries/black-and-grey-lists.html
threat_paths:
  - TP-0020
  - TP-0006
cfpf_phase: P4
fraud_types:
  - wire-fraud
  - payment-diversion
logsource:
  product: banking
  service: wire_system
detection:
  selection:
    event_type: 'WIRE_INITIATION'
    wire_type: 'international'
    beneficiary_country:
      - 'MM'   # Myanmar
      - 'KP'   # North Korea
      - 'IR'   # Iran
      - 'YE'   # Yemen
      - 'SY'   # Syria
      - 'HT'   # Haiti
      - 'VU'   # Vanuatu
      - 'PH'   # Philippines (increased monitoring)
      - 'NG'   # Nigeria (increased monitoring)
      - 'SS'   # South Sudan
    transaction_amount|gte: 1000
  filter_established_relationship:
    beneficiary_relationship_days|gte: 365
    prior_transaction_count|gte: 10
  condition: selection and not filter_established_relationship
falsepositives:
  - NGOs and charitable organizations with legitimate operations in high-risk countries
  - International companies with established supply chains in monitored jurisdictions
level: high
tags:
  - cfpf.phase4.execution
  - attack.t1657
  - flame.wire_ach
