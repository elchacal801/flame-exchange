title: TDS Cloaking Behavior Detection
id: 7e5b2a49-f8c1-4d36-ae93-1d4f60c82b57
status: experimental
description: >
  Detects domains serving divergent content based on visitor attributes such as
  geolocation, device fingerprint, or user agent, a technique known as cloaking.
  TDS operators serve benign or empty content to security scanner user agents
  (e.g., Googlebot, bingbot, crawlers), datacenter IP ranges, and known security
  vendor IP addresses, while delivering redirects or malicious content to
  residential IP addresses and consumer device fingerprints. This rule identifies
  cloaking by correlating response divergence across multiple request profiles
  to the same URL: when a domain returns substantially different HTTP response
  codes, content lengths, or redirect targets for scanner versus residential
  visitor profiles within a detection window, it indicates intentional cloaking.
  Supports TP-0042 Phase 3 detection of TDS cloaking used to evade automated
  threat scanning and URL reputation systems.
references:
  - https://developers.google.com/search/docs/essentials/cloaking
  - https://www.akamai.com/blog/security/tds-cloaking-evasion-techniques
threat_paths:
  - TP-0042
cfpf_phase: P3
fraud_types:
  - tds-exploitation
logsource:
  product: dns_intelligence
  service: web_proxy
detection:
  selection:
    event_type: 'http_response_divergence'
    target_domain_age_days|lte: 90
  scanner_response:
    visitor_profile: 'scanner'
    response_category|contains:
      - '200_benign'
      - '200_empty'
      - '403_blocked'
  residential_response:
    visitor_profile: 'residential'
    response_category|contains:
      - '302_redirect'
      - '301_redirect'
      - 'javascript_redirect'
      - 'malicious_content'
  content_divergence:
    response_similarity_score|lte: 0.2
  condition: selection and scanner_response and residential_response and content_divergence
falsepositives:
  - Geo-restricted content delivery serving different pages by region legitimately
  - A/B testing platforms serving variant content to different visitor segments
  - Bot management solutions intentionally serving CAPTCHAs to automated traffic
level: high
tags:
  - cfpf.phase3.positioning
  - attack.t1036
  - flame.tds
  - flame.cloaking
