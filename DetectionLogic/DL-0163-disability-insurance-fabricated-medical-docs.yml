title: Disability Insurance Fraud — Fabricated Medical Documentation Provider Anomaly
id: 0e18b1c0-c9eb-413f-be41-d7a262dfa9b9
status: experimental
description: >
  Detects patterns indicative of fabricated medical documentation supporting fraudulent
  disability claims by identifying two key signals: (1) a single medical provider billing
  across multiple claimants with identical or near-identical diagnosis codes (ICD-10),
  suggesting template-driven fabricated documentation rather than genuine clinical variation,
  and (2) claims supported by providers located outside the claimant's geographic area,
  indicating the claimant traveled specifically to a complicit provider or the documentation
  was fabricated remotely. DOJ prosecutions reveal organized disability fraud rings where
  complicit providers generate documentation for dozens of fictitious or exaggerated claims,
  with cumulative payouts in the millions. The long-tail nature of disability payments means
  a single fraudulent claim can generate $100,000+ in benefits before detection. Generative
  AI tools now enable fabrication of convincing medical documentation without provider
  collusion, representing an emerging escalation vector.
sigma_compatible: false
native_query_required: true
references:
  - "DOJ, Disability Fraud Prosecution Records — organized ring case studies"
  - "Coalition Against Insurance Fraud, Annual Reports"
  - "NICB, Insurance Fraud Reporting"
  - "ACFE, Report to the Nations — occupational fraud statistics"
threat_paths:
  - TP-0010
cfpf_phase: P4
fraud_types:
  - fraudulent-claim
  - disability-fraud
  - provider-fraud
logsource:
  product: insurance
  service: claims_management
detection:
  selection:
    claim_type:
      - short_term_disability
      - long_term_disability
    claim_status:
      - open
      - approved
      - in_payment
  filter_provider_diagnosis_concentration:
    provider_identical_diagnosis_claimant_count|gte: 3
  filter_provider_geographic_mismatch:
    provider_claimant_distance_miles|gte: 150
  timeframe: 365d
  condition: >
    selection AND (filter_provider_diagnosis_concentration
    OR filter_provider_geographic_mismatch)
data_sources:
  native_fields:
    - claim_id
    - claimant_id
    - provider_id
    - provider_npi
    - provider_address_zip
    - claimant_address_zip
    - icd10_primary_diagnosis
    - claim_filing_date
    - claim_amount
    - claim_status
    - policy_effective_date
  enrichment_required:
    - field: provider_identical_diagnosis_claimant_count
      source: Count of distinct claimants per provider with identical primary ICD-10 code within rolling 12 months
    - field: provider_claimant_distance_miles
      source: Geographic distance between provider address and claimant residence (ZIP centroid calculation)
    - field: provider_claim_rate_percentile
      source: Provider disability claim support rate relative to specialty peer group
  derived_fields:
    - policy_to_claim_days
    - provider_claimant_ratio
    - diagnosis_concentration_score
queries:
  cql: |-
    // CrowdStrike CQL for Disability Insurance Fraud — Fabricated Medical Documentation
    // Detects provider diagnosis concentration or geographic mismatch patterns
    (claim_type="short_term_disability" OR claim_type="long_term_disability")
    (claim_status="open" OR claim_status="approved" OR claim_status="in_payment")
    (provider_identical_diagnosis_claimant_count>=3 OR provider_claimant_distance_miles>=150)
    | policy_to_claim_days := dateDiff(claim_filing_date, policy_effective_date)
    | groupBy(provider_id, function=[
        collect([claim_id, claimant_id, icd10_primary_diagnosis, claim_amount,
                 provider_claimant_distance_miles, provider_identical_diagnosis_claimant_count,
                 policy_to_claim_days, claim_filing_date]),
        count(claimant_id, distinct=true, as=unique_claimants)
      ])
    | sort(unique_claimants, order=desc)
  splunk: |-
    `comment("Splunk SPL for Disability Insurance Fraud — Fabricated Medical Documentation")`
    `comment("Detects providers with identical diagnoses across multiple claimants or geographic anomalies")`
    index=flame_insurance sourcetype=flame:claims_management
      (claim_type="short_term_disability" OR claim_type="long_term_disability")
      (claim_status="open" OR claim_status="approved" OR claim_status="in_payment")
    | eval policy_to_claim_days = round((strptime(claim_filing_date, "%Y-%m-%d") - strptime(policy_effective_date, "%Y-%m-%d")) / 86400)
    | stats dc(claimant_id) AS unique_claimants
        values(claimant_id) AS claimants
        values(claim_amount) AS claim_amounts
        avg(provider_claimant_distance_miles) AS avg_distance
        BY provider_id, icd10_primary_diagnosis
    | where unique_claimants >= 3 OR avg_distance >= 150
    | eval risk_score = case(
        unique_claimants >= 5 AND avg_distance >= 150, "critical",
        unique_claimants >= 5, "high",
        avg_distance >= 300, "high",
        1=1, "medium")
    | table provider_id, icd10_primary_diagnosis, unique_claimants,
            claimants, claim_amounts, avg_distance, risk_score
    | sort - unique_claimants
  sql: |-
    -- SQL for Disability Insurance Fraud — Fabricated Medical Documentation
    -- Detects provider diagnosis concentration or geographic mismatch patterns
    WITH provider_analysis AS (
      SELECT
        c.provider_id,
        c.icd10_primary_diagnosis,
        COUNT(DISTINCT c.claimant_id) AS unique_claimants,
        COUNT(c.claim_id) AS total_claims,
        SUM(c.claim_amount) AS total_claim_amount,
        AVG(g.provider_claimant_distance_miles) AS avg_distance_miles,
        AVG(DATEDIFF(DAY, p.effective_date, c.claim_filing_date)) AS avg_policy_to_claim_days
      FROM disability_claims c
      JOIN policies p ON c.policy_id = p.policy_id
      JOIN provider_claimant_geography g ON c.provider_id = g.provider_id
        AND c.claimant_id = g.claimant_id
      WHERE c.claim_type IN ('short_term_disability', 'long_term_disability')
        AND c.claim_status IN ('open', 'approved', 'in_payment')
        AND c.claim_filing_date >= DATEADD(YEAR, -1, CURRENT_DATE)
      GROUP BY c.provider_id, c.icd10_primary_diagnosis
    )
    SELECT *
    FROM provider_analysis
    WHERE unique_claimants >= 3
       OR avg_distance_miles >= 150
    ORDER BY unique_claimants DESC, avg_distance_miles DESC
falsepositives:
  - Specialist providers legitimately treating patients with the same condition (e.g., orthopedic surgeons with high back injury volume)
  - Rural claimants who must travel long distances to see specialists not available locally
  - Telehealth providers with geographically dispersed patient bases
  - Occupational health providers serving a single large employer with common workplace injuries
level: high
tags:
  - attack.t1657
  - cfpf.phase4.execution
  - flame.disability-fraud
  - flame.provider-fraud
  - flame.fabricated-documentation
