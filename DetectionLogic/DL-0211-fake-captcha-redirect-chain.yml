title: "Fake CAPTCHA Campaign Redirect Chain Detection"
id: "c2823f3b-4a85-4689-89eb-e54984aefae1"
status: experimental
description: >
  Detect web access patterns consistent with fake CAPTCHA campaigns: user visits
  a page with CAPTCHA verification UI, is instructed to copy/execute clipboard
  content (PowerShell, cmd, mshta), which triggers malware or stealer download.
  CrowdStrike documented a +563% increase in fake CAPTCHA campaigns in 2025.
  Used by BRASH SPIDER (Doshell Stealer) and COOKIE SPIDER (SHAMOS).
references:
  - "https://www.crowdstrike.com/en-us/global-threat-report/"
threat_paths:
  - TP-0081
cfpf_phase: P2
fraud_types:
  - social-engineering
  - credential-harvesting
  - fake-captcha-fraud
logsource:
  product: banking
  service: endpoint_monitoring
detection:
  selection:
    process_parent|re: "chrome.exe|firefox.exe|msedge.exe|brave.exe|opera.exe"
    process_child|re: "powershell.exe|cmd.exe|mshta.exe"
    referrer_page|contains:
      - captcha
      - verify
      - check
      - human
  temporal_correlation:
    max_seconds: 60
    sequence:
      - browser_visit_suspicious_page
      - clipboard_execution
  condition: selection and temporal_correlation
falsepositives:
  - "Legitimate CAPTCHA services followed by coincidental command execution"
  - "Developer workflows involving browser-based tools and terminal commands"
sigma_compatible: true
level: high
tags:
  - cfpf.phase2.initial_access
  - flame.endpoint
  - attack.t1204
