title: Synthetic Identity Credit Utilization Spike — Low-and-Slow Buildup Followed by Bust-Out
id: e6e36d6c-d779-4af5-b8bf-4a3bd480061d
status: experimental
description: >
  Detects the characteristic synthetic identity bust-out pattern: prolonged low credit
  utilization (< 35% for 6+ months) followed by a rapid spike to near-maximum utilization
  (> 80%) within 30 days. Synthetic identity fraudsters nurture credit profiles over 12-24
  months with steady payments and low utilization, then execute a coordinated bust-out where
  all available credit is maxed simultaneously. The Federal Reserve estimates synthetic
  identity fraud costs U.S. lenders $6B+ annually. The discontinuous utilization jump
  from a stable baseline is the hallmark behavioral indicator.
sigma_compatible: false
native_query_required: true
references:
  - "Federal Reserve, Synthetic Identity Fraud in the U.S. Payment System (2024)"
  - "OCC, Comptroller's Handbook: Credit Card Lending — Synthetic Identity Red Flags"
  - "UNODC, Organized Fraud — Issue Paper (Vienna, 2024)"
threat_paths:
  - TP-0003
  - TP-0016
cfpf_phase: P4
fraud_types:
  - synthetic-identity
  - bust-out
  - credit-card-fraud
logsource:
  product: banking
  service: credit_monitoring
detection:
  selection:
    account_type:
      - consumer_credit
      - credit_card
  filter_utilization_history:
    trailing_6m_avg_utilization_pct|lt: 35
  filter_current_spike:
    current_utilization_pct|gte: 80
  filter_previous_month:
    previous_month_utilization_pct|lt: 50
  timeframe: 30d
  condition: >
    selection AND filter_utilization_history AND filter_current_spike
    AND filter_previous_month
data_sources:
  native_fields:
    - account_id
    - account_type
    - credit_limit
    - current_balance
    - current_utilization_pct
    - account_open_date
    - payment_history_months
  enrichment_required:
    - field: trailing_6m_avg_utilization_pct
      source: Rolling 6-month average utilization from credit bureau or internal reporting
    - field: previous_month_utilization_pct
      source: Prior month-end utilization snapshot
  derived_fields:
    - utilization_jump_pct
    - months_at_low_utilization
queries:
  cql: |-
    // CrowdStrike CQL for Synthetic Identity Credit Utilization Spike
    // Detects bust-out pattern: 6+ months low utilization then rapid spike
    (account_type="consumer_credit" OR account_type="credit_card")
    trailing_6m_avg_utilization_pct<35
    current_utilization_pct>=80
    previous_month_utilization_pct<50
    | utilization_jump_pct := current_utilization_pct - previous_month_utilization_pct
    | months_at_low_utilization := payment_history_months
    | groupBy(account_id, function=[
        collect([credit_limit, current_balance, current_utilization_pct,
                 trailing_6m_avg_utilization_pct, utilization_jump_pct,
                 account_open_date])
      ])
    | sort(utilization_jump_pct, order=desc)
  splunk: |-
    `comment("Splunk SPL for Synthetic Identity Credit Utilization Spike")`
    `comment("Detects 6+ months low utilization followed by rapid spike to >80%")`
    index=flame_banking sourcetype=flame:credit_monitoring
      (account_type="consumer_credit" OR account_type="credit_card")
      trailing_6m_avg_utilization_pct<35
      current_utilization_pct>=80
      previous_month_utilization_pct<50
    | eval utilization_jump = current_utilization_pct - previous_month_utilization_pct
    | eval risk_score = case(
        utilization_jump > 70 AND trailing_6m_avg_utilization_pct < 20, "critical",
        utilization_jump > 50, "high",
        1=1, "medium")
    | table account_id, account_type, credit_limit, current_balance,
            current_utilization_pct, trailing_6m_avg_utilization_pct,
            previous_month_utilization_pct, utilization_jump,
            account_open_date, risk_score
    | sort - utilization_jump
  sql: |-
    -- SQL for Synthetic Identity Credit Utilization Spike
    -- Detects bust-out pattern: prolonged low utilization then rapid spike
    SELECT
      a.account_id,
      a.account_type,
      a.credit_limit,
      a.current_balance,
      a.current_utilization_pct,
      h.trailing_6m_avg_utilization_pct,
      h.previous_month_utilization_pct,
      (a.current_utilization_pct - h.previous_month_utilization_pct) AS utilization_jump,
      a.account_open_date,
      DATEDIFF(MONTH, a.account_open_date, CURRENT_DATE) AS account_age_months
    FROM credit_accounts a
    JOIN credit_utilization_history h ON a.account_id = h.account_id
    WHERE a.account_type IN ('consumer_credit', 'credit_card')
      AND h.trailing_6m_avg_utilization_pct < 35
      AND a.current_utilization_pct >= 80
      AND h.previous_month_utilization_pct < 50
    ORDER BY utilization_jump DESC
falsepositives:
  - Legitimate large purchases (wedding, home renovation) causing temporary utilization spike
  - Consumers consolidating debt via balance transfer to a single card
  - Emergency medical expenses
level: high
tags:
  - attack.t1657
  - cfpf.phase4.execution
  - flame.synthetic-identity
  - flame.bust-out
