title: Automated Mule Account Creation Velocity
id: d4e5f6a7-b8c9-4d0e-1f2a-3b4c5d6e7f8a
status: experimental
description: 'Detect automated account opening patterns indicative of mule account infrastructure buildout: (1) multiple applications
  originating from the same device fingerprint or IP address within a 24-hour window, (2) KYC document metadata anomalies such as
  identical creation timestamps or template-based formatting, (3) application completion in under 2 minutes suggesting automation,
  (4) absence of mouse movement or scroll events with rapid sequential field completion indicating bot-driven form filling.

  '
date: 2026/03/20
sigma_compatible: false
native_query_required: true
threat_paths:
- TP-0059
cfpf_phase: P2
fraud_types:
- automated-mule-infrastructure
- new-account-fraud
- application-fraud
logsource:
  product: banking
  category: account_lifecycle
  service: account_onboarding
detection:
  selection_speed:
    application_duration_seconds|lt: 120
  selection_velocity:
    device_applications_24h|gt: 3
  selection_bot:
    mouse_events_count: 0
    scroll_events_count: 0
    field_completion_rate_ms|lt: 500
  selection_document:
    kyc_document_metadata_anomaly: true
  condition: selection_speed or selection_velocity or (selection_bot and selection_document)
data_sources:
  native_fields:
  - application_duration_seconds
  - device_applications_24h
  - mouse_events_count
  - scroll_events_count
  - field_completion_rate_ms
  - kyc_document_metadata_anomaly
  enrichment_required:
  - field: device_applications_24h
    source: Device intelligence enrichment (application count per device fingerprint in 24h)
  - field: kyc_document_metadata_anomaly
    source: Document analysis enrichment (metadata consistency and template detection)
queries:
  cql: |-
    // CrowdStrike CQL for Automated Mule Account Creation Velocity
    // Repository: flame-banking-account-onboarding
    // Aggregation that cannot be expressed in Sigma
    application_duration_seconds<120 OR mouse_events_count=0 OR scroll_events_count=0
    | groupBy([device_fingerprint, ip_address], function=[
        count(as=app_count),
        countDistinct(applicant_id, as=unique_applicants),
        collect(applicant_id),
        avg(application_duration_seconds, as=avg_duration),
        min(application_duration_seconds, as=min_duration),
        sum(mouse_events_count, as=total_mouse_events)
      ])
    | app_count>3 OR (avg_duration<120 AND total_mouse_events=0)
    | case {
        app_count>10 | risk_level:="critical";
        app_count>5 | risk_level:="high";
        app_count>3 | risk_level:="medium";
      }
  splunk: |-
    `comment("Splunk SPL for Automated Mule Account Creation Velocity")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    index=flame_banking sourcetype=flame:account_onboarding
    (application_duration_seconds<120 OR mouse_events_count=0 OR scroll_events_count=0)
    | stats count as app_count dc(applicant_id) as unique_applicants values(applicant_id) as applicants
      avg(application_duration_seconds) as avg_duration min(application_duration_seconds) as min_duration
      sum(mouse_events_count) as total_mouse_events by device_fingerprint ip_address
    | where app_count>3 OR (avg_duration<120 AND total_mouse_events=0)
    | eval risk_level=case(app_count>10, "critical", app_count>5, "high", app_count>3, "medium")
falsepositives:
- Legitimate batch account opening by businesses or payroll providers
- Accessibility tools that bypass standard mouse interaction
- Corporate onboarding processes using automated form-filling
level: high
tags:
- attack.t1589
- cfpf.phase2.initial_access
- mule-account
- bot-detection
- velocity
- automation
- TP-0059
