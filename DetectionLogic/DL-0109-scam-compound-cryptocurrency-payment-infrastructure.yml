  transaction verification) registered in bulk through shared registrar/nameserver infrastructure.

  '
date: 2026/03/05
sigma_compatible: true
threat_paths:
- TP-0047
cfpf_phase: P4
fraud_types:
- human-trafficking-facilitation
- crypto-laundering
logsource:
