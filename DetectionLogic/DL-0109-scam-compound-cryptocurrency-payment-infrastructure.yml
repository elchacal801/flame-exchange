  - field: bulk_registered_domains
    source: DNS analytics enrichment (bulk registration detection)
  - field: crypto_payment_indicators
    source: Payment analytics enrichment (crypto payment detection indicators)
  - field: shared_ns_infrastructure
    source: DNS analytics enrichment (shared nameserver detection)
falsepositives:
- Legitimate cryptocurrency payment processors
- Merchant crypto payment gateway deployments
level: high
tags:
