title: Round-Dollar Wire Amount Pattern
id: f68065c0-e598-4a1b-b5b2-132b8ca3c448
status: experimental
description: >
  Detects unusual patterns of wire transfers in round dollar amounts (e.g., $5,000,
  $10,000, $25,000). While individual round-amount wires are common, a pattern of
  multiple round-amount wires is atypical for legitimate business payments and may
  indicate structured or test transactions by fraudsters.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.fincen.gov/sites/default/files/shared/CTR_Overview.pdf
threat_paths:
  - TP-0002
  - TP-0006
cfpf_phase: P4
fraud_types:
  - wire-fraud
  - payment-diversion
logsource:
  product: banking
  service: wire_system
detection:
  selection:
    event_type: 'WIRE_INITIATION'
    transaction_amount|gte: 1000
    transaction_amount_is_round: true
  timeframe: 30d
  condition: selection | count() by account_id > 4
falsepositives:
  - Loan disbursements or payments that are inherently round amounts
  - Recurring fixed-amount business payments (rent, retainers)
level: medium
tags:
  - cfpf.phase4.execution
  - attack.t1657
  - flame.wire_ach
