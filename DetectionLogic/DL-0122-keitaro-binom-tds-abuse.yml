title: Keitaro/Binom TDS Abuse Infrastructure Detection
id: b8c9d0e1-f2a3-4b4c-5d6e-7f8a9b0c1d2e
status: experimental
description: 'Detect abuse of legitimate Traffic Distribution Systems Keitaro and Binom for fraud infrastructure: (1) HTTP redirect
  chains containing Keitaro tracking parameters such as click_id, campaign_id, and characteristic Keitaro URL path structures,
  (2) domains resolving to IP addresses associated with Keitaro or Binom hosting infrastructure, (3) redirect chain behavior
  patterns matching cloaking and visitor fingerprinting techniques used to evade security researchers while directing victims
  to investment scam landing pages.

  '
date: 2026/03/20
sigma_compatible: false
native_query_required: true
threat_paths:
- TP-0060
- TP-0042
cfpf_phase: P2
fraud_types:
- tds-exploitation
- investment-tds-pipeline
logsource:
  product: web_proxy
  category: web_traffic
  service: http_log
detection:
  selection_keitaro_params:
    url_query|contains:
    - click_id=
    - campaign_id=
    - keitaro
    - /go/
    url_path|contains:
    - /tracker/
    - /click/
    - /go/
  selection_binom_params:
    url_query|contains:
    - binom
    - cnv_id=
    url_path|contains:
    - /click.php
    - /conversion.php
  selection_redirect_chain:
    redirect_chain_length|gte: 3
    redirect_chain_tds_fingerprint: true
    final_destination_domain_age_days|lt: 30
  condition: (selection_keitaro_params or selection_binom_params) and selection_redirect_chain
data_sources:
  native_fields:
  - url_query
  - url_path
  - redirect_chain_length
  - redirect_chain_tds_fingerprint
  - final_destination_domain_age_days
  enrichment_required:
  - field: redirect_chain_tds_fingerprint
    source: Web proxy enrichment (TDS redirect pattern fingerprinting)
  - field: final_destination_domain_age_days
    source: WHOIS enrichment (domain registration age for final redirect destination)
queries:
  cql: |-
    // CrowdStrike CQL for Keitaro/Binom TDS Abuse Infrastructure Detection
    // Repository: flame-proxy-http-log
    // HTTP redirect chain analysis for TDS abuse patterns
    (url_query=/click_id=|campaign_id=|keitaro|binom|cnv_id=/)
    OR (url_path=/\/tracker\/|\/click\/|\/go\/|\/click\.php/)
    | selfJoinFilter(session_id, where=[{url_query=/keitaro/ OR url_path=/\/tracker\//} {url_query=/binom/ OR url_path=/\/click\.php/}])
    | groupBy([session_id, src_ip], function=[
        count(as=redirect_count),
        collect([url, final_destination])
      ])
    | redirect_count>=3
  splunk: |-
    `comment("Splunk SPL for Keitaro/Binom TDS Abuse Infrastructure Detection")`
    `comment("HTTP redirect chain analysis for TDS abuse patterns")`
    index=flame_proxy sourcetype=flame:http_log
    (url_query="*click_id=*" OR url_query="*campaign_id=*" OR url_query="*keitaro*" OR url_query="*binom*" OR url_query="*cnv_id=*")
    OR (url_path="*/tracker/*" OR url_path="*/click/*" OR url_path="*/go/*" OR url_path="*/click.php*")
    | transaction session_id maxspan=30s
    | where eventcount>=3
    | eval redirect_chain=mvjoin(url, " -> ")
    | eval has_keitaro=if(like(url_query, "%keitaro%") OR like(url_path, "%/tracker/%"), 1, 0)
    | eval has_binom=if(like(url_query, "%binom%") OR like(url_path, "%/click.php%"), 1, 0)
    | where has_keitaro=1 OR has_binom=1
    | stats count values(redirect_chain) as chains values(final_destination) as destinations by src_ip session_id
falsepositives:
- Legitimate digital marketing campaigns using Keitaro or Binom for affiliate analytics
- Performance marketing redirect chains for authorized advertising
level: medium
tags:
- attack.t1583.001
- attack.t1090.003
- cfpf.phase2.initial_access
- keitaro
- binom
- tds
- investment-scam
- cloaking
- redirect-chain
- TP-0060
- TP-0042
