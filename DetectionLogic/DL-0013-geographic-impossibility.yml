title: Geographic Impossibility Login
id: ee20082a-9729-4d14-bd2e-642e837edafe
status: experimental
description: 'Detects login attempts from geographically impossible locations within a short timeframe. When a user authenticates
  from one country and a second authentication occurs from a distant country within a window that makes physical travel impossible,
  it strongly indicates credential compromise and concurrent use by an attacker.

  '
sigma_compatible: false
native_query_required: true
references:
- https://attack.mitre.org/techniques/T1078/
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
- TP-0013
- TP-0008
cfpf_phase: P2
fraud_types:
- credential-stuffing
- account-takeover
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type|contains:
    - login_success
    - login_attempt
  timeframe: 60m
  condition: selection
data_sources:
  native_fields:
  - event_type
queries:
  cql: |-
    // CrowdStrike CQL for Geographic Impossibility Login
    // Repository: flame-banking-auth-logs
    // Groups logins by user within 60m windows and flags when
    // multiple distinct countries appear (physical travel impossible)
    (event_type="login_success" OR event_type="login_attempt")
    | groupBy(user_id, function=[
        count(as=login_count),
        collect([geo_country, src_ip, @timestamp]),
        selectFirst(geo_country, as=first_country),
        selectLast(geo_country, as=last_country),
        min(@timestamp, as=first_time),
        max(@timestamp, as=last_time)
      ], span=60m)
    | login_count >= 2
    | first_country != last_country
  splunk: |-
    `comment("Splunk SPL for Geographic Impossibility Login")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection | near by user_id | where geo_distance(src.geo_lat, src.geo_lon, dst.geo_lat, dst.geo_lon) > 1000 and time_diff < 60m")`
    index=flame_banking sourcetype=flame:auth_logs (event_type="login_success" OR event_type="login_attempt")
    | transaction user_id maxspan=60m
    | where eventcount >= 2
falsepositives:
- Users employing VPN services that change egress country between sessions
- Corporate proxy chains routing through geographically distributed data centers
level: high
tags:
- cfpf.phase2.initial_access
- attack.t1078
- attack.t1110.004
