title: Politically-Motivated DDoS Financial Sector Targeting
id: e7a24b16-f893-4d2c-9a05-3c6e8f1b47d2
status: experimental
description: 'Detect Layer 7 DNS attack patterns targeting financial services infrastructure that correlate with geopolitical
  event timelines. Differentiates politically motivated DDoS from criminal extortion DDoS by examining claim attribution (Telegram
  channel claims), target selection patterns (geopolitically aligned targets), and timing correlation with political events.

  '
date: 2026/03/05
sigma_compatible: true
threat_paths:
- TP-0046
cfpf_phase: P4
fraud_types:
- state-criminal-convergence
logsource:
  product: dns_intelligence
  category: ddos_detection
  service: l7_dns_monitoring
detection:
  selection:
    l7_dns_query_volume_ratio|gte: 10.0
    target_is_financial_services: true
    geopolitical_event_within|lte: 72h
  condition: selection and timing_correlation
data_sources:
  enrichment_required:
  - field: geopolitical_event_within
    source: Geopolitical enrichment (temporal proximity to geopolitical events)
  - field: l7_dns_query_volume_ratio
    source: DNS analytics enrichment (L7 query volume ratio calculation)
  - field: target_is_financial_services
    source: Target classification enrichment (industry classification lookup)
falsepositives:
- Legitimate traffic spikes during financial events (market crashes, IPOs)
- CDN misconfigurations causing query amplification
level: high
tags:
- cfpf.phase4.execution
- attack.t1498
- ddos
- l7-dns
- politically-motivated
- financial-sector
- geopolitical-timing
- noname057
- TP-0046
