title: Distributed Credential Stuffing
id: 4802a77f-cc87-4dc5-b861-aacaf4a21d7c
status: experimental
description: 'Detects low-and-slow distributed credential stuffing attacks spread across multiple source IPs to evade per-IP
  rate limiting. Advanced attackers use residential proxy networks and botnets to distribute attempts, making each source
  IP appear benign while the aggregate attack targets many accounts. This rule aggregates failed login patterns across source
  IPs sharing common characteristics.

  '
sigma_compatible: false
native_query_required: true
references:
- https://attack.mitre.org/techniques/T1110/004/
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
- TP-0013
- TP-0001
cfpf_phase: P2
fraud_types:
- credential-stuffing
- account-takeover
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type: login_attempt
    auth_result: failure
  selection_characteristics:
    user_agent|re: ^Mozilla/5\.0.*$
  timeframe: 30m
  condition: selection and selection_characteristics
data_sources:
  native_fields:
  - auth_result
  - event_type
  - user_agent
queries:
  logscale: |-
    // LogScale LQL for Distributed Credential Stuffing
    // Repository: flame-banking-auth-logs
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: selection and selection_characteristics | count(distinct source_ip) by user_agent > 20 and count(distinct username) by user_agent > 50 and max(count() by source_ip) < 5
    event_type="login_attempt"
    auth_result="failure"
    user_agent=/^Mozilla/5\.0.*$/
    | groupBy(user_agent, function=[count(as=event_count), collect(source_ip)])
    | event_count > 20
    | groupBy(user_agent, function=[count(as=event_count), collect(username)])
    | event_count > 50
  splunk: |-
    `comment("Splunk SPL for Distributed Credential Stuffing")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection and selection_characteristics | count(distinct source_ip) by user_agent > 20 and count(distinct username) by user_agent > 50 and max(count()")`
    index=flame_banking sourcetype=flame:auth_logs
    event_type="login_attempt"
    auth_result="failure"
    user_agent="^Mozilla/5\.0.*$"
    | stats dc(source_ip) as unique_source_ip by user_agent
    | where unique_source_ip > 20
    | stats dc(username) as unique_username by user_agent
    | where unique_username > 50
falsepositives:
- Large-scale legitimate user activity from a popular browser version during peak hours
- CDN or reverse-proxy traffic aggregation that normalizes user-agent strings
level: medium
tags:
- cfpf.phase2.initial_access
- attack.t1110.004
- attack.t1090
