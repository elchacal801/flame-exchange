title: Rapid Wallet Fan-Out Exceeding 100 Wallets Post-Theft
id: 3842538a-7ffb-4c3e-a690-e2de5d80c507
status: experimental
description: >
  Detects when a single wallet or cluster distributes funds across 100+ new wallets within 48 hours
  following a large-value transfer (>$1M). Directly models the DPRK Bybit laundering pattern where
  PRESSURE CHOLLIMA distributed stolen funds across 125,000+ Ethereum wallets. Existing DL-0196 and
  DL-0197 cover CEX off-ramp detection; this rule covers the upstream distancing and layering phase.
references:
  - "CrowdStrike 2026 Global Threat Report (PRESSURE CHOLLIMA Bybit case)"
  - "FATF Targeted Report on Stablecoins and Unhosted Wallets (March 2026)"
threat_paths:
  - TP-0049
  - TP-0044
  - TP-0080
cfpf_phase: P4
fraud_types:
  - crypto-laundering
  - state-criminal-convergence
logsource:
  product: crypto
  service: blockchain_analytics
detection:
  selection:
    source_wallet: "*"
    unique_destination_count|gte: 100
    timeframe_hours|lte: 48
    total_amount_usd|gte: 1000000
  aggregation:
    operation: "count(distinct destination_wallet) by source_wallet_cluster"
    timeframe: 48h
  condition: selection
falsepositives:
  - "Exchange hot wallet distributions to customer withdrawal addresses"
  - "Airdrop campaigns distributing tokens to large recipient lists"
  - "Payroll distributions from corporate treasury wallets"
sigma_compatible: true
level: critical
tags:
  - cfpf.phase4.execution
  - flame.crypto
  - flame.critical
