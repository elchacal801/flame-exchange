title: Organized Insurance Claims Fraud — Shared Professional Enablers and Claim Timing Clustering Around Policy Inception
id: 5355b27b-ffb9-4ccd-b3de-7e6c3ac312ad
status: experimental
description: >
  Detects organized insurance claims fraud patterns where the same claimant or provider appears
  across multiple claims with shared professional enablers (medical provider, legal representative,
  repair shop), or where claim timing is clustered around policy inception. INTERPOL's 2026 Global
  Financial Fraud Threat Assessment identifies insurance fraud — notably car and medical insurance
  claims — as escalating globally, with Europe most impacted: the UK recorded a 25% spike in motor
  insurance fraud in early 2025, France detected nearly USD 1 billion in fraud in 2024, and German
  insurers flagged 10% of claims as suspicious with annual losses exceeding USD 7 billion. The
  detection logic targets two primary signatures: (1) network analysis identifying claimants,
  providers, legal representatives, or repair shops appearing across multiple claims — indicating
  an organized fraud ring with division of labor; and (2) temporal analysis identifying claims
  filed within 90 days of policy inception with high severity, which indicates opportunistic
  application fraud followed by immediate fraudulent claim filing. The combination of shared
  enablers and inception-proximate timing is a strong indicator of organized ring activity.
sigma_compatible: false
native_query_required: true
references:
  - "INTERPOL Global Financial Fraud Threat Assessment, 2nd Edition, March 2026 — Insurance Fraud"
  - "CIFAS, AI fuels surge in identity fraud — Fraudscape six-month report, August 2025"
  - "ALFA, Fraude a l'assurance, August 2025"
  - "GDV, Insurance fraud causes damage of over six billion euros a year, May 2024"
  - "NICB — National Insurance Crime Bureau fraud detection resources"
threat_paths:
  - TP-0056
cfpf_phase: P4
fraud_types:
  - insurance-fraud
  - fraudulent-claim
  - staged-accident
  - documentary-fraud
logsource:
  product: insurance
  service: claims_management
detection:
  selection:
    claim_type:
      - motor
      - medical
      - personal_injury
  filter_shared_enablers:
    shared_provider_across_claims|gte: 2
    shared_legal_rep_across_claims|gte: 2
  filter_claimant_recurrence:
    claimant_claim_count_24m|gte: 3
  filter_inception_proximity:
    days_from_inception_to_claim|lte: 90
    claim_severity:
      - high
      - total_loss
  timeframe: 24m
  condition: >
    selection AND (filter_shared_enablers
    OR filter_claimant_recurrence
    OR filter_inception_proximity)
data_sources:
  native_fields:
    - claim_id
    - policy_id
    - claimant_id
    - claimant_name
    - claim_type
    - claim_date
    - incident_date
    - claim_amount
    - claim_severity
    - policy_inception_date
    - provider_id
    - provider_name
    - legal_representative_id
    - legal_representative_name
    - repair_shop_id
    - repair_shop_name
  enrichment_required:
    - field: shared_provider_across_claims
      source: Count of distinct claims sharing the same medical provider within 24-month window
    - field: shared_legal_rep_across_claims
      source: Count of distinct claims sharing the same legal representative within 24-month window
    - field: claimant_claim_count_24m
      source: Count of claims filed by the same claimant across all insurers in trailing 24 months (requires cross-insurer data sharing)
    - field: days_from_inception_to_claim
      source: Days between policy inception date and first claim filing date
    - field: cross_insurer_participant_match
      source: Boolean flag if claimant or enabler appears in cross-insurer fraud database (IFB, NICB)
  derived_fields:
    - enabler_network_score
    - inception_proximity_flag
    - geographic_cluster_id
queries:
  cql: |-
    // CrowdStrike CQL for Organized Insurance Claims Fraud
    // Detects shared professional enablers and inception-proximate claim patterns
    (claim_type="motor" OR claim_type="medical" OR claim_type="personal_injury")
    | days_from_inception := dateDiff(policy_inception_date, claim_date, unit="days")
    | groupBy(provider_id, function=[
        count(claim_id, as=provider_claim_count),
        collect([claimant_id, claim_amount, claim_date])
      ])
    | provider_claim_count >= 2
    | join({
        (claim_type="motor" OR claim_type="medical" OR claim_type="personal_injury")
        | groupBy(claimant_id, function=[
            count(claim_id, as=claimant_claim_count),
            collect([provider_id, legal_representative_id, claim_amount])
          ])
        | claimant_claim_count >= 3
      }, field=claimant_id)
    | sort(provider_claim_count, order=desc)
  splunk: |-
    `comment("Splunk SPL for Organized Insurance Claims Fraud")`
    `comment("Detects shared enablers and inception-proximate claims indicating organized ring")`
    index=flame_insurance sourcetype=flame:claims_management
      (claim_type="motor" OR claim_type="medical" OR claim_type="personal_injury")
    | eval days_from_inception = round((strptime(claim_date, "%Y-%m-%d") - strptime(policy_inception_date, "%Y-%m-%d")) / 86400, 0)
    | eval inception_flag = if(days_from_inception <= 90 AND (claim_severity="high" OR claim_severity="total_loss"), 1, 0)
    | stats dc(claim_id) AS claim_count,
            sum(claim_amount) AS total_claimed,
            dc(claimant_id) AS unique_claimants,
            dc(policy_id) AS unique_policies,
            values(claimant_name) AS claimants,
            values(claim_type) AS claim_types,
            avg(days_from_inception) AS avg_days_from_inception,
            sum(inception_flag) AS inception_proximate_claims
      BY provider_id, provider_name, legal_representative_id
    | where claim_count >= 2
    | eval risk_score = case(
        claim_count >= 5 AND inception_proximate_claims >= 2, "critical",
        claim_count >= 3 AND unique_claimants >= 3, "high",
        inception_proximate_claims >= 1, "high",
        1=1, "medium")
    | table provider_id, provider_name, legal_representative_id,
            claim_count, total_claimed, unique_claimants, unique_policies,
            claim_types, avg_days_from_inception, inception_proximate_claims, risk_score
    | sort - claim_count
  sql: |-
    -- SQL for Organized Insurance Claims Fraud
    -- Detects shared professional enablers and claim timing clustered around policy inception
    WITH enabler_network AS (
      SELECT
        c.provider_id,
        p.provider_name,
        c.legal_representative_id,
        lr.representative_name,
        COUNT(DISTINCT c.claim_id) AS claim_count,
        COUNT(DISTINCT c.claimant_id) AS unique_claimants,
        COUNT(DISTINCT c.policy_id) AS unique_policies,
        SUM(c.claim_amount) AS total_claimed,
        AVG(DATEDIFF('day', pol.inception_date, c.claim_date)) AS avg_days_from_inception,
        COUNT(CASE WHEN DATEDIFF('day', pol.inception_date, c.claim_date) <= 90
                    AND c.claim_severity IN ('high', 'total_loss')
                   THEN 1 END) AS inception_proximate_claims
      FROM claims c
      JOIN policies pol ON c.policy_id = pol.policy_id
      LEFT JOIN providers p ON c.provider_id = p.provider_id
      LEFT JOIN legal_representatives lr ON c.legal_representative_id = lr.representative_id
      WHERE c.claim_type IN ('motor', 'medical', 'personal_injury')
        AND c.claim_date > CURRENT_DATE - INTERVAL '24 months'
      GROUP BY c.provider_id, p.provider_name, c.legal_representative_id, lr.representative_name
      HAVING COUNT(DISTINCT c.claim_id) >= 2
    ),
    claimant_recurrence AS (
      SELECT
        c.claimant_id,
        c.claimant_name,
        COUNT(DISTINCT c.claim_id) AS claimant_claim_count,
        COUNT(DISTINCT c.insurer_id) AS insurers_involved,
        SUM(c.claim_amount) AS claimant_total_claimed,
        ARRAY_AGG(DISTINCT c.provider_id) AS providers_used,
        ARRAY_AGG(DISTINCT c.legal_representative_id) AS legal_reps_used
      FROM claims c
      WHERE c.claim_type IN ('motor', 'medical', 'personal_injury')
        AND c.claim_date > CURRENT_DATE - INTERVAL '24 months'
      GROUP BY c.claimant_id, c.claimant_name
      HAVING COUNT(DISTINCT c.claim_id) >= 3
    )
    SELECT
      en.provider_id,
      en.provider_name,
      en.legal_representative_id,
      en.representative_name,
      en.claim_count,
      en.unique_claimants,
      en.unique_policies,
      en.total_claimed,
      en.avg_days_from_inception,
      en.inception_proximate_claims,
      cr.claimant_id,
      cr.claimant_claim_count,
      cr.insurers_involved
    FROM enabler_network en
    LEFT JOIN claimant_recurrence cr
      ON cr.claimant_id = ANY(
        SELECT DISTINCT claimant_id FROM claims
        WHERE provider_id = en.provider_id
          AND claim_date > CURRENT_DATE - INTERVAL '24 months'
      )
    ORDER BY en.claim_count DESC, en.total_claimed DESC
falsepositives:
  - High-volume legitimate medical providers (emergency rooms, urgent care clinics) naturally appearing across many claims
  - Law firms specializing in personal injury that legitimately represent many claimants
  - Legitimate repair shops in areas with high accident rates appearing across multiple motor claims
  - New policyholders who experience genuine accidents shortly after policy inception
level: high
tags:
  - attack.t1657
  - cfpf.phase4.execution
  - flame.insurance-fraud
  - flame.staged-accident
  - flame.organized-fraud-ring
  - flame.false-claims
