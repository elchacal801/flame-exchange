title: Ghost Patient Claims and Geographic Provider Clustering Detection
id: b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e
status: experimental
description: 'Detects two healthcare fraud patterns: (1) Ghost patient claims —
  Medicare/Medicaid claims submitted for deceased, incarcerated, or relocated beneficiaries
  who could not have received the billed services. Operation Gold Rush exploited over
  1 million stolen American identities including elderly and disabled individuals.
  (2) Geographic provider clustering — ZIP codes with anomalous concentrations of
  healthcare providers and high average billing per provider, indicating shell company
  clustering. LA County has 1,923 registered hospice providers (more than 36 states
  combined), with 7 of 14 entities in one LA plaza having zero CMS data. GAO reports
  found approximately 22% of practice locations in PECOS were potentially ineligible
  including UPS Store mailboxes and vacant addresses. Source: CrimsonVector Security
  March 2026; DOJ 2025 National Healthcare Fraud Takedown; GAO-15-448.

  '
references:
- https://www.justice.gov/criminal/criminal-fraud/health-care-fraud-enforcement
- https://www.gao.gov/products/gao-15-448
date: 2026/03/21
sigma_compatible: false
native_query_required: true
threat_paths:
- TP-0028
- TP-0021
cfpf_phase: P3
fraud_types:
- healthcare-fraud
- phantom-billing
- hospice-fraud
- provider-fraud
logsource:
  product: claims_processing
  category: medicare_claims_system
  service: cms_claims
detection:
  selection_ghost_patient:
    beneficiary_status|contains:
    - deceased
    - incarcerated
    - relocated
    claim_service_date_after_status_change: true
  selection_geographic_clustering:
    providers_per_zip|gte: 10
    avg_billing_per_provider|gte: 500000
    provider_type|contains:
    - hospice
    - home_health
    - dme
    - aba_therapy
  selection_address_anomaly:
    practice_address_type|contains:
    - CMRA
    - residential
    - virtual_office
    - UPS_store
  condition: selection_ghost_patient or (selection_geographic_clustering and selection_address_anomaly)
data_sources:
  native_fields:
  - beneficiary_id
  - beneficiary_status
  - beneficiary_date_of_death
  - provider_npi
  - provider_address_zip
  - practice_address
  - claim_service_date
  - billed_amount
  - provider_type
  derived_fields:
  - avg_billing_per_provider
  - claim_service_date_after_status_change
  - providers_per_zip
  enrichment_required:
  - field: beneficiary_status
    source: CMS beneficiary eligibility records (death, incarceration, relocation status)
  - field: practice_address_type
    source: USPS Commercial Mail Receiving Agency database cross-reference
queries:
  cql: |-
    // CrowdStrike CQL for Ghost Patient Claims Detection
    // Identifies claims submitted for deceased or incarcerated beneficiaries
    | match(file="beneficiary_eligibility.csv", field=beneficiary_id, include=[beneficiary_status, status_effective_date])
    | beneficiary_status="deceased" OR beneficiary_status="incarcerated"
    | filter(service_date > status_effective_date)
    | groupBy(provider_npi, function=[
        count(as=ghost_claims),
        sum(billed_amount, as=ghost_billed),
        count(field=beneficiary_id, distinct=true, as=ghost_beneficiaries),
        collect([beneficiary_status])
      ])
    | ghost_claims > 5
    | sort(ghost_billed, order=desc)

    // CrowdStrike CQL for Geographic Provider Clustering Detection
    // Identifies ZIP codes with anomalous provider density and billing
    // provider_type="hospice" OR provider_type="home_health" OR provider_type="dme" OR provider_type="aba_therapy"
    // | groupBy([provider_zip, provider_type], function=[
    //     count(field=provider_npi, distinct=true, as=provider_count),
    //     sum(billed_amount, as=total_zip_billed),
    //     collect([provider_name])
    //   ])
    // | provider_count >= 10
    // | avg_billing_per_provider := round(total_zip_billed / provider_count * 100) / 100
    // | avg_billing_per_provider > 500000
    // | sort(provider_count, order=desc)
  splunk: |-
    `comment("Splunk SPL for Ghost Patient Claims Detection")`
    `comment("Identifies claims submitted for deceased or incarcerated beneficiaries")`
    index=medicare_claims sourcetype=cms_claims
    | join type=inner max=0 beneficiary_id [search index=beneficiary_eligibility
      | where beneficiary_status IN ("deceased", "incarcerated")
      | fields beneficiary_id beneficiary_status status_effective_date]
    | eval claim_date_epoch=strptime(service_date, "%Y-%m-%d")
    | eval status_date_epoch=strptime(status_effective_date, "%Y-%m-%d")
    | where claim_date_epoch > status_date_epoch
    | stats
        count AS ghost_claims
        sum(billed_amount) AS ghost_billed
        dc(beneficiary_id) AS ghost_beneficiaries
        values(beneficiary_status) AS status_types
      by provider_npi
    | where ghost_claims > 5
    | sort -ghost_billed

    `comment("--- Detection 2: Geographic Provider Clustering ---")`
    `comment("Identifies ZIP codes with anomalous provider density and billing")`
    index=pecos_enrollment sourcetype=cms_enrollment
    | stats
        dc(provider_npi) AS provider_count
        values(provider_name) AS providers
      by provider_zip, provider_type
    | where provider_count >= 10
    | join type=inner max=0 provider_zip [search index=medicare_claims sourcetype=cms_claims
      | stats sum(billed_amount) AS total_zip_billed dc(provider_npi) AS billing_providers by provider_zip
      | eval avg_billing_per_provider=round(total_zip_billed/billing_providers, 2)]
    | where avg_billing_per_provider > 500000
    | eval alert_type="GEOGRAPHIC_CLUSTERING"
    | sort -provider_count
  sql: |-
    -- SQL for Ghost Patient Claims Detection
    SELECT
      c.provider_npi,
      p.provider_name,
      COUNT(*) AS ghost_claims,
      SUM(c.billed_amount) AS ghost_billed,
      COUNT(DISTINCT c.beneficiary_id) AS ghost_beneficiaries,
      b.beneficiary_status
    FROM claims c
    JOIN beneficiary_eligibility b ON c.beneficiary_id = b.beneficiary_id
    JOIN providers p ON c.provider_npi = p.provider_npi
    WHERE b.beneficiary_status IN ('deceased', 'incarcerated')
      AND c.service_date > b.status_effective_date
      AND c.service_date >= CURRENT_DATE - INTERVAL '90 days'
    GROUP BY c.provider_npi, p.provider_name, b.beneficiary_status
    HAVING COUNT(*) > 5
    ORDER BY ghost_billed DESC;

    -- SQL for Geographic Provider Clustering Detection
    SELECT
      e.provider_zip,
      e.provider_type,
      COUNT(DISTINCT e.provider_npi) AS provider_count,
      COALESCE(SUM(c.billed_amount), 0) AS total_zip_billed,
      ROUND(COALESCE(SUM(c.billed_amount), 0)::numeric
        / NULLIF(COUNT(DISTINCT e.provider_npi), 0), 2) AS avg_billing_per_provider,
      COUNT(DISTINCT CASE WHEN addr.address_type = 'CMRA' THEN e.provider_npi END) AS cmra_addresses,
      COUNT(DISTINCT CASE WHEN addr.address_type = 'residential' THEN e.provider_npi END) AS residential_addresses
    FROM provider_enrollment e
    LEFT JOIN claims c ON e.provider_npi = c.provider_npi
      AND c.service_date >= CURRENT_DATE - INTERVAL '365 days'
    LEFT JOIN address_classification addr ON e.physical_address = addr.address
    WHERE e.provider_type IN ('hospice', 'home_health', 'dme', 'aba_therapy')
    GROUP BY e.provider_zip, e.provider_type
    HAVING COUNT(DISTINCT e.provider_npi) >= 10
       AND ROUND(COALESCE(SUM(c.billed_amount), 0)::numeric
        / NULLIF(COUNT(DISTINCT e.provider_npi), 0), 2) > 500000
    ORDER BY provider_count DESC;
falsepositives:
- Claims submitted with processing delays where beneficiary status changed after
  service but before claim adjudication
- Legitimate healthcare clusters in medical districts or hospital complexes
- Large home health agencies serving wide geographic areas from a central office
level: high
tags:
- attack.t1589
- attack.t1657
