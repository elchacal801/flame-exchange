title: TDS URL Parameter Fingerprint Tracking Across Rotating Domains
id: a430a7cf-65c1-488b-9547-76c2388c8845
status: experimental
description: 'Detects consistent URL query parameter patterns (TDS software behavioral
  signatures) appearing across multiple rotating domains, indicating a single TDS
  operator managing infrastructure through domain rotation. TDS operators require
  consistent parameter schemas to route traffic between affiliates, track conversions,
  and attribute payouts — these parameters are the TDS internal API contract visible
  in redirect URLs even when domain names rotate. The VexTrio TDS was tracked for
  years via its distinctive ?u=&o= query parameter format before corporate attribution
  was achieved (Black Hat USA 2025, Infoblox). This rule identifies recurring parameter
  fingerprints across newly registered or rapidly rotating domains as indicators of
  TDS infrastructure managed by a single operator.

  '
references:
- https://blackhat.com/us-25/briefings/schedule/#no-hoodies-here-organized-crime-in-adtech-46001
- https://www.infoblox.com/threat-intel/
date: 2026/03/21
sigma_compatible: false
native_query_required: true
threat_paths:
- TP-0042
- TP-0060
cfpf_phase: P3
fraud_types:
- tds-exploitation
- malvertising
- affiliate-fraud
logsource:
  product: web_proxy
  category: web_traffic
  service: http_log
detection:
  selection_parameter_patterns:
    url_query|re:
    - '\?u=[^&]*&o=[^&]*'
    - '\?aff_id=[^&]*&click_id=[^&]*'
    - '\?subid=[^&]*&source=[^&]*&clickid=[^&]*'
    - '\?pid=[^&]*&offer_id=[^&]*'
  selection_domain_characteristics:
    dest_domain_age_days|lt: 90
  selection_redirect_context:
    http_status|contains:
    - '302'
    - '301'
    - '307'
  condition: selection_parameter_patterns and selection_domain_characteristics and
    selection_redirect_context
data_sources:
  native_fields:
  - url_query
  - dest_domain
  - dest_domain_age_days
  - http_status
  - src_ip
  - session_id
  enrichment_required:
  - field: dest_domain_age_days
    source: WHOIS enrichment (domain registration age)
queries:
  splunk: |-
    `comment("Splunk SPL for TDS URL Parameter Fingerprint Tracking")`
    `comment("Identifies consistent TDS parameter patterns across rotating domains")`
    index=flame_proxy sourcetype=flame:http_log http_status IN (301, 302, 307)
    (url_query="*?u=*&o=*" OR url_query="*aff_id=*&click_id=*" OR url_query="*subid=*&source=*&clickid=*" OR url_query="*pid=*&offer_id=*")
    | rex field=url_query "(?<param_pattern>[a-z_]+=)[^&]*(&[a-z_]+=)[^&]*"
    | eval param_fingerprint=param_pattern
    | lookup domain_age_feed dest_domain OUTPUT domain_age_days
    | where domain_age_days < 90 OR isnull(domain_age_days)
    | stats dc(dest_domain) AS unique_domains
            values(dest_domain) AS domains
            dc(src_ip) AS unique_visitors
            count AS total_hits
            earliest(_time) AS first_seen
            latest(_time) AS last_seen
        by param_fingerprint
    | where unique_domains >= 3
    | sort -unique_domains
  cql: |-
    // CrowdStrike CQL for TDS URL Parameter Fingerprint Tracking
    // Repository: flame-proxy-http-log
    http_status=/30[127]/
    | url_query=/\?(u=[^&]*&o=|aff_id=[^&]*&click_id=|subid=[^&]*&source=[^&]*&clickid=|pid=[^&]*&offer_id=)/
    | regex("(?<param_fingerprint>[a-z_]+=)[^&]*(&[a-z_]+=)", field=url_query)
    | groupBy([param_fingerprint], function=[
        count(as=total_hits),
        collectDistinct(dest_domain, as=unique_domains),
        collectDistinct(src_ip, as=unique_visitors)
      ])
    | length(unique_domains) >= 3
falsepositives:
- Legitimate affiliate marketing campaigns using consistent tracking parameters across multiple publisher domains
- A/B testing platforms rotating domains for conversion optimization
- Advertising analytics platforms with standardized URL parameter schemas
level: medium
tags:
- attack.t1583.001
- cfpf.phase3.positioning
- tds
- url-parameter-fingerprint
- vextrio
- domain-rotation
- affiliate-tracking
- behavioral-fingerprint
- TP-0042
- TP-0060
