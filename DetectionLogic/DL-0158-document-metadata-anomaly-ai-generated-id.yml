title: Document Metadata Anomaly — AI-Generated ID Document Detection
id: 0fffda23-9253-42c6-987d-3957552a1540
status: experimental
description: >
  Detects submitted identity documents with metadata inconsistencies indicating AI
  generation or manipulation: PDF creation tools (Photoshop, GIMP, AI generators),
  timestamp manipulation (creation date after modification date), inconsistent DPI,
  missing EXIF data, font embedding anomalies. 85% of synthetic fraud now involves
  GenAI document fabrication. Underground services like OnlyFake and ProKYC produce
  photo-realistic government IDs for as little as $30, complete with simulated
  holograms and barcode data, but leave detectable metadata and structural artifacts
  that differ from genuine document scans.
sigma_compatible: false
native_query_required: true
references:
  - "Entrust 2025 Identity Fraud Report — 311% increase in AI-generated document fraud"
  - "LexisNexis Risk Solutions, Global State of Fraud and Identity Report 2026"
  - "Trend Micro, Underground KYC Bypass Market Research"
threat_paths:
  - TP-0029
  - TP-0003
cfpf_phase: P2
fraud_types:
  - synthetic-identity
  - document-fraud
  - ai-accelerated-fraud-infrastructure
logsource:
  product: banking
  service: document_verification
detection:
  selection_document_submission:
    event_type: DOCUMENT_SUBMISSION
  filter_ai_score:
    document_ai_score|gt: 0.7
  filter_metadata_anomaly:
    pdf_creator|contains:
      - 'Photoshop'
      - 'GIMP'
      - 'Stable Diffusion'
      - 'Midjourney'
      - 'DALL-E'
      - 'unknown_ai_generator'
    exif_data_present: false
  filter_timestamp_anomaly:
    pdf_creation_date|gt: pdf_modification_date
  filter_dpi_inconsistency:
    dpi_consistency_check: false
  filter_font_anomaly:
    font_embedding_anomaly: true
  condition: >
    selection_document_submission AND
    (filter_ai_score OR (filter_metadata_anomaly) OR filter_timestamp_anomaly
    OR filter_dpi_inconsistency OR filter_font_anomaly)
data_sources:
  native_fields:
    - applicant_id
    - event_type
    - submission_timestamp
    - document_type
    - document_file_hash
    - device_fingerprint
    - ip_address
  enrichment_required:
    - field: document_ai_score
      source: AI forgery detection model — probability score (0-1) indicating AI generation
    - field: pdf_creator
      source: PDF metadata extraction — Creator field from document properties
    - field: exif_data_present
      source: EXIF metadata analysis — boolean indicating presence of camera EXIF data
    - field: pdf_creation_date
      source: PDF metadata extraction — document creation timestamp
    - field: pdf_modification_date
      source: PDF metadata extraction — document last modified timestamp
    - field: dpi_consistency_check
      source: Image analysis — boolean indicating consistent DPI across document regions
    - field: font_embedding_anomaly
      source: Font analysis — boolean indicating anomalous font embedding patterns
  derived_fields:
    - metadata_risk_score
    - anomaly_type
queries:
  cql: |-
    // CrowdStrike CQL for AI-Generated ID Document Detection
    // Detects document submissions with metadata inconsistencies indicating AI generation
    event_type="DOCUMENT_SUBMISSION"
    | anomaly_type := case {
        document_ai_score > 0.7 | "high_ai_score";
        pdf_creator = /Photoshop|GIMP|Stable Diffusion|Midjourney|DALL-E|unknown_ai_generator/
          AND exif_data_present = "false" | "suspicious_creator_no_exif";
        pdf_creation_date > pdf_modification_date | "timestamp_manipulation";
        dpi_consistency_check = "false" | "dpi_inconsistency";
        font_embedding_anomaly = "true" | "font_anomaly";
        * | "none";
      }
    | anomaly_type != "none"
    | select([applicant_id, submission_timestamp, document_type,
              document_ai_score, pdf_creator, exif_data_present,
              dpi_consistency_check, font_embedding_anomaly,
              anomaly_type, device_fingerprint, ip_address])
    | sort(submission_timestamp, order=desc)
  splunk: |-
    `comment("Splunk SPL for AI-Generated ID Document Detection")`
    `comment("Detects document submissions with metadata indicating AI generation")`
    index=flame_banking sourcetype=flame:document_verification
      event_type="DOCUMENT_SUBMISSION"
    | eval anomaly_type = case(
        document_ai_score > 0.7, "high_ai_score",
        match(pdf_creator, "Photoshop|GIMP|Stable Diffusion|Midjourney|DALL-E|unknown_ai_generator")
          AND exif_data_present="false", "suspicious_creator_no_exif",
        pdf_creation_date > pdf_modification_date, "timestamp_manipulation",
        dpi_consistency_check="false", "dpi_inconsistency",
        font_embedding_anomaly="true", "font_anomaly",
        1=1, "none")
    | where anomaly_type != "none"
    | table applicant_id, submission_timestamp, document_type,
            document_ai_score, pdf_creator, exif_data_present,
            dpi_consistency_check, font_embedding_anomaly,
            anomaly_type, device_fingerprint, ip_address
    | sort - submission_timestamp
  sql: |-
    -- SQL for AI-Generated ID Document Detection
    -- Detects document submissions with metadata indicating AI generation
    SELECT
      d.applicant_id,
      d.submission_timestamp,
      d.document_type,
      e.document_ai_score,
      e.pdf_creator,
      e.exif_data_present,
      e.dpi_consistency_check,
      e.font_embedding_anomaly,
      CASE
        WHEN e.document_ai_score > 0.7 THEN 'high_ai_score'
        WHEN e.pdf_creator IN ('Photoshop', 'GIMP', 'Stable Diffusion', 'Midjourney', 'DALL-E', 'unknown_ai_generator')
             AND e.exif_data_present = 0 THEN 'suspicious_creator_no_exif'
        WHEN e.pdf_creation_date > e.pdf_modification_date THEN 'timestamp_manipulation'
        WHEN e.dpi_consistency_check = 0 THEN 'dpi_inconsistency'
        WHEN e.font_embedding_anomaly = 1 THEN 'font_anomaly'
      END AS anomaly_type,
      d.device_fingerprint,
      d.ip_address
    FROM document_submissions d
    JOIN document_enrichment e ON d.document_file_hash = e.document_file_hash
    WHERE d.event_type = 'DOCUMENT_SUBMISSION'
      AND (
        e.document_ai_score > 0.7
        OR (e.pdf_creator IN ('Photoshop', 'GIMP', 'Stable Diffusion', 'Midjourney', 'DALL-E', 'unknown_ai_generator')
            AND e.exif_data_present = 0)
        OR e.pdf_creation_date > e.pdf_modification_date
        OR e.dpi_consistency_check = 0
        OR e.font_embedding_anomaly = 1
      )
    ORDER BY d.submission_timestamp DESC
falsepositives:
  - Legitimate documents that were scanned using software that strips EXIF data
  - Documents re-saved or compressed by institution systems altering metadata
  - Older documents digitized with inconsistent scanning settings across pages
level: high
tags:
  - attack.t1656
  - attack.t1588.005
  - cfpf.phase2.initial_access
  - flame.ai-document-fraud
  - flame.synthetic-identity
  - flame.document-forgery