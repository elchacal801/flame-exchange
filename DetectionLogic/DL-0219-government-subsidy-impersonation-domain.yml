title: "Government Subsidy Impersonation Domain — NRD with Agency Keyword Pattern"
id: "60fd1e58-2749-4030-8d0a-66ad871a652b"
status: experimental
description: >
  Detects newly registered domains (< 30 days) matching government agency
  impersonation patterns combined with subsidy/relief keywords. Targets
  domains like gov*-subsidy*, dwp-*, hmrc-*, irs-*, fema-*, *-relief-payment,
  and country-agency combinations (uk-energy-*, us-fuel-*). CrimsonVector
  confirmed gov.dwp-subsidy.shop as a phishing site impersonating the UK
  Department for Work and Pensions during the 2026 oil shock. The NRD age
  filter (< 30 days) eliminates legitimate government domains while catching
  the 48-72h post-announcement registration surge.
references:
  - "CrimsonVector, 2026 Iran War Oil Shock Domain Intelligence Report — gov.dwp-subsidy.shop confirmed phishing"
  - "UK NCSC, Government Impersonation Phishing Advisories"
  - "FBI IC3, 2025 Internet Crime Report — Government impersonation: $797.9M"
threat_paths:
  - TP-0086
  - TP-0084
cfpf_phase: P2
fraud_types:
  - phishing
  - impersonation
  - credential-harvesting
logsource:
  product: banking
  service: domain_intelligence
detection:
  selection_gov_pattern:
    domain_name|re: "gov[.-]|dwp[.-]|hmrc[.-]|irs[.-]|fema[.-]|ssa[.-]|centrelink[.-]|service-canada[.-]|cra[.-]"
  selection_subsidy_keyword:
    domain_name|contains:
      - subsidy
      - relief
      - assistance
      - allowance
      - benefit
      - grant
      - rebate
      - payment
  filter_nrd:
    domain_age_days|lte: 30
  condition: selection_gov_pattern AND selection_subsidy_keyword AND filter_nrd
falsepositives:
  - "Legitimate government contractor domains registered for program support"
  - "News aggregator or comparison sites covering government programs"
  - "Academic or research domains studying government policy"
level: critical
tags:
  - cfpf.phase2.initial_access
  - flame.infrastructure
  - flame.crisis-exploitation
  - flame.government-impersonation
