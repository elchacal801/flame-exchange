title: AI Document Template Cluster — Identical Formatting Patterns Across Applications
id: 48c67c22-55fb-47fc-bb4d-99d4891ef92e
status: experimental
description: >
  Detects clusters of submitted ID documents sharing identical formatting artifacts,
  template structures, or AI generation signatures. AI document generators produce
  documents with consistent pixel-level artifacts, font embedding patterns, and template
  metadata even when the identity details differ. When 3+ documents from different
  applicants show template_similarity_score > 0.85, this indicates a common AI generator.
  Underground forgery services like OnlyFake successors use a limited number of document
  templates per jurisdiction, creating detectable clustering when multiple synthetic
  identities are onboarded through the same forgery pipeline. Template similarity
  analysis across the document corpus reveals these clusters even when individual
  documents pass automated verification checks.
sigma_compatible: false
native_query_required: true
references:
  - "Entrust 2025 Identity Fraud Report — document template clustering analysis"
  - "Trend Micro, Underground KYC Bypass Market Research — forgery service template reuse"
  - "LexisNexis Risk Solutions, Global State of Fraud and Identity Report 2026"
threat_paths:
  - TP-0029
cfpf_phase: P2
fraud_types:
  - synthetic-identity
  - document-fraud
  - ai-accelerated-fraud-infrastructure
logsource:
  product: banking
  service: document_verification
detection:
  selection_document_submission:
    event_type: DOCUMENT_SUBMISSION
  filter_template_cluster:
    template_similarity_score|gt: 0.85
  condition: >
    selection_document_submission AND
    template_similarity_score > 0.85 across 3+ documents from different
    applicant_name/ssn_hash combinations within 90 days
data_sources:
  native_fields:
    - applicant_id
    - event_type
    - submission_timestamp
    - document_type
    - document_file_hash
    - applicant_name
    - ssn_hash
    - device_fingerprint
  enrichment_required:
    - field: template_similarity_score
      source: Document analysis — pairwise similarity score (0-1) comparing document template structure
    - field: template_cluster_id
      source: Document clustering model — cluster assignment based on template structural features
    - field: pixel_artifact_hash
      source: Image analysis — perceptual hash of pixel-level artifacts in document background
    - field: font_profile_hash
      source: Font analysis — hash of font embedding characteristics across document text regions
    - field: template_source_match
      source: Threat intel — match against known forgery service template database
  derived_fields:
    - cluster_size
    - distinct_identities_in_cluster
    - cluster_time_span_days
queries:
  cql: |-
    // CrowdStrike CQL for AI Document Template Cluster Detection
    // Detects clusters of documents sharing AI generation template signatures
    event_type="DOCUMENT_SUBMISSION"
    | submission_timestamp > now() - 90d
    | groupBy(template_cluster_id, function=[
        count(as=cluster_size),
        count(distinct=true, field=applicant_name, as=distinct_applicants),
        count(distinct=true, field=ssn_hash, as=distinct_ssns),
        avg(template_similarity_score, as=avg_similarity),
        collect([applicant_id, applicant_name, submission_timestamp,
                 document_type, device_fingerprint], limit=50) as cluster_members,
        min(submission_timestamp) as cluster_start,
        max(submission_timestamp) as cluster_end
      ])
    | cluster_size >= 3 AND distinct_applicants >= 3 AND avg_similarity > 0.85
    | select([template_cluster_id, cluster_size, distinct_applicants,
              distinct_ssns, avg_similarity, cluster_start, cluster_end,
              cluster_members])
    | sort(cluster_size, order=desc)
  splunk: |-
    `comment("Splunk SPL for AI Document Template Cluster Detection")`
    `comment("Detects clusters of documents sharing AI generation template signatures")`
    index=flame_banking sourcetype=flame:document_verification
      event_type="DOCUMENT_SUBMISSION"
      earliest=-90d@d
    | stats
        count as cluster_size,
        dc(applicant_name) as distinct_applicants,
        dc(ssn_hash) as distinct_ssns,
        avg(template_similarity_score) as avg_similarity,
        values(applicant_id) as applicant_ids,
        values(applicant_name) as names,
        values(document_type) as document_types,
        min(submission_timestamp) as cluster_start,
        max(submission_timestamp) as cluster_end
        by template_cluster_id
    | where cluster_size >= 3 AND distinct_applicants >= 3 AND avg_similarity > 0.85
    | eval cluster_time_span_days = round((cluster_end - cluster_start) / 86400, 1)
    | table template_cluster_id, cluster_size, distinct_applicants,
            distinct_ssns, avg_similarity, cluster_start, cluster_end,
            cluster_time_span_days, applicant_ids, names, document_types
    | sort - cluster_size
  sql: |-
    -- SQL for AI Document Template Cluster Detection
    -- Detects clusters of documents sharing AI generation template signatures
    SELECT
      d.template_cluster_id,
      COUNT(*) AS cluster_size,
      COUNT(DISTINCT d.applicant_name) AS distinct_applicants,
      COUNT(DISTINCT d.ssn_hash) AS distinct_ssns,
      AVG(d.template_similarity_score) AS avg_similarity,
      MIN(d.submission_timestamp) AS cluster_start,
      MAX(d.submission_timestamp) AS cluster_end,
      DATEDIFF(DAY, MIN(d.submission_timestamp), MAX(d.submission_timestamp)) AS cluster_time_span_days,
      STRING_AGG(DISTINCT d.applicant_name, ', ') AS names,
      STRING_AGG(DISTINCT d.applicant_id, ', ') AS applicant_ids
    FROM document_submissions d
    WHERE d.event_type = 'DOCUMENT_SUBMISSION'
      AND d.submission_timestamp >= DATEADD(DAY, -90, CURRENT_DATE)
      AND d.template_cluster_id IS NOT NULL
    GROUP BY d.template_cluster_id
    HAVING COUNT(*) >= 3
      AND COUNT(DISTINCT d.applicant_name) >= 3
      AND AVG(d.template_similarity_score) > 0.85
    ORDER BY COUNT(*) DESC
falsepositives:
  - Legitimate documents from the same jurisdiction and issuance period sharing standard government templates
  - Documents scanned by the same institutional scanner producing consistent compression artifacts
  - Batch submissions from legitimate corporate onboarding processes
level: high
tags:
  - attack.t1656
  - attack.t1588.005
  - cfpf.phase2.initial_access
  - flame.ai-document-fraud
  - flame.template-clustering
  - flame.forgery-service-detection