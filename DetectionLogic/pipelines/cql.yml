name: FLAME CrowdStrike CQL Pipeline
priority: 10
description: >
  Field mapping pipeline for CrowdStrike Falcon NGSIEM (CQL).
  Maps FLAME custom logsource taxonomy and field names to CrowdStrike
  repositories, parsers, and field conventions.

transformations:

  # ============================================================
  # Logsource → CrowdStrike NGSIEM Repository Mappings
  # ============================================================

  # --- Banking ---
  - id: ls_banking_auth
    type: add_condition
    conditions:
      - "#repo=flame-banking-auth"
    rule_conditions:
      - type: logsource
        product: banking
        service: auth_logs

  - id: ls_banking_txn_monitoring
    type: add_condition
    conditions:
      - "#repo=flame-banking-txn"
    rule_conditions:
