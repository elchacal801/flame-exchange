  # ============================================================
  # Field Name Mappings (Sigma → CrowdStrike CQL)
  # ============================================================
  # CrowdStrike NGSIEM uses flat field naming. Most FLAME fields map 1:1.
  # Where disambiguation is needed, prefix with the source context.

  - id: ls_field_mappings
    type: field_name_mapping
    mapping:
      event_type: EventType
      transaction_type: TransactionType
      transaction_amount: TransactionAmount
      account_id: AccountId
      user_id: UserId
      source_ip: SrcIp
      src_ip: SrcIp
      device_fingerprint: DeviceFingerprint
      session_token: SessionToken
      auth_result: AuthResult
      mfa_method: MfaMethod
      mfa_result: MfaResult
      process_name: ProcessName
      process_path: ProcessPath
      process_signed: ProcessSigned
      file_path: FilePath
      file_access_type: FileAccessType
      http_method: HttpMethod
      url_path: UrlPath
      content_type: ContentType
      request_body_length: RequestBodyLength
      domain_age_days: DomainAgeDays
      beneficiary_name: BeneficiaryName
      beneficiary_country: BeneficiaryCountry
      beneficiary_category: BeneficiaryCategory
      payment_rail: PaymentRail
      geo_country: GeoCountry
      user_agent: UserAgent
      timestamp: "@timestamp"
