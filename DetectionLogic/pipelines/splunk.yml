      - "index=flame_secops sourcetype=flame:incident_mgmt"
    rule_conditions:
      - type: logsource
        product: security_operations
        service: incident_management

  # ============================================================
  # Field Name Mappings (Sigma → Splunk CIM-aligned)
  # ============================================================
  # Splunk CIM uses lowercase with underscores. Most FLAME fields
  # are already in this convention. Map where Splunk conventions differ.

  - id: sp_field_mappings
    type: field_name_mapping
    mapping:
      event_type: event_type
      transaction_type: transaction_type
      transaction_amount: transaction_amount
      account_id: account_id
      user_id: user_id
      source_ip: src_ip
      src_ip: src_ip
      device_fingerprint: device_fingerprint
      session_token: session_token
      auth_result: auth_result
      mfa_method: mfa_method
      mfa_result: mfa_result
      process_name: process_name
      process_path: process_path
      process_signed: process_signed
      file_path: file_path
      file_access_type: file_access_type
      http_method: http_method
      url_path: url_path
      content_type: content_type
      request_body_length: request_body_length
      domain_age_days: domain_age_days
      beneficiary_name: beneficiary_name
      beneficiary_country: beneficiary_country
      beneficiary_category: beneficiary_category
      payment_rail: payment_rail
      geo_country: geo_country
      user_agent: http_user_agent
      timestamp: _time
