name: FLAME Splunk Pipeline
priority: 10
description: >
  Field mapping pipeline for Splunk Enterprise / Splunk Cloud.
  Maps FLAME custom logsource taxonomy and field names to Splunk
  indexes, sourcetypes, and CIM-aligned field conventions.

transformations:

  # ============================================================
  # Logsource → Splunk Index/Sourcetype Mappings
  # ============================================================

  # --- Banking ---
  - id: sp_banking_auth
    type: add_condition
    conditions:
      - "index=flame_banking sourcetype=flame:auth"
    rule_conditions:
      - type: logsource
        product: banking
        service: auth_logs

  - id: sp_banking_txn_monitoring
    type: add_condition
    conditions:
      - "index=flame_banking sourcetype=flame:txn_monitoring"
    rule_conditions:
