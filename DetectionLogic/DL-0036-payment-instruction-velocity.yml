title: Payment Instruction Velocity Spike
id: ab337b60-bba6-4fba-bc7d-81374d37f4de
status: experimental
description: 'Detects when multiple payment instructions (wires, ACH batches, or internal transfers) are submitted in rapid
  succession from a single account or user session. High-velocity payment submissions suggest automated or scripted fraud
  execution, often seen after credential compromise.

  '
sigma_compatible: false
native_query_required: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
- TP-0001
- TP-0006
cfpf_phase: P4
fraud_types:
- wire-fraud
- ACH-fraud
- payment-diversion
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection:
    event_type:
    - WIRE_INITIATION
    - ACH_BATCH_SUBMIT
    - INTERNAL_TRANSFER
    - PAYMENT_INSTRUCTION
  timeframe: 30m
  condition: selection
  enrichment:
    aggregate: sum(transaction_amount) by account_id
    threshold_multiplier: 3.0
data_sources:
  native_fields:
  - aggregate
  - event_type
  - threshold_multiplier
queries:
  cql: |-
    // CrowdStrike CQL for Payment Instruction Velocity Spike
    // Repository: flame-banking-transaction-monitoring
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: selection | count() by session_id > 5
    (event_type="WIRE_INITIATION" OR event_type="ACH_BATCH_SUBMIT" OR event_type="INTERNAL_TRANSFER" OR event_type="PAYMENT_INSTRUCTION")
    aggregate="sum(transaction_amount) by account_id"
    threshold_multiplier="3.0"
    | groupBy(session_id, function=[count(as=event_count)])
    | event_count > 5
  splunk: |-
    `comment("Splunk SPL for Payment Instruction Velocity Spike")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection | count() by session_id > 5")`
    index=flame_banking sourcetype=flame:transaction_monitoring
    (event_type="WIRE_INITIATION" OR event_type="ACH_BATCH_SUBMIT" OR event_type="INTERNAL_TRANSFER" OR event_type="PAYMENT_INSTRUCTION")
    aggregate="sum(transaction_amount) by account_id"
    threshold_multiplier="3.0"
    | stats count as event_count by session_id
    | where event_count > 5
falsepositives:
- Corporate treasury operations submitting batch payments during end-of-day processing
- Payroll administrators processing multi-entity payroll batches
level: high
tags:
- cfpf.phase4.execution
- attack.t1657
- flame.wire_ach
