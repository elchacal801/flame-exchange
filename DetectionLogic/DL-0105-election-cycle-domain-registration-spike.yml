title: Election-Cycle Domain Registration Spike
id: 4b8e2a71-d3f9-4c57-ae12-6f1d0b3c8e94
status: experimental
description: >
  Detect anomalous increases in domain registrations containing financial
  institution brand names or financial services keywords during election
  periods. Compares registration volumes against a 90-day rolling baseline,
  alerting on 3x+ increases within 30 days of scheduled elections. Integrates
  with election calendar data for predictive detection.
date: 2026/03/05
threat_paths:
  - TP-0046
cfpf_phase: P1
fraud_types:
  - state-criminal-convergence
logsource:
  product: dns_intelligence
  category: domain_registration
  service: zone_file_diff
detection:
  selection:
    registration_volume_ratio|gte: 3.0
    baseline_window: 90d
    domain_name|contains:
      - financial_brand_keywords
    registration_date_within_election|lte: 30d
  condition: selection
falsepositives:
  - Legitimate financial marketing campaigns during election seasons
  - Political donation platform launches
level: medium
tags:
  - election-cycle
  - domain-registration
  - geopolitical-timing
  - financial-brands
  - TP-0046
