title: BPH Rebranding Chain Detection
id: 9f1b4e63-d7a2-4508-bc91-3e0f85c24a96
status: experimental
description: >
  Detect bulletproof hosting providers that rebrand following law enforcement
  or sanctions action. Identifies new hosting entities advertising the same
  IP ranges, same BGP ASN prefixes, or same upstream transit providers as
  recently sanctioned or seized BPH operations. Tracks the Garantex to Grinex
  and Aeza to Smart Digital/Datavice patterns. Bulletproof hosting providers
  under sanctions or law enforcement pressure follow predictable rebranding
  patterns — registering new corporate entities while retaining the same
  underlying network infrastructure. BGP route announcements, IP range
  allocations, and upstream transit provider relationships persist across
  rebrandings, providing durable detection signals. This rule monitors for
  new hosting entities that share ASN prefixes, IP CIDR blocks, or transit
  provider relationships with recently sanctioned or seized BPH operations
  within a 90-day window following enforcement action.
date: 2026/03/05
threat_paths:
  - TP-0045
cfpf_phase: P3
fraud_types:
  - sanctions-evasion-infrastructure
logsource:
  product: dns_intelligence
  category: bgp_monitoring
  service: ip_allocation
detection:
  selection:
    new_entity_same_asn|exists: true
    new_entity_same_ip_range|exists: true
    new_entity_same_transit_provider|exists: true
    days_since_sanctioned_entity_shutdown|lte: 90
  condition: selection
falsepositives:
  - Legitimate IP range transfers between hosting providers
  - Normal BGP re-advertisement after provider changes
level: high
tags:
  - bph-rebranding
  - sanctions-evasion
  - bgp-analysis
  - garantex-grinex
  - aeza
  - TP-0045
