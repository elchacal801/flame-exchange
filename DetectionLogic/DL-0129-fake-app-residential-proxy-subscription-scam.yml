title: Fake Mobile App Residential Proxy and Subscription Scam Detection
id: e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b
status: experimental
description: 'Detects indicators of fake mobile applications that function as residential
  proxies or subscription scams, as documented in the VexTrio fake app operations
  (Black Hat USA 2025, Infoblox). VexTrio operated fake mobile apps for 7-8 years
  through Google Play Store, Apple App Store, and third-party forums. Three categories:
  (1) Fake VPNs that route user traffic through residential proxy networks (making
  users unwitting proxy nodes) with keyword-scanning capabilities targeting banking
  and personal information, (2) Fake Android cleaners (device optimization tools),
  (3) Fake spam/notification protection apps that operate a self-referential scam
  cycle — after push notification abuse infects the victim browser (100-150 notifications/day),
  victim is served an ad for a "spam protection" app that requests permissions to
  disable browser notifications, displays fabricated "blocked" notification screens,
  then transitions to $6.99/week subscription after 24 hours. This rule detects network-level
  and endpoint-level indicators of these app categories.

  '
references:
- https://blackhat.com/us-25/briefings/schedule/#no-hoodies-here-organized-crime-in-adtech-46001
- https://www.infoblox.com/threat-intel/
date: 2026/03/21
sigma_compatible: false
native_query_required: true
threat_paths:
- TP-0042
- TP-0054
cfpf_phase: P4
fraud_types:
- subscription-fraud
- push-notification-abuse
- tds-exploitation
logsource:
  product: endpoint
  category: network_connection
  service: mobile_device_management
detection:
  selection_proxy_behavior:
    app_category|contains:
    - VPN
    - cleaner
    - optimizer
    - spam-blocker
    - notification-protector
    network_traffic_pattern: residential_proxy
    outbound_connections_to_unknown_ips|gte: 50
    inbound_proxy_connections: true
  selection_keyword_scanning:
    app_permission|contains:
    - READ_SMS
    - READ_CONTACTS
    - ACCESSIBILITY_SERVICE
    data_exfil_pattern:
    - banking_keyword_match
    - credential_harvest
  selection_subscription_scam:
    push_notification_permission_change: disable
    in_app_purchase_amount|gte: 6.99
    in_app_purchase_frequency: weekly
    time_from_install_to_purchase_hours|lte: 48
  selection_notification_abuse_precursor:
    browser_push_notification_rate_per_day|gte: 50
    notification_source_domain_age_days|lt: 30
  condition: selection_proxy_behavior or selection_keyword_scanning or (selection_notification_abuse_precursor
    and selection_subscription_scam)
data_sources:
  native_fields:
  - app_name
  - app_category
  - app_permissions
  - network_traffic_pattern
  - push_notification_rate
  - in_app_purchase_amount
  - in_app_purchase_frequency
  enrichment_required:
  - field: network_traffic_pattern
    source: Network traffic analysis (proxy behavior detection via traffic flow analysis)
  - field: notification_source_domain_age_days
    source: WHOIS enrichment for push notification source domains
queries:
  splunk: |-
    `comment("Splunk SPL for Fake Mobile App Residential Proxy and Subscription Scam Detection")`
    `comment("Detects VexTrio-pattern fake apps: residential proxy abuse and notification-to-subscription scam cycle")`

    `comment("--- Detection 1: Fake VPN acting as residential proxy ---")`
    index=flame_endpoint sourcetype=flame:mobile_mdm app_category IN ("VPN", "cleaner", "optimizer", "spam-blocker")
    | stats
        dc(dest_ip) AS unique_dest_ips
        sum(bytes_out) AS total_bytes_out
        sum(bytes_in) AS total_bytes_in
        dc(src_port) AS unique_src_ports
        values(app_name) AS app_names
      by device_id, app_id
    | eval proxy_ratio=round(total_bytes_in/total_bytes_out, 2)
    | where unique_dest_ips > 50 AND proxy_ratio > 2
    | eval risk="residential_proxy_behavior"

    `comment("--- Detection 2: Push notification abuse to subscription scam cycle ---")`
    index=flame_endpoint sourcetype=flame:mobile_mdm
    | eval has_notification_spike=(if(push_notification_count_24h >= 50, 1, 0))
    | eval has_app_install=(if(isnotnull(new_app_install) AND app_category IN ("spam-blocker", "notification-protector", "cleaner"), 1, 0))
    | eval has_subscription=(if(in_app_purchase_amount >= 6.99 AND in_app_purchase_type="subscription", 1, 0))
    | transaction device_id maxspan=72h
    | where has_notification_spike=1 AND has_app_install=1 AND has_subscription=1
    | eval risk="notification_to_subscription_scam_cycle"
  sql: |-
    -- SQL for Fake Mobile App Residential Proxy Detection
    -- Identifies apps with proxy-like traffic patterns (high inbound/outbound ratio, many destinations)
    SELECT
      d.device_id,
      a.app_name,
      a.app_publisher,
      a.app_category,
      COUNT(DISTINCT nc.dest_ip) AS unique_destinations,
      SUM(nc.bytes_out) AS total_bytes_out,
      SUM(nc.bytes_in) AS total_bytes_in,
      ROUND(SUM(nc.bytes_in)::numeric / NULLIF(SUM(nc.bytes_out), 0), 2) AS proxy_ratio,
      a.install_date,
      a.requested_permissions
    FROM device_inventory d
    JOIN installed_apps a ON d.device_id = a.device_id
    JOIN network_connections nc ON d.device_id = nc.device_id AND a.app_id = nc.app_id
    WHERE a.app_category IN ('VPN', 'cleaner', 'optimizer', 'spam-blocker', 'notification-protector')
      AND nc.connection_date >= CURRENT_DATE - INTERVAL '7 days'
    GROUP BY d.device_id, a.app_name, a.app_publisher, a.app_category,
             a.install_date, a.requested_permissions
    HAVING COUNT(DISTINCT nc.dest_ip) > 50
       AND ROUND(SUM(nc.bytes_in)::numeric / NULLIF(SUM(nc.bytes_out), 0), 2) > 2.0
    ORDER BY unique_destinations DESC;
falsepositives:
- Legitimate VPN applications with high connection counts (though legitimate VPNs typically connect to known VPN provider infrastructure, not diverse residential IPs)
- Enterprise MDM tools that manage notification settings
- Legitimate notification management apps from established publishers
level: high
tags:
- attack.t1090
- attack.t1657
- cfpf.phase4.execution
- fake-mobile-app
- residential-proxy
- push-notification-abuse
- subscription-scam
- self-referential-scam
- vextrio
- keyword-scanning
- TP-0042
- TP-0054
