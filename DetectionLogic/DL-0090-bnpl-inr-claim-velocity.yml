title: BNPL Item-Not-Received Claim Velocity
id: d2a47e96-f3b1-4a8c-be05-6c1f92d8e4a3
status: experimental
description: 'Detects accounts filing three or more item-not-received (INR) claims within a 90-day rolling window where the
  average disputed order value exceeds $300. Legitimate INR dispute rates are under 1% of orders, with most disputes involving
  genuine delivery failures. Organized phantom delivery fraud and friendly fraud operations systematically file INR claims
  after receiving goods, targeting high-value orders to maximize returns. This rule supports TP-0040 Phase 4 detection by
  identifying accounts exhibiting claim patterns consistent with organized INR abuse rather than genuine delivery issues.
  The $300 average threshold filters out low-value legitimate disputes while capturing the high-value targeting characteristic
  of organized fraud.

  '
sigma_compatible: true
references:
- https://www.lexisnexis.com/risk/global-fraud-identity-report
threat_paths:
- TP-0040
cfpf_phase: P4
fraud_types:
- bnpl-fraud
- first-party-fraud
logsource:
  product: ecommerce
  service: bnpl_disputes
detection:
  selection:
    dispute_type: item_not_received
    account_type: bnpl
  aggregation:
    count|gte: 3
    groupby: account_id
    timeframe: 90d
  filter_high_value:
    avg_disputed_order_value|gte: 300
  condition: selection and aggregation and filter_high_value
data_sources:
  native_fields:
  - account_type
  - avg_disputed_order_value
  - count
  - dispute_type
  - groupby
  - timeframe
falsepositives:
- Legitimate delivery failures in areas with known courier reliability issues
- Bulk purchasers with higher absolute dispute counts due to high order volumes
- Seasonal delivery disruptions during peak shipping periods
level: high
tags:
- cfpf.phase4.execution
- attack.t1657
- flame.ecommerce
- flame.bnpl_fraud
- flame.phantom_delivery
- flame.friendly_fraud
