title: Account Age vs Transaction Volume Mismatch
id: 37ad82e6-17e7-4be0-b5e9-839b29cd1ed3
status: experimental
description: 'Detects accounts less than 90 days old that exhibit transaction volumes exceeding the typical profile for mature
  accounts. Newly opened accounts with abnormally high volume are a primary indicator of purpose-built mule accounts created
  specifically to funnel illicit funds.

  '
sigma_compatible: false
native_query_required: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://www.fincen.gov/sites/default/files/shared/FIN-2022-A002.pdf
threat_paths:
- TP-0011
- TP-0022
cfpf_phase: P5
fraud_types:
- money-mule
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection:
    account_age_days|lt: 90
  selection_high_volume:
    event_type:
    - WIRE_CREDIT
    - ACH_CREDIT
    - WIRE_INITIATION
    - ACH_DEBIT
    - INTERNAL_TRANSFER
  timeframe: 30d
  condition: selection and selection_high_volume
  enrichment:
    peer_comparison:
      metric: transaction_count
      threshold: percentile_95
data_sources:
  native_fields:
  - event_type
  - peer_comparison
  enrichment_required:
  - field: account_age_days
    source: Account analytics enrichment (account opening date lookup)
queries:
  cql: |-
    // CrowdStrike CQL for Account Age vs Transaction Volume Mismatch
    // Repository: flame-banking-transaction-monitoring
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: selection and selection_high_volume | count() by account_id > 20
    account_age_days<90
    (event_type="WIRE_CREDIT" OR event_type="ACH_CREDIT" OR event_type="WIRE_INITIATION" OR event_type="ACH_DEBIT" OR event_type="INTERNAL_TRANSFER")
    peer_comparison="{'metric': 'transaction_count', 'threshold': 'percentile_95'}"
    | groupBy(account_id, function=[count(as=event_count)])
    | event_count > 20
  splunk: |-
    `comment("Splunk SPL for Account Age vs Transaction Volume Mismatch")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection and selection_high_volume | count() by account_id > 20")`
    index=flame_banking sourcetype=flame:transaction_monitoring
    account_age_days<90
    (event_type="WIRE_CREDIT" OR event_type="ACH_CREDIT" OR event_type="WIRE_INITIATION" OR event_type="ACH_DEBIT" OR event_type="INTERNAL_TRANSFER")
    peer_comparison="{'metric': 'transaction_count', 'threshold': 'percentile_95'}"
    | stats count as event_count by account_id
    | where event_count > 20
falsepositives:
- Legitimate new business accounts with immediate high transaction needs
- Student accounts receiving financial aid disbursements at semester start
level: high
tags:
- cfpf.phase5.monetization
- attack.t1583
- flame.mule_indicator
