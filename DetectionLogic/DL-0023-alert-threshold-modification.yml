title: Alert Threshold Modification
id: f62df3c4-71c6-49de-8ea3-bf2db3b0f90b
status: experimental
description: 'Detects when a user modifies their own transaction alert thresholds or disables notifications via online banking
  or mobile app. Attackers raise alert thresholds or suppress notifications to prevent the legitimate account holder from
  being alerted to unauthorized transactions.

  '
sigma_compatible: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
- TP-0001
- TP-0005
cfpf_phase: P3
fraud_types:
- account-takeover
logsource:
  product: banking
  service: core_banking
detection:
  selection_threshold_raise:
    event_type: ALERT_SETTINGS_CHANGE
    action:
    - threshold_increase
    - notification_disable
    - alert_suppress
  selection_channel:
    channel:
    - online_banking
    - mobile_app
    - api
  condition: selection_threshold_raise and selection_channel
data_sources:
  native_fields:
  - action
  - channel
  - event_type
falsepositives:
- Customers who intentionally adjust alert settings to reduce notification fatigue
- Business accounts adjusting thresholds for expected high-value transactions
level: medium
tags:
- cfpf.phase3.positioning
- attack.t1098
- flame.account_modification
