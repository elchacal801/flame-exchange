title: Beneficiary Change Velocity Anomaly
id: 5cf74ef7-5066-4957-bdb3-8b26d823d01d
status: experimental
description: 'Detects multiple beneficiary additions or modifications on a single account within a short time window. Rapid
  beneficiary changes are a strong pre-cursor to payment diversion fraud, where an attacker positions new destination accounts
  before initiating unauthorized wires.

  '
sigma_compatible: false
native_query_required: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://www.fincen.gov/sites/default/files/advisory/2019-10-01/BEC_Advisory_FINAL_508.pdf
threat_paths:
- TP-0001
- TP-0004
- TP-0006
cfpf_phase: P3
fraud_types:
- account-takeover
- payment-diversion
- wire-fraud
logsource:
  product: banking
  service: core_banking
detection:
  selection:
    event_type:
    - BENEFICIARY_ADD
    - BENEFICIARY_MODIFY
    - BENEFICIARY_DELETE
  timeframe: 24h
  condition: selection
data_sources:
  native_fields:
  - event_type
queries:
  logscale: |-
    // LogScale LQL for Beneficiary Change Velocity Anomaly
    // Repository: flame-banking-core-banking
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: selection | count(distinct beneficiary_id) by account_id > 3
    (event_type="BENEFICIARY_ADD" OR event_type="BENEFICIARY_MODIFY" OR event_type="BENEFICIARY_DELETE")
    | groupBy(account_id, function=[count(as=event_count), collect(beneficiary_id)])
    | event_count > 3
  splunk: |-
    `comment("Splunk SPL for Beneficiary Change Velocity Anomaly")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection | count(distinct beneficiary_id) by account_id > 3")`
    index=flame_banking sourcetype=flame:core_banking (event_type="BENEFICIARY_ADD" OR event_type="BENEFICIARY_MODIFY" OR event_type="BENEFICIARY_DELETE")
    | stats dc(beneficiary_id) as unique_beneficiary_id by account_id
    | where unique_beneficiary_id > 3
falsepositives:
- Corporate treasury teams onboarding multiple new vendors during month-end
- Business accounts setting up payroll beneficiaries for the first time
level: high
tags:
- cfpf.phase3.positioning
- attack.t1098
- flame.account_modification
