title: Long-Firm Credit Buildup Pattern — Steady Low Utilization Followed by Rapid Spike
id: 6c8d2e5f-4a1b-3f9e-d7a6-8b2c5e9f1d03
status: experimental
description: >
  Detects commercial accounts following a long-firm fraud pattern: steady low-value credit
  utilization for 6-12 months (building creditworthiness) followed by rapid escalation in
  credit utilization (the "burst"). Long-firm fraud involves organized criminal groups
  establishing businesses, building credit relationships, then exploiting that trust to
  defraud supply chain partners and trade finance banks. The artificially smooth buildup
  period followed by a discontinuous spike is the hallmark behavioral indicator.
sigma_compatible: false
native_query_required: true
references:
  - "UNODC, Organized Fraud — Issue Paper (Vienna, 2024) — Chapter II, Fraud Against Businesses"
  - "UK SFO, Serious Fraud Office secures three convictions in $500 million trade finance fraud, 2 February 2023"
threat_paths:
  - TP-0064
cfpf_phase: P4
fraud_types:
  - long-firm-fraud
  - bust-out
  - application-fraud
  - loan-fraud
logsource:
  product: banking
  service: commercial_credit
detection:
  selection:
    account_type: commercial
  timeframe: 12m
  condition: >
    trailing_6m_avg_utilization < 35%
    AND current_month_utilization > 80%
    AND prev_month_utilization < 50%
data_sources:
  native_fields:
    - account_id
    - account_type
    - credit_utilization_pct
    - credit_limit
    - transaction_date
    - monthly_payment_amount
queries:
  splunk: |-
    `comment("Splunk SPL for Long-Firm Credit Buildup Pattern")`
    `comment("Detects steady low utilization followed by rapid credit spike")`
    index=flame_banking sourcetype=flame:commercial_credit account_type="commercial"
    | bin _time span=1mon
    | stats avg(credit_utilization_pct) AS avg_util,
            max(credit_utilization_pct) AS max_util
      BY account_id, _time
    | streamstats avg(avg_util) AS trailing_6m_avg,
                  current=false window=6
      BY account_id
    | streamstats latest(avg_util) AS prev_month_util,
                  current=false window=1
      BY account_id
    | where trailing_6m_avg < 35 AND avg_util > 80 AND prev_month_util < 50
    | sort - avg_util

  sql: |-
    -- SQL for Long-Firm Credit Buildup Pattern
    WITH monthly_util AS (
        SELECT
            account_id,
            DATE_TRUNC('month', transaction_date) AS month,
            AVG(credit_utilization_pct) AS avg_util
        FROM commercial_credit_accounts
        WHERE account_type = 'commercial'
        GROUP BY account_id, DATE_TRUNC('month', transaction_date)
    ),
    trend AS (
        SELECT
            account_id,
            month,
            avg_util,
            LAG(avg_util, 1) OVER (PARTITION BY account_id ORDER BY month) AS prev_month_util,
            AVG(avg_util) OVER (
                PARTITION BY account_id ORDER BY month
                ROWS BETWEEN 6 PRECEDING AND 1 PRECEDING
            ) AS trailing_6m_avg
        FROM monthly_util
    )
    SELECT account_id, month, avg_util, trailing_6m_avg, prev_month_util
    FROM trend
    WHERE trailing_6m_avg < 35
      AND avg_util > 80
      AND prev_month_util < 50
    ORDER BY month DESC

falsepositives:
  - Seasonal businesses with legitimate cyclical credit utilization spikes
  - Businesses undergoing genuine rapid growth requiring increased credit
  - One-time large purchase on established credit facility
level: high
tags:
  - cfpf.phase4.execution
  - flame.unodc
  - flame.long-firm
  - flame.commercial-credit
