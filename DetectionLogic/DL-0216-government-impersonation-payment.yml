title: "Government Impersonation — Multi-Channel Payment Under Duress Indicators"
id: "b6d2e75a-1c8f-4a3e-f5b7-3d0c2e6a9b18"
status: experimental
description: >
  Detects government impersonation APP fraud by identifying payments with government
  agency references made via crypto, wire, or prepaid channels to non-historical payees.
  FBI IC3 2025 reported $797.9 million in losses from 32,424 government impersonation
  complaints — an 87% increase in complaints and 97% increase in losses from 2024. The
  payment channel distribution is distinctive: Cryptocurrency 40%, Wire Transfer/ACH 21%,
  Prepaid card/Gift card 15%, Cash 14%. This rule targets payment references containing
  government agency names or legal terminology from customers with no prior government-
  related payment history, as legitimate government payments follow established patterns
  and channels.
sigma_compatible: false
native_query_required: true
references:
  - "FBI IC3, 2025 Internet Crime Report — Government impersonation: 32,424 complaints, $797.9M losses (87% increase)"
  - "FBI IC3 PSA250418, April 18, 2025 — FBI Warns of Scammers Impersonating the IC3"
  - "https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf"
  - "https://www.ic3.gov/PSA/2025/PSA250418"
threat_paths:
  - TP-0084
  - TP-0027
cfpf_phase: P4
fraud_types:
  - impersonation
  - authorized-push-payment
  - social-engineering
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection_payment:
    transaction_type:
      - wire_transfer
      - ach_credit
      - crypto_purchase
      - prepaid_card_purchase
      - gift_card_purchase
  selection_gov_reference:
    payment_reference|contains:
      - IRS
      - SSA
      - Social Security
      - DOJ
      - FBI
      - DEA
      - warrant
      - penalty
      - tax lien
      - federal
      - treasury
      - immigration
      - customs
      - marshal
  filter_non_historical:
    payee_in_historical_pattern: false
  condition: selection_payment AND selection_gov_reference AND filter_non_historical
data_sources:
  native_fields:
    - account_id
    - account_holder_age
    - transaction_type
    - transaction_amount
    - transaction_date
    - payment_reference
    - payee_id
    - payee_name
  enrichment_required:
    - field: payee_in_historical_pattern
      source: Boolean — whether payee exists in 12-month historical payment network
  derived_fields:
    - payment_channel_diversity_72h
    - total_gov_reference_payments_7d
queries:
  cql: |-
    // CrowdStrike CQL for Government Impersonation Payment Detection
    // Detects payments with government references to non-historical payees
    (transaction_type="wire_transfer" OR transaction_type="ach_credit" OR transaction_type="crypto_purchase" OR transaction_type="prepaid_card_purchase" OR transaction_type="gift_card_purchase")
    payment_reference=/IRS|SSA|Social.Security|DOJ|FBI|DEA|warrant|penalty|tax.lien|federal|treasury|immigration|customs|marshal/i
    payee_in_historical_pattern="false"
    | groupBy(account_id, function=[
        collect([account_holder_age, transaction_type, transaction_amount,
                 transaction_date, payment_reference, payee_name]),
        count(transaction_id, as=payment_count),
        sum(transaction_amount, as=total_amount)
      ])
    | sort(total_amount, order=desc)
  splunk: |-
    `comment("Splunk SPL for Government Impersonation Payment Detection")`
    `comment("Detects payments with government references to non-historical payees")`
    index=flame_banking sourcetype=flame:transaction_monitoring
      (transaction_type="wire_transfer" OR transaction_type="ach_credit"
       OR transaction_type="crypto_purchase" OR transaction_type="prepaid_card_purchase"
       OR transaction_type="gift_card_purchase")
      payee_in_historical_pattern="false"
    | regex payment_reference="(?i)(IRS|SSA|Social.Security|DOJ|FBI|DEA|warrant|penalty|tax.lien|federal|treasury|immigration|customs|marshal)"
    | stats count AS payment_count, sum(transaction_amount) AS total_amount,
        dc(transaction_type) AS channel_diversity,
        values(transaction_type) AS channels,
        values(payment_reference) AS references,
        values(payee_name) AS payees
        by account_id, account_holder_age
    | eval risk_score = case(
        channel_diversity >= 2 AND total_amount > 10000, "critical",
        account_holder_age >= 60 AND total_amount > 5000, "critical",
        total_amount > 10000, "high",
        1=1, "medium")
    | sort - total_amount
falsepositives:
  - Legitimate tax payments to IRS via authorized payment processors
  - Attorney or legal service payments referencing government cases
  - Immigration service fees paid through authorized channels
  - Court-ordered payments referencing federal agencies
level: high
tags:
  - cfpf.phase4.execution
  - flame.government-impersonation
  - flame.authorized-push-payment
  - flame.social-engineering
