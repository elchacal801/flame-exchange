title: BNPL Cross-Account Device Clustering
id: 6f1a8c35-b9d7-4e42-a860-5e3d14c7f2b8
status: experimental
description: >
  Detects four or more distinct BNPL accounts created from or accessed by the
  same device fingerprint within a 30-day window, indicating potential synthetic
  identity ring activity or account farming operations. Normal BNPL usage
  involves 1-2 accounts per device over 12 months. Emulator-based mass account
  opening tools with device fingerprint spoofing can create dozens of accounts
  per day from a single physical device, but sophisticated device fingerprinting
  systems can detect emulator signatures and fingerprint collision patterns.
  This rule supports TP-0040 Phase 3 detection by identifying device-level
  clustering that precedes multi-provider stacking and coordinated bust-out.
references:
  - https://www.lexisnexis.com/risk/global-fraud-identity-report
threat_paths:
  - TP-0040
cfpf_phase: P3
fraud_types:
  - bnpl-fraud
  - identity-theft
logsource:
  product: ecommerce
  service: bnpl_onboarding
detection:
  selection:
    event_type: 'account_creation'
    account_type: 'bnpl'
  aggregation:
    count|gte: 4
    groupby: device_fingerprint_hash
    timeframe: 30d
  condition: selection and aggregation
falsepositives:
  - Shared household devices used by multiple family members for individual BNPL accounts
  - Retail kiosk or shared terminal devices in store environments
  - Workplace devices used by employees for personal BNPL accounts
level: high
tags:
  - cfpf.phase3.positioning
  - attack.t1586
  - flame.ecommerce
  - flame.bnpl_fraud
  - flame.device_clustering
  - flame.account_farming
