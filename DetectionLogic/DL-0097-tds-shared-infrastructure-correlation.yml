title: TDS Shared Infrastructure Correlation
id: 3a7c91d4-e5f2-4b18-9c6a-8d2f0e4b7a63
status: experimental
description: 'Detects domains from different apparent campaigns sharing hosting infrastructure, nameservers, or registration
  patterns — indicating a common TDS operator serving multiple affiliates. This rule performs graph-based correlation by identifying
  domains resolving to the same IP CIDR block with different registrant information but similar registration timing. TDS operators
  frequently reuse backend infrastructure across campaigns while rotating customer-facing domains, creating detectable infrastructure
  overlap patterns. Shared nameserver configurations, co-located IP assignments within the same /24 CIDR, and registration
  timestamps clustered within hours are strong indicators of centralized TDS management across ostensibly independent fraud
  campaigns.

  '
sigma_compatible: true
references:
- https://unit42.paloaltonetworks.com/traffic-distribution-systems/
- https://www.domaintools.com/resources/blog/tracking-tds-infrastructure
threat_paths:
- TP-0042
cfpf_phase: P3
fraud_types:
- tds-exploitation
logsource:
  product: dns_intelligence
  service: dns_resolution
detection:
  selection:
    event_type: passive_dns_resolution
    ip_cidr_overlap|gte: 2
    registrant_divergence: true
    registration_time_delta|lte: 72h
  aggregation:
    count|gte: 5
    groupby: ip_cidr_24
    timeframe: 7d
  condition: selection and aggregation
data_sources:
  native_fields:
  - count
  - event_type
  - groupby
  - timeframe
  enrichment_required:
  - field: ip_cidr_overlap
    source: Infrastructure correlation enrichment (CIDR overlap analysis)
  - field: registrant_divergence
    source: WHOIS analytics enrichment (registrant divergence detection)
  - field: registration_time_delta
    source: Temporal analytics enrichment (registration timing delta calculation)
falsepositives:
- Shared hosting providers where unrelated customers legitimately occupy the same CIDR block
- CDN or cloud provider IP ranges that host many unrelated domains
- Domain parking services that cluster domains on shared infrastructure
level: medium
tags:
- cfpf.phase3.positioning
- attack.t1583.001
- flame.tds
- flame.shared_infrastructure
- flame.graph_correlation
