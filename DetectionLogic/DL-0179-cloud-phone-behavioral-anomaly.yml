title: Cloud Phone Behavioral Anomaly — Device-Environment Decorrelation Detection
id: 521452a6-9a6d-4c8f-8948-f67fa2a5c528
status: experimental
description: >
  Detects cloud phone behavioral anomalies indicative of industrial-scale dropper/mule
  account creation. Cloud phones — remote-access Android devices running genuine firmware
  on ARM hardware in data centers — pass hardware attestation and present authentic device
  signals, making them invisible to traditional emulator detection. This rule uses a
  composite scoring approach combining device-environment decorrelation signals: perpetual
  full battery, absence of accelerometer motion during active sessions, presence of VPN/proxy
  and vendor management apps, unusually high banking app density, and recent device first-seen
  dates. Group-IB reports cloud phone rental from $0.10/hour with pre-verified dropper
  accounts selling for $50–200 on darknet markets. UK APP fraud losses reached £485.2M
  in 2023 with dropper accounts as the top contributing factor.
sigma_compatible: false
native_query_required: true
references:
  - "Group-IB, Cloud Phones: The Invisible Threat (March 25, 2026)"
  - "UK Finance, Annual Fraud Report 2023 — APP Fraud Losses"
  - "UK PSR, Mandatory Reimbursement for APP Fraud (October 2024)"
threat_paths:
  - TP-0059
  - TP-0022
cfpf_phase: P2
fraud_types:
  - automated-mule-accounts
  - money-mule
  - account-takeover
  - cloud-phone-fraud
logsource:
  product: banking
  service: mobile_device_telemetry
detection:
  selection:
    device_platform: android
  filter_battery:
    battery_level: 100
  filter_motion:
    accelerometer_motion_events: 0
  filter_vpn:
    vpn_proxy_app_installed: true
  filter_banking_density:
    banking_app_count|gte: 3
  filter_vendor_app:
    vendor_management_app_present:
      - "LDC Store"
      - "LD Assistant"
  filter_new_device:
    device_first_seen_days|lt: 30
  timeframe: session
  condition: >
    selection AND filter_battery AND filter_motion during active session
    AND (filter_vpn OR filter_vendor_app)
    AND filter_banking_density
    AND filter_new_device
  composite_score: >
    Assign weighted score: battery_level=100 (+20), accelerometer_motion_events=0
    during active session (+25), vpn_proxy_app_installed (+15),
    banking_app_count >= 3 (+15), vendor_management_app_present (+20),
    device_first_seen < 30 days (+5). Alert threshold: score >= 60.
data_sources:
  native_fields:
    - device_id
    - device_platform
    - battery_level
    - accelerometer_motion_events
    - session_start_time
    - session_end_time
    - installed_apps_list
    - banking_app_count
    - vpn_proxy_app_installed
    - vendor_management_app_present
    - device_first_seen_date
    - ip_address
    - ip_geolocation
    - device_timezone
  enrichment_required:
    - field: device_first_seen_days
      source: Days since device first appeared in telemetry
    - field: ip_timezone_match
      source: Comparison of IP geolocation timezone vs device-reported timezone
  derived_fields:
    - cloud_phone_risk_score
    - device_environment_decorrelation_flag
queries:
  cql: |-
    // CrowdStrike CQL for Cloud Phone Behavioral Anomaly Detection
    // Detects device-environment decorrelation signals indicative of cloud phone infrastructure
    device_platform="android"
    battery_level=100
    accelerometer_motion_events=0
    (vpn_proxy_app_installed="true" OR vendor_management_app_present IN ["LDC Store", "LD Assistant"])
    banking_app_count>=3
    | device_first_seen_days := dateDiff(now(), device_first_seen_date, unit=days)
    | cloud_phone_risk_score := (
        if(battery_level=100, 20, 0)
        + if(accelerometer_motion_events=0, 25, 0)
        + if(vpn_proxy_app_installed="true", 15, 0)
        + if(banking_app_count>=3, 15, 0)
        + if(vendor_management_app_present=*, 20, 0)
        + if(device_first_seen_days<30, 5, 0)
      )
    | cloud_phone_risk_score >= 60
    | groupBy(device_id, function=[
        collect([battery_level, accelerometer_motion_events, banking_app_count,
                 vpn_proxy_app_installed, vendor_management_app_present,
                 device_first_seen_date, ip_address, ip_geolocation,
                 device_timezone, cloud_phone_risk_score])
      ])
    | sort(cloud_phone_risk_score, order=desc)
  splunk: |-
    `comment("Splunk SPL for Cloud Phone Behavioral Anomaly Detection")`
    `comment("Detects device-environment decorrelation signals from cloud phone infrastructure")`
    index=flame_banking sourcetype=flame:mobile_device_telemetry
      device_platform="android"
      battery_level=100
      accelerometer_motion_events=0
      (vpn_proxy_app_installed="true" OR vendor_management_app_present IN ("LDC Store", "LD Assistant"))
      banking_app_count>=3
    | eval device_first_seen_days = round((now() - strptime(device_first_seen_date, "%Y-%m-%d")) / 86400, 0)
    | where device_first_seen_days < 30
    | eval score_battery = if(battery_level=100, 20, 0)
    | eval score_motion = if(accelerometer_motion_events=0, 25, 0)
    | eval score_vpn = if(vpn_proxy_app_installed="true", 15, 0)
    | eval score_banking = if(banking_app_count>=3, 15, 0)
    | eval score_vendor = if(isnotnull(vendor_management_app_present), 20, 0)
    | eval score_newdevice = if(device_first_seen_days<30, 5, 0)
    | eval cloud_phone_risk_score = score_battery + score_motion + score_vpn + score_banking + score_vendor + score_newdevice
    | where cloud_phone_risk_score >= 60
    | table device_id, battery_level, accelerometer_motion_events, banking_app_count,
            vpn_proxy_app_installed, vendor_management_app_present,
            device_first_seen_date, device_first_seen_days, ip_address,
            ip_geolocation, device_timezone, cloud_phone_risk_score
    | sort - cloud_phone_risk_score
  sql: |-
    -- SQL for Cloud Phone Behavioral Anomaly Detection
    -- Detects device-environment decorrelation signals from cloud phone infrastructure
    SELECT
      d.device_id,
      d.battery_level,
      d.accelerometer_motion_events,
      d.banking_app_count,
      d.vpn_proxy_app_installed,
      d.vendor_management_app_present,
      d.device_first_seen_date,
      DATEDIFF(DAY, d.device_first_seen_date, CURRENT_DATE) AS device_first_seen_days,
      d.ip_address,
      d.ip_geolocation,
      d.device_timezone,
      (CASE WHEN d.battery_level = 100 THEN 20 ELSE 0 END
       + CASE WHEN d.accelerometer_motion_events = 0 THEN 25 ELSE 0 END
       + CASE WHEN d.vpn_proxy_app_installed = TRUE THEN 15 ELSE 0 END
       + CASE WHEN d.banking_app_count >= 3 THEN 15 ELSE 0 END
       + CASE WHEN d.vendor_management_app_present IS NOT NULL THEN 20 ELSE 0 END
       + CASE WHEN DATEDIFF(DAY, d.device_first_seen_date, CURRENT_DATE) < 30 THEN 5 ELSE 0 END
      ) AS cloud_phone_risk_score
    FROM mobile_device_telemetry d
    WHERE d.device_platform = 'android'
      AND d.battery_level = 100
      AND d.accelerometer_motion_events = 0
      AND (d.vpn_proxy_app_installed = TRUE
           OR d.vendor_management_app_present IN ('LDC Store', 'LD Assistant'))
      AND d.banking_app_count >= 3
      AND DATEDIFF(DAY, d.device_first_seen_date, CURRENT_DATE) < 30
    HAVING cloud_phone_risk_score >= 60
    ORDER BY cloud_phone_risk_score DESC
falsepositives:
  - Devices in static charging cradles
  - Accessibility-configured tablets used for banking
level: high
tags:
  - attack.t1583
  - attack.t1078
  - cfpf.phase2.initial_access
  - flame.cloud-phone
