title: Browser Credential Store Access
id: d2368323-0cb9-48b1-bb41-1050d7f26e2d
status: experimental
description: 'Detects unusual access to browser credential stores (Login Data, logins.json, key3.db/key4.db) by non-browser
  processes. Infostealers such as RedLine and Vidar systematically read these SQLite databases to extract saved usernames
  and passwords for banking portals and other financial services.

  '
sigma_compatible: true
references:
- https://attack.mitre.org/techniques/T1555/003/
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
- TP-0001
- TP-0023
cfpf_phase: P2
fraud_types:
- credential-stuffing
- data-theft
- malware
logsource:
  product: banking
  service: endpoint_detection
detection:
  selection:
    file_path|endswith:
    - \Login Data
    - \Login Data-journal
    - \logins.json
    - \key4.db
    - \key3.db
    - \signons.sqlite
    file_access_type|contains:
    - read
    - open
  filter_browser_processes:
    process_name|endswith:
    - \chrome.exe
    - \firefox.exe
    - \msedge.exe
    - \brave.exe
    - \opera.exe
    - \vivaldi.exe
  filter_av:
    process_name|contains:
    - antivirus
    - defender
    - security
  condition: selection and not filter_browser_processes and not filter_av
data_sources:
  native_fields:
  - file_access_type
  - file_path
  - process_name
falsepositives:
- Password migration tools used during browser transitions
- IT-managed credential audit tools on corporate endpoints
level: high
tags:
- cfpf.phase2.initial_access
- attack.t1555.003
- attack.t1005
