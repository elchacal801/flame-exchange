title: AiTM Antibot Cloaking Detection — Divergent Content by Client Type
id: 548082ea-f953-4ab5-b9ff-0aba4be689b7
status: experimental
description: >
  Detects phishing pages that serve different content to automated scanners versus
  human visitors — a key evasion technique used by PhaaS platforms including Bluekit,
  Tycoon 2FA, and NakedPages. Antibot cloaking typically returns benign content
  (blank pages, Wikipedia redirects, legitimate-looking sites) to known scanner
  User-Agents, IP ranges associated with security vendors, and headless browsers,
  while serving the actual phishing page to real victims. Detection compares HTTP
  responses for the same URL across different client profiles. Sourced from Bluekit
  PhaaS TI report (CrimsonVector, March 2026).

date: 2026/03/30
sigma_compatible: false
native_query_required: true
threat_paths:
  - TP-0067
  - TP-0069
cfpf_phase: P2
fraud_types:
  - aitm-phishing
  - phishing
  - cloaking
  - fraud-as-a-service
logsource:
  product: banking
  category: web_traffic
  service: proxy_logs
detection:
  selection_redirect:
    response_code:
      - 301
      - 302
      - 307
    response_location|contains:
      - "wikipedia.org"
      - "google.com"
      - "youtube.com"
      - "rickroll"
  selection_suspicious_domain:
    request_url|re: ".*login.*|.*verify.*|.*secure.*|.*account.*"
  condition: selection_redirect and selection_suspicious_domain
  note: >
    Primary detection vector: URL with login/authentication keywords that redirects
    to Wikipedia, Google, or YouTube — characteristic of Evilginx rickroll redirect,
    NakedPages Wikipedia redirect, and Bluekit antibot cloaking. Secondary detection:
    same URL returning different Content-Length for different User-Agents within the
    same time window (requires web proxy logs with response size). Bluekit's March
    2026 changelog specifically added "improved security system that will work against
    safebrowsing red alert" — targeting Google Safe Browsing detection.
falsepositives:
  - Legitimate URL shorteners redirecting to Wikipedia/Google
  - A/B testing platforms serving different content to different users
  - Geo-restricted content redirecting non-target users
level: high
references:
  - Bluekit PhaaS TI Report — CrimsonVector, March 2026
  - Tycoon 2FA PhaaS antibot cloaking analysis
  - NakedPages Wikipedia redirect cloaking technique
  - Evilginx rickroll redirect detection methodology
tags:
  - cfpf.p2.initial_access
  - attack.t1027
  - attack.t1566.002
  - flame.shared
  - aitm-phishing
  - antibot-cloaking
  - phaas
  - bluekit
  - TP-0067
  - TP-0069
queries:
  splunk: |-
    index=proxy
    | where match(url, "(?i)(login|verify|secure|account|signin|auth)")
    | where response_code IN (301, 302, 307)
    | where match(response_location, "(?i)(wikipedia|google\.com|youtube|rickroll)")
    | stats count values(response_location) AS redirect_targets
      values(user_agent) AS user_agents by url, src_ip
    | sort -count
  cql: |-
    #event_simpleName=HttpRequest
    | HttpUrl=/(?i)(login|verify|secure|account|signin|auth)/
    | HttpResponseCode IN [301, 302, 307]
    | HttpResponseLocation=/(?i)(wikipedia|google\.com|youtube|rickroll)/
    | groupBy([HttpUrl, SourceIP], function=[count(aid), collect([HttpResponseLocation, UserAgent])])
