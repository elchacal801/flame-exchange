title: Browser Fingerprint Spoofing — User-Agent Inconsistency in Authentication Flow
id: 2d69ef69-d629-4359-89ce-a0b6847c651d
status: experimental
description: >
  Detects authentication sessions where the User-Agent string changes between
  sequential authentication steps — a strong indicator of AiTM proxy-based session
  hijacking. Bluekit advertises "full 2FA support with emulation/spoofing of
  geolocation and browser information," and Sneaky 2FA exhibits an "impossible
  device shift" where Safari/iOS is used for login but Edge/Windows for session
  resume. When a legitimate user authenticates, the User-Agent remains consistent
  throughout the flow. AiTM proxies may inject different User-Agents at different
  stages due to proxy architecture or deliberate fingerprint spoofing. Sourced from
  Bluekit PhaaS TI report and Sekoia TDR Sneaky 2FA analysis.

date: 2026/03/30
sigma_compatible: false
native_query_required: true
threat_paths:
  - TP-0067
cfpf_phase: P3
fraud_types:
  - aitm-phishing
  - account-takeover
  - credential-stuffing
logsource:
  product: banking
  category: identity_provider
  service: signinlogs
detection:
  selection:
    ResultType: 0
  timeframe: 10m
  condition: >
    selection | group by CorrelationId |
    where dc(UserAgent) >= 2
  note: >
    Correlate on CorrelationId (same authentication flow) rather than SessionId.
    A CorrelationId with 2+ distinct User-Agents within 10 minutes is abnormal —
    legitimate users do not change browsers mid-authentication. Strongest signal:
    mobile UA (Safari, Chrome-iOS) for initial login + desktop UA (Edge, Chrome-Win)
    for session resume. This is the Sneaky 2FA "impossible device shift" pattern.
    Bluekit's geolocation spoofing may also cause geographic inconsistencies between
    authentication steps.
falsepositives:
  - Browser updates applied between authentication steps (rare within 10min window)
  - Corporate proxy rewriting User-Agent strings inconsistently
  - Embedded browser views (WebView) in mobile apps
level: high
references:
  - Bluekit PhaaS TI Report — CrimsonVector, March 2026
  - Sekoia TDR Sneaky 2FA Analysis — impossible device shift pattern
  - Microsoft Entra ID Sign-in Logs schema documentation
tags:
  - cfpf.p3.positioning
  - attack.t1557
  - attack.t1550.004
  - flame.shared
  - aitm-phishing
  - account-takeover
  - browser-fingerprinting
  - sneaky-2fa
  - bluekit
  - TP-0067
queries:
  sentinel: |-
    SigninLogs
    | where TimeGenerated > ago(24h)
    | where ResultType == 0
    | summarize
        UACount = dcount(UserAgent),
        UAs = make_set(UserAgent),
        IPs = make_set(IPAddress),
        MinTime = min(TimeGenerated),
        MaxTime = max(TimeGenerated)
      by CorrelationId, UserPrincipalName
    | where UACount >= 2
    | where datetime_diff('minute', MaxTime, MinTime) <= 10
    | project UserPrincipalName, CorrelationId, UACount, UAs, IPs, MinTime, MaxTime
  cql: |-
    #event_simpleName=UserLogon
    | CorrelationId=*
    | groupBy([CorrelationId, UserPrincipalName], function=[
        count(UserAgent, distinct=true, as=ua_count),
        collect([UserAgent, RemoteAddressIP4])
      ], span=10m)
    | ua_count >= 2
