title: KYC Verification Bot Circumvention Detection
id: e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9b
status: experimental
description: 'Detect automated circumvention of KYC identity verification processes: (1) liveness check submissions exhibiting synthetic
  face indicators such as GAN artifacts or uniform skin texture, (2) document photo lighting conditions inconsistent with selfie
  environment suggesting pre-captured or generated images, (3) multiple verification attempts from geographically dispersed IP addresses
  using the same identity documents, (4) session duration and interaction patterns matching known automation tooling.

  '
date: 2026/03/20
sigma_compatible: true
threat_paths:
- TP-0059
- TP-0034
cfpf_phase: P2
fraud_types:
- new-account-fraud
- synthetic-identity
- application-fraud
logsource:
  product: banking
  category: identity_verification
  service: kyc_verification
detection:
  selection_synthetic:
    liveness_synthetic_score|gt: 0.7
  selection_lighting:
    document_lighting_mismatch: true
    selfie_lighting_mismatch: true
  selection_multi_ip:
    identity_multi_ip_count|gt: 2
    ip_geo_dispersion_km|gt: 500
  selection_automation:
    session_interaction_pattern: automated
    verification_attempt_count|gte: 3
  condition: selection_synthetic or selection_lighting or selection_multi_ip or selection_automation
data_sources:
  native_fields:
  - liveness_synthetic_score
  - document_lighting_mismatch
  - selfie_lighting_mismatch
  - identity_multi_ip_count
  - ip_geo_dispersion_km
  - session_interaction_pattern
  - verification_attempt_count
  enrichment_required:
  - field: liveness_synthetic_score
    source: Biometric analysis enrichment (GAN artifact and synthetic face detection scoring)
  - field: ip_geo_dispersion_km
    source: Geolocation enrichment (IP geographic dispersion calculation)
  - field: document_lighting_mismatch
    source: Document analysis enrichment (lighting environment consistency check)
falsepositives:
- Poor camera quality producing artifacts similar to GAN indicators
- Unusual lighting conditions during legitimate verification
- Users re-attempting verification from different networks (mobile vs wifi)
level: high
tags:
- cfpf.phase2.initial_access
- kyc-bypass
- synthetic-face
- gan-detection
- bot-circumvention
- TP-0059
- TP-0034
