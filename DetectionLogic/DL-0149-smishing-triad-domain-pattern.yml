title: Smishing Triad Domain Pattern and iMessage/RCS Delivery Detection
id: 4d7e1f3c-8b5a-2c6d-e9f4-1a3b7c5d8e02
status: experimental
description: >
  Detects indicators of Smishing Triad phishing infrastructure including
  Darcula/Magic Cat domain patterns and Chenlun kit fingerprints. The Smishing
  Triad ecosystem has generated 194,000+ malicious domains targeting users in
  121+ countries, compromising 884,000+ credit cards. Darcula domains follow a
  "com-" prefix pattern. Chenlun kits are fingerprinted by the presence of
  ResourceRedConfig.js and /ResourceConfig/urlConfig.json files. Detection
  also covers toll-scam lure patterns (E-ZPass, SunPass, FasTrak, I-Pass)
  commonly used in smishing campaigns.
sigma_compatible: false
native_query_required: true
references:
  - "Resecurity, Smishing Triad analysis (August 2023)"
  - "Netcraft, Darcula/Magic Cat documentation (March 2024)"
  - "PRODAFT, LARVA-246 tracking"
  - "Phishing kits and AiTM platforms: a comprehensive threat intelligence reference (2026)"
threat_paths:
  - TP-0069
cfpf_phase: P2
fraud_types:
  - smishing
  - phishing
  - card-not-present-fraud
logsource:
  product: web_proxy
  service: url_filtering
detection:
  selection_darcula_domain:
    url|re: "^https?://com-[a-z0-9]+"
  selection_chenlun_resource:
    url|contains:
      - "ResourceRedConfig.js"
      - "/ResourceConfig/urlConfig.json"
  selection_toll_lure:
    url|contains:
      - "ezpass"
      - "sunpass"
      - "fastrak"
      - "ipass"
      - "toll"
      - "parking-notice"
  condition: selection_darcula_domain OR selection_chenlun_resource OR selection_toll_lure
data_sources:
  native_fields:
    - url
    - domain
    - referrer
    - user_agent
    - source_ip
    - destination_ip
    - tls_sni
    - domain_age_days
queries:
  splunk: |-
    `comment("Splunk SPL for Smishing Triad Domain Pattern Detection")`
    `comment("Matches Darcula com- prefix, Chenlun kit files, and toll-scam lures")`
    index=web sourcetype=proxy:access
    | eval smishing_indicator = case(
        match(url, "^https?://com-[a-z0-9]+"), "darcula_domain_pattern",
        match(url, "ResourceRedConfig\.js"), "chenlun_kit_fingerprint",
        match(url, "/ResourceConfig/urlConfig\.json"), "chenlun_kit_fingerprint",
        match(url, "(?i)(ezpass|sunpass|fastrak|ipass|toll-|parking-notice)"), "toll_scam_lure",
        1=1, null()
      )
    | where isnotnull(smishing_indicator)
    | lookup domain_age_lookup domain OUTPUT domain_age_days
    | where domain_age_days < 30 OR isnull(domain_age_days)
    | stats count BY smishing_indicator, domain, source_ip, url
    | sort - count

  sql: |-
    -- SQL: Smishing Triad domain pattern detection
    -- Correlates proxy logs with domain intelligence
    SELECT
        p.access_time,
        p.source_ip,
        p.url,
        p.domain,
        d.registration_date,
        DATEDIFF(day, d.registration_date, GETDATE()) AS domain_age_days,
        CASE
            WHEN p.domain LIKE 'com-%' THEN 'darcula_domain_pattern'
            WHEN p.url LIKE '%ResourceRedConfig.js%' THEN 'chenlun_kit_fingerprint'
            WHEN p.url LIKE '%/ResourceConfig/urlConfig.json%' THEN 'chenlun_kit_fingerprint'
            WHEN p.url LIKE '%ezpass%' OR p.url LIKE '%sunpass%'
                OR p.url LIKE '%fastrak%' OR p.url LIKE '%ipass%' THEN 'toll_scam_lure'
        END AS indicator_type
    FROM proxy_access_logs p
    LEFT JOIN domain_intelligence d ON p.domain = d.domain
    WHERE (p.domain LIKE 'com-%'
           OR p.url LIKE '%ResourceRedConfig.js%'
           OR p.url LIKE '%/ResourceConfig/urlConfig.json%'
           OR p.url LIKE '%ezpass%' OR p.url LIKE '%sunpass%'
           OR p.url LIKE '%fastrak%' OR p.url LIKE '%ipass%')
      AND p.access_time >= DATEADD(day, -7, GETDATE())
    ORDER BY p.access_time DESC

falsepositives:
  - Legitimate domains beginning with "com-" (uncommon but possible)
  - Legitimate toll payment services (filter by known-good domains)
  - Security researchers analyzing smishing infrastructure
level: high
tags:
  - cfpf.phase2.initial_access
  - flame.smishing
  - flame.darcula
  - flame.chenlun
  - flame.smishing-triad
  - flame.toll-scam
