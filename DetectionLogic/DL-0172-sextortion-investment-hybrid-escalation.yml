title: Sextortion-Investment Hybrid Fraud — Small Payment Escalation to Crypto Addresses with Communication Pattern Shift
id: c19927d8-084d-4ba3-85b1-74ff158074f4
status: experimental
description: >
  Detects the sextortion-investment hybrid fraud pattern where a victim makes initial small
  payments followed by escalating amounts to cryptocurrency addresses, with the communication
  pattern showing a transition from social/romantic interaction to financial urgency. INTERPOL's
  2026 Global Financial Fraud Threat Assessment documents this as a globally escalating pattern
  where scam centre operators systematically pivot from romance/investment scripts to sextortion
  as a scripted operational fallback. The hallmark behavioral signature is a first-ever crypto
  transaction within 30 days of a new social media contact, followed by rapid escalation in
  both payment frequency and amount, often accompanied by messaging patterns shifting from
  casual/romantic to urgent/threatening language. The hybrid structure maximizes total extraction
  while suppressing victim reporting through shame and blackmail leverage.
sigma_compatible: false
native_query_required: true
references:
  - "INTERPOL Global Financial Fraud Threat Assessment, 2nd Edition, March 2026"
  - "INTERPOL GFFTA 2026 — Increasingly Hybrid Fraud Tactics and the Rise in Sextortion"
  - "FBI IC3: Internet Crime Report 2024 — sextortion statistics"
  - "Marasa & Ives, Deconstructing pig butchering, Journal of Economic Criminology, 2024"
threat_paths:
  - TP-0052
cfpf_phase: P4
fraud_types:
  - sextortion
  - investment-scam
  - romance-scam
  - hybrid-fraud
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection:
    payment_type:
      - cryptocurrency
      - crypto_deposit
      - wire_to_crypto_exchange
  filter_escalation_pattern:
    transaction_count_30d|gte: 3
    amount_increase_ratio_last_vs_first|gte: 3.0
  filter_first_crypto:
    is_first_crypto_period: true
    days_since_account_first_crypto|lte: 60
  filter_communication_shift:
    social_contact_recency_days|lte: 30
  timeframe: 30d
  condition: >
    selection AND filter_escalation_pattern AND filter_first_crypto
    AND filter_communication_shift
data_sources:
  native_fields:
    - account_id
    - transaction_id
    - payment_type
    - amount
    - currency
    - crypto_address
    - transaction_date
    - beneficiary_name
  enrichment_required:
    - field: is_first_crypto_period
      source: Account transaction history analysis — true if customer had no crypto transactions prior to 60 days ago
    - field: days_since_account_first_crypto
      source: Days since customer's first-ever cryptocurrency transaction
    - field: social_contact_recency_days
      source: Days since last new social media or dating app contact event (requires platform data enrichment or customer-reported timeline)
    - field: amount_increase_ratio_last_vs_first
      source: Ratio of most recent transaction amount to first transaction amount in the 30-day window
    - field: transaction_count_30d
      source: Count of crypto transactions to same or related addresses in trailing 30 days
  derived_fields:
    - escalation_velocity
    - total_amount_30d
    - unique_crypto_addresses
queries:
  cql: |-
    // CrowdStrike CQL for Sextortion-Investment Hybrid Escalation
    // Detects small-to-large crypto payment escalation following new social contact
    (payment_type="cryptocurrency" OR payment_type="crypto_deposit" OR payment_type="wire_to_crypto_exchange")
    is_first_crypto_period="true"
    days_since_account_first_crypto<=60
    | transaction_count_30d := count(transaction_id, span=30d)
    | first_amount := min(amount, span=30d)
    | last_amount := max(amount, span=30d)
    | escalation_ratio := last_amount / first_amount
    | where transaction_count_30d >= 3 AND escalation_ratio >= 3.0
    | total_amount_30d := sum(amount, span=30d)
    | unique_crypto_addresses := count(distinct=crypto_address, span=30d)
    | groupBy(account_id, function=[
        collect([total_amount_30d, transaction_count_30d, escalation_ratio,
                 first_amount, last_amount, unique_crypto_addresses,
                 days_since_account_first_crypto])
      ])
    | sort(total_amount_30d, order=desc)
  splunk: |-
    `comment("Splunk SPL for Sextortion-Investment Hybrid Escalation")`
    `comment("Detects escalating crypto payments following new social contact")`
    index=flame_banking sourcetype=flame:transaction_monitoring
      (payment_type="cryptocurrency" OR payment_type="crypto_deposit" OR payment_type="wire_to_crypto_exchange")
      is_first_crypto_period="true"
      days_since_account_first_crypto<=60
    | stats count AS transaction_count,
            min(amount) AS first_amount,
            max(amount) AS last_amount,
            sum(amount) AS total_amount,
            dc(crypto_address) AS unique_crypto_addresses,
            earliest(transaction_date) AS first_txn_date,
            latest(transaction_date) AS last_txn_date
      BY account_id
    | where transaction_count >= 3
    | eval escalation_ratio = last_amount / first_amount
    | where escalation_ratio >= 3.0
    | eval risk_score = case(
        escalation_ratio > 10 AND total_amount > 50000, "critical",
        escalation_ratio > 5 AND total_amount > 10000, "high",
        1=1, "medium")
    | table account_id, transaction_count, first_amount, last_amount,
            escalation_ratio, total_amount, unique_crypto_addresses,
            first_txn_date, last_txn_date, risk_score
    | sort - total_amount
  sql: |-
    -- SQL for Sextortion-Investment Hybrid Escalation
    -- Detects escalating crypto payments pattern characteristic of hybrid sextortion-investment fraud
    WITH crypto_txns AS (
      SELECT
        t.account_id,
        t.transaction_id,
        t.amount,
        t.crypto_address,
        t.transaction_date,
        ROW_NUMBER() OVER (PARTITION BY t.account_id ORDER BY t.transaction_date ASC) AS txn_seq,
        COUNT(*) OVER (PARTITION BY t.account_id) AS txn_count,
        MIN(t.amount) OVER (PARTITION BY t.account_id) AS first_amount,
        MAX(t.amount) OVER (PARTITION BY t.account_id) AS last_amount,
        SUM(t.amount) OVER (PARTITION BY t.account_id) AS total_amount,
        COUNT(DISTINCT t.crypto_address) OVER (PARTITION BY t.account_id) AS unique_addresses
      FROM transactions t
      JOIN account_crypto_history h ON t.account_id = h.account_id
      WHERE t.payment_type IN ('cryptocurrency', 'crypto_deposit', 'wire_to_crypto_exchange')
        AND t.transaction_date > CURRENT_DATE - INTERVAL '30 days'
        AND h.is_first_crypto_period = TRUE
        AND h.days_since_first_crypto <= 60
    )
    SELECT
      account_id,
      txn_count AS transaction_count,
      first_amount,
      last_amount,
      (last_amount / NULLIF(first_amount, 0)) AS escalation_ratio,
      total_amount,
      unique_addresses AS unique_crypto_addresses
    FROM crypto_txns
    WHERE txn_seq = 1
      AND txn_count >= 3
      AND (last_amount / NULLIF(first_amount, 0)) >= 3.0
    ORDER BY total_amount DESC
falsepositives:
  - Legitimate new cryptocurrency investor making progressively larger purchases as they gain confidence
  - Customer gradually converting savings to crypto for planned overseas relocation or property purchase
  - Recurring crypto purchases via dollar-cost-averaging strategy that happen to coincide with new social media activity
level: high
tags:
  - attack.t1657
  - cfpf.phase4.execution
  - flame.sextortion
  - flame.investment-scam
  - flame.hybrid-fraud
  - flame.romance-scam
