title: Blank Credit Card Subscription Fraud Pattern Detection
id: d0e1f2a3-b4c5-4d6e-7f8a-9b0c1d2e3f4a
status: experimental
description: 'Detects patterns consistent with blank credit card subscription fraud
  as operated by VexTrio/Ad Trafficko and similar affiliate fraud platforms. In this
  scheme, affiliates deploy customizable credit card capture templates offering low-cost
  items ("Free iPhone, $1.99 shipping" or "Walmart gift card, $0.99 shipping"). Victims
  enter card details believing they are paying a nominal fee; the platform charges
  a higher amount ($9.99 typical) and enrolls them in recurring subscriptions generating
  ongoing charges. Affiliate payouts reach $120 per successful lead. This rule targets
  the transaction monitoring layer to identify: (1) initial nominal-amount card-not-present
  charges from newly registered or unknown merchants followed by recurring charges
  at higher amounts, (2) merchant descriptor patterns consistent with subscription
  enrollment services, (3) high chargeback ratios from merchants exhibiting these
  patterns. Source: Black Hat USA 2025 (Infoblox VexTrio deanonymization).

  '
references:
- https://blackhat.com/us-25/briefings/schedule/#no-hoodies-here-organized-crime-in-adtech-46001
date: 2026/03/21
sigma_compatible: false
native_query_required: true
threat_paths:
- TP-0042
- TP-0054
cfpf_phase: P4
fraud_types:
- subscription-fraud
- tds-exploitation
- fraud-as-a-service
logsource:
  product: transaction_monitoring
  category: card_transactions
  service: payment_processor
detection:
  selection_initial_charge:
    transaction_type: CNP
    amount|lte: 2.99
    merchant_category_code|contains:
    - '5999'
    - '5968'
    - '5969'
    - '4816'
  selection_followup_subscription:
    transaction_type: recurring
    amount|gte: 6.99
    same_card_hash: true
    same_merchant_group: true
    days_after_initial|lte: 7
  selection_merchant_risk:
    merchant_registration_age_days|lt: 180
    merchant_chargeback_ratio|gte: 0.05
  condition: selection_initial_charge and (selection_followup_subscription or selection_merchant_risk)
data_sources:
  native_fields:
  - transaction_type
  - amount
  - merchant_category_code
  - merchant_descriptor
  - card_hash
  - merchant_id
  - merchant_registration_age_days
  - merchant_chargeback_ratio
  enrichment_required:
  - field: merchant_registration_age_days
    source: Merchant onboarding records (merchant account age)
  - field: merchant_chargeback_ratio
    source: Payment processor chargeback analytics
queries:
  splunk: |-
    `comment("Splunk SPL for Blank CC Subscription Fraud Pattern Detection")`
    `comment("Identifies nominal-charge-to-recurring-subscription patterns (Ad Trafficko model)")`
    index=flame_txn sourcetype=flame:card_transactions transaction_type=CNP
    | eval is_nominal=(if(amount<=2.99, 1, 0))
    | eval is_recurring_followup=(if(transaction_type="recurring" AND amount>=6.99, 1, 0))
    | stats
        sum(is_nominal) AS nominal_charges
        sum(is_recurring_followup) AS recurring_charges
        dc(card_hash) AS unique_cards
        avg(amount) AS avg_amount
        max(amount) AS max_amount
        values(merchant_descriptor) AS descriptors
        latest(merchant_chargeback_ratio) AS chargeback_ratio
      by merchant_id
    | where nominal_charges > 10 AND recurring_charges > 5
    | eval conversion_ratio=round(recurring_charges/nominal_charges, 2)
    | where conversion_ratio > 0.3 OR chargeback_ratio > 0.05
    | sort -recurring_charges
  sql: |-
    -- SQL for Blank CC Subscription Fraud Pattern Detection
    -- Identifies merchants exhibiting nominal-to-recurring subscription fraud patterns
    WITH initial_charges AS (
      SELECT card_hash, merchant_id, merchant_descriptor, amount,
             transaction_date, transaction_id
      FROM card_transactions
      WHERE transaction_type = 'CNP'
        AND amount <= 2.99
        AND transaction_date >= CURRENT_DATE - INTERVAL '30 days'
    ),
    followup_subscriptions AS (
      SELECT card_hash, merchant_id, amount,
             transaction_date, transaction_type
      FROM card_transactions
      WHERE transaction_type = 'recurring'
        AND amount >= 6.99
        AND transaction_date >= CURRENT_DATE - INTERVAL '30 days'
    )
    SELECT
      ic.merchant_id,
      ic.merchant_descriptor,
      COUNT(DISTINCT ic.transaction_id) AS nominal_charge_count,
      COUNT(DISTINCT fs.card_hash) AS cards_enrolled_recurring,
      AVG(fs.amount) AS avg_recurring_amount,
      m.chargeback_ratio,
      m.registration_date
    FROM initial_charges ic
    JOIN followup_subscriptions fs
      ON ic.card_hash = fs.card_hash
      AND ic.merchant_id = fs.merchant_id
      AND fs.transaction_date BETWEEN ic.transaction_date AND ic.transaction_date + INTERVAL '7 days'
    JOIN merchant_profiles m ON ic.merchant_id = m.merchant_id
    GROUP BY ic.merchant_id, ic.merchant_descriptor, m.chargeback_ratio, m.registration_date
    HAVING COUNT(DISTINCT ic.transaction_id) > 10
       AND COUNT(DISTINCT fs.card_hash) > 5
    ORDER BY cards_enrolled_recurring DESC;
falsepositives:
- Legitimate free trial offers that convert to paid subscriptions (though legitimate merchants typically have lower chargeback ratios)
- Promotional shipping offers from established e-commerce merchants
- Subscription box services with nominal initial trial charges
level: high
tags:
- cfpf.phase4.execution
- blank-cc-submit
- subscription-fraud
- ad-trafficko
- vextrio
- affiliate-fraud
- recurring-charge
- chargeback-anomaly
- TP-0042
- TP-0054
