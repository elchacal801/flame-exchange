title: First-Party Dispute Anomaly — Chargeback with Delivery Confirmation, Device Match, and No Merchant Contact
id: 67fbbbd3-ac75-49dd-8d8a-432c717d05eb
status: experimental
description: >
  Detects high-confidence friendly fraud by identifying chargebacks where three independent
  indicators contradict the dispute claim: (1) delivery was confirmed for the original order,
  (2) the device fingerprint filing the dispute matches the device used for the original
  purchase, and (3) no merchant contact was attempted before the chargeback was filed.
  The triple correlation of delivery evidence, device match, and merchant bypass is a
  strong signal that the cardholder is the original purchaser who received the goods and
  chose to file a chargeback rather than a legitimate return. 84% of consumers find
  chargebacks simpler than contacting merchants, creating systemic abuse of the dispute
  mechanism.
sigma_compatible: false
native_query_required: true
references:
  - "Chargebacks911, State of Chargebacks 2026"
  - "Chargeflow, Friendly Fraud Statistics 2025 — 84% simplicity preference"
  - "Visa, Visa Acquirer Monitoring Program (VAMP) (April 2025)"
  - "Alloy, First-party fraud detection strategies"
threat_paths:
  - TP-0075
cfpf_phase: P4
fraud_types:
  - friendly-fraud
  - chargeback-abuse
  - dispute-fraud
logsource:
  product: payments
  service: dispute_management
detection:
  selection:
    dispute_type:
      - chargeback
  filter_delivery:
    delivery_confirmed: true
  filter_device_match:
    device_fingerprint_match: true
  filter_no_merchant_contact:
    merchant_contact_prior: false
  timeframe: 30d
  condition: >
    selection AND filter_delivery AND filter_device_match
    AND filter_no_merchant_contact
data_sources:
  native_fields:
    - dispute_id
    - cardholder_id
    - merchant_id
    - dispute_amount
    - dispute_reason_code
    - dispute_date
    - original_transaction_id
  enrichment_required:
    - field: delivery_confirmed
      source: Shipping carrier delivery confirmation (signed, GPS-verified, photo proof)
    - field: device_fingerprint_match
      source: Comparison of device fingerprint at dispute filing vs. original purchase
    - field: merchant_contact_prior
      source: Merchant CRM/support records — any contact from cardholder between transaction and dispute
  derived_fields:
    - days_from_delivery_to_dispute
    - dispute_device_ip
    - purchase_device_ip
queries:
  cql: |-
    // CQL for First-Party Dispute Anomaly Detection — DL-0191
    // Triple-correlated friendly fraud: delivery + device match + no merchant contact
    Chargebacks
    | dispute_type = "chargeback"
    | dispute_date >= now() - 30d
    | delivery_confirmed = true
    | device_fingerprint_match = true
    | merchant_contact_prior = false OR merchant_contact_prior = null
    | days_delivery_to_dispute := round((dispute_date - delivery_date) / 86400, 0)
    | sort(dispute_amount, order=desc)
  sql: |-
    -- SQL: First-Party Dispute Anomaly Detection
    -- Chargeback with delivery confirmation, device match, no merchant contact
    SELECT
      d.dispute_id,
      d.cardholder_id,
      d.merchant_id,
      d.dispute_amount,
      d.dispute_reason_code,
      d.dispute_date,
      t.transaction_date,
      t.delivery_confirmed,
      t.delivery_date,
      DATEDIFF(DAY, t.delivery_date, d.dispute_date) AS days_delivery_to_dispute,
      t.device_fingerprint AS purchase_device,
      d.device_fingerprint AS dispute_device,
      CASE WHEN t.device_fingerprint = d.device_fingerprint THEN 1 ELSE 0 END
        AS device_match,
      mc.last_contact_date AS merchant_contact_date
    FROM chargebacks d
    JOIN transactions t ON d.original_transaction_id = t.transaction_id
    LEFT JOIN merchant_contacts mc ON d.cardholder_id = mc.customer_id
      AND d.merchant_id = mc.merchant_id
      AND mc.contact_date BETWEEN t.transaction_date AND d.dispute_date
    WHERE d.dispute_date >= DATEADD(DAY, -30, CURRENT_DATE)
      AND t.delivery_confirmed = 1
      AND t.device_fingerprint = d.device_fingerprint
      AND mc.contact_id IS NULL
    ORDER BY d.dispute_amount DESC
  splunk: |-
    `comment("Splunk SPL: First-Party Dispute Anomaly Detection")`
    `comment("Triple-correlated friendly fraud: delivery + device match + no merchant contact")`
    index=flame_payments sourcetype=flame:dispute_management
      dispute_type="chargeback"
    | lookup delivery_lookup original_transaction_id
        OUTPUT delivery_confirmed, delivery_date
    | lookup device_lookup original_transaction_id
        OUTPUT purchase_device_fingerprint
    | lookup merchant_contact_lookup cardholder_id, merchant_id
        OUTPUT merchant_contact_prior
    | where delivery_confirmed="true"
      AND dispute_device_fingerprint=purchase_device_fingerprint
      AND (merchant_contact_prior="false" OR isnull(merchant_contact_prior))
    | eval days_delivery_to_dispute = round(
        (strptime(dispute_date, "%Y-%m-%d") - strptime(delivery_date, "%Y-%m-%d")) / 86400, 0)
    | table dispute_id, cardholder_id, merchant_id, dispute_amount,
            dispute_reason_code, dispute_date, delivery_date,
            days_delivery_to_dispute, purchase_device_fingerprint
    | sort - dispute_amount
falsepositives:
  - Legitimate disputes where the product was defective but cardholder did not contact merchant
  - Shared devices where a different household member made the purchase
  - Delivery marked as confirmed but actually misdelivered (e.g., left at wrong address)
level: high
tags:
  - cfpf.phase4.execution
  - flame.friendly-fraud
  - flame.chargeback-abuse
  - flame.dispute-fraud
