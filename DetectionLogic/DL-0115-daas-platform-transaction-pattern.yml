title: DaaS Platform Transaction Pattern
id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: 'Detect cryptocurrency transactions matching Deepfake-as-a-Service (DaaS) subscription patterns: recurring payments
  of $100-$1,000/month to wallets associated with known deepfake service providers, or one-time payments of $50-$500 for per-use
  deepfake generation services. These patterns indicate procurement of deepfake tooling used in downstream fraud operations including
  identity verification bypass and social engineering.

  '
date: 2026/03/20
sigma_compatible: true
threat_paths:
- TP-0057
cfpf_phase: P1
fraud_types:
- deepfake-as-a-service
- fraud-as-a-service
logsource:
  product: crypto
  category: blockchain_analytics
  service: blockchain_analytics
detection:
  selection_recurring:
    payment_type: recurring
    recurring_payment_amount|gte: 100
    recurring_payment_amount|lte: 1000
    recurring_payment_currency: USD
    recurring_payment_interval: monthly
    destination_wallet_flag|contains:
    - deepfake_service
    - daas_provider
  selection_onetime:
    payment_type: one-time
    transaction_amount|gte: 50
    transaction_amount|lte: 500
    destination_wallet_flag|contains:
    - deepfake_service
    - daas_provider
  condition: selection_recurring or selection_onetime
data_sources:
  native_fields:
  - payment_type
  - recurring_payment_amount
  - recurring_payment_currency
  - recurring_payment_interval
  - transaction_amount
  - destination_wallet_flag
  enrichment_required:
  - field: destination_wallet_flag
    source: Threat intelligence enrichment (known DaaS provider wallet attribution)
falsepositives:
- Legitimate AI SaaS subscriptions paid in cryptocurrency
- NFT art purchases from digital artists
- Legitimate face-swap or avatar generation services for entertainment
level: medium
tags:
- cfpf.phase1.recon
- deepfake
- daas
- subscription-pattern
- fraud-as-a-service
- TP-0057
