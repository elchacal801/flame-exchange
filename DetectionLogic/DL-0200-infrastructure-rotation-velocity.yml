title: Infrastructure Rotation Velocity — Rapid DNS IP Changes Within BPH Networks
id: c4f8b2d5-ae30-4f9b-b7d2-8a1f9e4b0c52
status: experimental
description: >
  Detects domains exhibiting rapid IP address rotation characteristic of bulletproof
  hosting infrastructure management. BPH operators rotate IP addresses every 24-72
  hours to evade blocklists, with emergency rotation following IOC publication.
  A domain resolving to 4+ unique IPs within 7 days — particularly when those IPs
  span multiple TAE provider ASNs — is a strong indicator of managed BPH infrastructure
  rotation. This detection complements static IP blocklists by identifying the
  rotation behavior itself. Sourced from Flare Academy BPH Webinar and Cybercrime
  Diaries BPH landscape analysis.

date: 2026/03/30
sigma_compatible: false
native_query_required: true
threat_paths:
  - TP-0061
  - TP-0067
cfpf_phase: P2
fraud_types:
  - bulletproof-hosting
  - infrastructure-rotation
  - bph-migration
logsource:
  product: dns_intelligence
  category: passive_dns
  service: dns_monitoring
detection:
  selection:
    record_type: A
  timeframe: 7d
  condition: selection | stats dc(answer) as unique_ips by query | unique_ips >= 4
  note: >
    Requires passive DNS data feed. Threshold of 4+ unique IPs in 7 days excludes
    legitimate CDN/load-balancer rotation (which typically resolves to consistent
    IP pools) while catching BPH rotation patterns (which traverse distinct /24
    blocks or ASNs). Cross-reference resolved IPs against TAE ASN ranges for
    high-confidence alerts.
falsepositives:
  - Legitimate CDN services rotating edge IPs (Cloudflare, Akamai, Fastly)
  - Round-robin DNS load balancing
  - Dynamic DNS services with frequent IP updates
  - Cloud auto-scaling events changing IP assignments
level: medium
references:
  - Flare Academy BPH Webinar — infrastructure rotation detection methodology
  - Cybercrime Diaries BPH Landscape Analysis (2025)
tags:
  - cfpf.p2.infrastructure
  - attack.t1583.001
  - flame.shared
  - bulletproof-hosting
  - dns-rotation
  - infrastructure-rotation
  - TP-0061
  - TP-0067
queries:
  splunk: |-
    index=dns sourcetype=passive_dns
    | stats dc(answer) AS unique_ips values(answer) AS ip_list
      earliest(_time) AS first_seen latest(_time) AS last_seen by query
    | where unique_ips >= 4
    | eval days_active=round((last_seen-first_seen)/86400, 1)
    | where days_active <= 7
    | mvexpand ip_list
    | lookup tae_asn_ranges ip_list OUTPUT asn_name
    | stats dc(asn_name) AS distinct_asns values(asn_name) AS asn_list
      values(ip_list) AS all_ips by query
    | where distinct_asns >= 2
    | sort -distinct_asns
  cql: |-
    #event_simpleName=DnsRequest
    | groupBy([DomainName], function=[
        count(ResponseIP, distinct=true, as=unique_ips),
        collect([ResponseIP])
      ], span=7d)
    | unique_ips >= 4
