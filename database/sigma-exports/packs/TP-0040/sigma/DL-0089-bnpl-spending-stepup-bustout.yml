title: BNPL Spending Step-Up to Limit Bust-Out Pattern
id: 4b8d6f23-e1a9-4c75-9d34-8f2e57a0cb19
status: experimental
description: >
  Detects the characteristic spending escalation pattern of BNPL bust-out fraud,
  where accounts begin with small purchases (under $50) during a credit grooming
  phase, then rapidly escalate to purchases consuming 85% or more of the
  available credit limit within 14 days. This pattern distinguishes synthetic
  bust-out operations from legitimate consumer behavior, where spending typically
  ramps gradually over weeks to months. Recorded in organized rings deploying
  50-1,000+ synthetic identities, the grooming-to-bustout transition represents
  the highest-confidence detection window for TP-0040 Phase 4 execution, as the
  sharp behavioral shift from conservative to aggressive spending is difficult
  for fraudsters to avoid without sacrificing the speed required for coordinated
  multi-provider bust-out.
references:
  - https://www.lexisnexis.com/risk/global-fraud-identity-report
threat_paths:
  - TP-0040
cfpf_phase: P4
fraud_types:
  - bnpl-fraud
  - first-party-fraud
  - bust-out
logsource:
  product: ecommerce
  service: bnpl_transactions
detection:
  selection:
    account_type: 'bnpl'
  filter_first_order:
    first_order_value|lte: 50
  filter_limit_usage:
    max_order_pct_of_limit|gte: 85
  filter_timespan:
    days_first_to_max_order|lte: 14
  condition: selection and filter_first_order and filter_limit_usage and filter_timespan
falsepositives:
  - Legitimate consumers building confidence with a new BNPL provider before making a planned large purchase
  - Seasonal shopping patterns where consumers save large purchases for sales events
level: critical
tags:
  - cfpf.phase4.execution
  - attack.t1657
  - flame.ecommerce
  - flame.bnpl_fraud
  - flame.bust_out
  - flame.credit_grooming
