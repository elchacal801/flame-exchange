title: SSN Age and Issuance Mismatch — Synthetic Identity Indicator
id: 635744c1-1639-474b-b160-ff57b3b01873
status: experimental
description: >
  Detects credit applications where the SSN characteristics are inconsistent with the
  applicant's stated identity — a primary indicator of synthetic identity fabrication.
  Key signals: (1) SSN issued after the applicant's date of birth suggests the SSN belongs
  to someone else (minors, immigrants, recently deceased), (2) post-2011 randomized SSNs
  that don't match SSA area number geography, (3) SSN first appearing at credit bureaus
  within the last 18 months combined with an applicant age > 25 (natural credit profiles
  start appearing at 18-22). The eCBSV (electronic Consent Based SSN Verification) service
  can confirm SSN-name-DOB matches, but adoption is inconsistent.
sigma_compatible: false
native_query_required: true
references:
  - "Federal Reserve, Synthetic Identity Fraud in the U.S. Payment System (2024)"
  - "SSA, Electronic Consent Based SSN Verification (eCBSV) Service"
  - "TransUnion, Synthetic Identity Detection via SSN Anomaly Analysis (2025)"
threat_paths:
  - TP-0003
  - TP-0029
cfpf_phase: P2
fraud_types:
  - synthetic-identity
  - application-fraud
  - identity-theft
logsource:
  product: banking
  service: account_onboarding
detection:
  selection_application:
    event_type: CREDIT_APPLICATION
  filter_ssn_age_mismatch:
    ssn_issue_year_estimated|gt: 0
  condition: >
    selection_application AND
    (applicant_stated_age > 25 AND credit_file_age_months < 18)
    OR (ssn_issue_year_estimated > applicant_birth_year)
    OR (applicant_stated_age < 16 AND credit_inquiry_exists = true)
data_sources:
  native_fields:
    - applicant_id
    - event_type
    - application_date
    - applicant_stated_dob
    - ssn_hash
    - address
    - phone
    - device_fingerprint
  enrichment_required:
    - field: ssn_issue_year_estimated
      source: SSA issuance year estimation (pre-2011 area-group-serial; post-2011 randomized)
    - field: applicant_birth_year
      source: Derived from applicant_stated_dob
    - field: applicant_stated_age
      source: Derived from applicant_stated_dob
    - field: credit_file_age_months
      source: Credit bureau inquiry — months since credit file creation
    - field: credit_inquiry_exists
      source: Credit bureau — whether any prior inquiries exist for this SSN
  derived_fields:
    - ssn_dob_gap_years
    - risk_indicator_type
queries:
  cql: |-
    // CrowdStrike CQL for SSN Age and Issuance Mismatch
    // Detects synthetic identity indicators via SSN-DOB-credit file inconsistencies
    event_type="CREDIT_APPLICATION"
    | ssn_dob_gap_years := ssn_issue_year_estimated - applicant_birth_year
    | risk_indicator_type := case {
        applicant_stated_age > 25 AND credit_file_age_months < 18 | "late_credit_file";
        ssn_issue_year_estimated > applicant_birth_year | "ssn_postdates_birth";
        applicant_stated_age < 16 AND credit_inquiry_exists="true" | "minor_ssn_with_credit";
        * | "none";
      }
    | risk_indicator_type != "none"
    | select([applicant_id, application_date, applicant_stated_age,
              credit_file_age_months, ssn_issue_year_estimated,
              applicant_birth_year, ssn_dob_gap_years,
              risk_indicator_type, address, device_fingerprint])
    | sort(application_date, order=desc)
  splunk: |-
    `comment("Splunk SPL for SSN Age and Issuance Mismatch")`
    `comment("Detects synthetic identity via SSN-DOB-credit file inconsistencies")`
    index=flame_banking sourcetype=flame:account_onboarding
      event_type="CREDIT_APPLICATION"
    | eval ssn_dob_gap = ssn_issue_year_estimated - applicant_birth_year
    | eval risk_indicator = case(
        applicant_stated_age > 25 AND credit_file_age_months < 18, "late_credit_file",
        ssn_issue_year_estimated > applicant_birth_year, "ssn_postdates_birth",
        applicant_stated_age < 16 AND credit_inquiry_exists="true", "minor_ssn_with_credit",
        1=1, "none")
    | where risk_indicator != "none"
    | table applicant_id, application_date, applicant_stated_age,
            credit_file_age_months, ssn_issue_year_estimated,
            applicant_birth_year, ssn_dob_gap,
            risk_indicator, address, device_fingerprint
    | sort - application_date
  sql: |-
    -- SQL for SSN Age and Issuance Mismatch
    -- Detects synthetic identity via SSN-DOB-credit file inconsistencies
    SELECT
      a.applicant_id,
      a.application_date,
      DATEDIFF(YEAR, a.applicant_stated_dob, CURRENT_DATE) AS applicant_stated_age,
      e.credit_file_age_months,
      e.ssn_issue_year_estimated,
      YEAR(a.applicant_stated_dob) AS applicant_birth_year,
      (e.ssn_issue_year_estimated - YEAR(a.applicant_stated_dob)) AS ssn_dob_gap,
      CASE
        WHEN DATEDIFF(YEAR, a.applicant_stated_dob, CURRENT_DATE) > 25
             AND e.credit_file_age_months < 18 THEN 'late_credit_file'
        WHEN e.ssn_issue_year_estimated > YEAR(a.applicant_stated_dob)
             THEN 'ssn_postdates_birth'
        WHEN DATEDIFF(YEAR, a.applicant_stated_dob, CURRENT_DATE) < 16
             AND e.credit_inquiry_exists = 1 THEN 'minor_ssn_with_credit'
      END AS risk_indicator,
      a.address,
      a.device_fingerprint
    FROM credit_applications a
    JOIN applicant_enrichment e ON a.applicant_id = e.applicant_id
    WHERE a.event_type = 'CREDIT_APPLICATION'
      AND (
        (DATEDIFF(YEAR, a.applicant_stated_dob, CURRENT_DATE) > 25 AND e.credit_file_age_months < 18)
        OR (e.ssn_issue_year_estimated > YEAR(a.applicant_stated_dob))
        OR (DATEDIFF(YEAR, a.applicant_stated_dob, CURRENT_DATE) < 16 AND e.credit_inquiry_exists = 1)
      )
    ORDER BY a.application_date DESC
falsepositives:
  - Recent immigrants who obtained SSNs later in life (legitimate late credit file)
  - Young adults with limited credit history applying for first credit products
  - Data entry errors in date of birth fields
level: high
tags:
  - attack.t1589
  - cfpf.phase2.initial_access
  - flame.synthetic-identity
  - flame.ssn-anomaly
