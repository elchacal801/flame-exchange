title: Stolen Session Token Replay
id: 61fe961a-eb9d-48dc-8a80-18a3a4c6bcb8
status: experimental
description: >
  Detects session token replay from a different geographic location or device than the original
  authenticating session. When infostealers exfiltrate active session cookies, attackers import
  them into antidetect browsers to hijack authenticated sessions without triggering login-based
  detections. This rule correlates session token usage across differing geolocations and device
  fingerprints.
references:
  - https://attack.mitre.org/techniques/T1539/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0008
  - TP-0001
cfpf_phase: P2
fraud_types:
  - account-takeover
  - data-theft
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type: 'session_activity'
    session_token|exists: true
  filter_same_context:
    geo_country: '%original_session_country%'
    device_fingerprint: '%original_device_fingerprint%'
  condition: selection and not filter_same_context | count() by session_token > 1

  # Correlation: same session_token observed from two or more distinct (geo_country, device_fingerprint) pairs
falsepositives:
  - Users connecting via VPN whose egress IP changes geographic region mid-session
  - Mobile users roaming internationally with active banking sessions
level: critical
tags:
  - cfpf.phase2.initial_access
  - attack.t1539
  - attack.t1550.004
