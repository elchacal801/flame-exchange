title: Check Washing — Altered Check Mobile Deposit with Duplicate or MICR Inconsistency
id: 20b5c78c-7779-4c5a-8c13-7b9b49ec9294
status: experimental
description: >
  Detects mobile deposits of potentially washed or altered checks by identifying two key
  indicators: (1) the same check number deposited at multiple financial institutions within a
  short window, indicating duplicate deposit fraud, and (2) check amounts inconsistent with the
  MICR (Magnetic Ink Character Recognition) line data, suggesting the payee and amount fields
  were chemically washed and rewritten while the MICR line was preserved. FinCEN data shows
  check fraud SARs surged 200%+ from 2021-2023, driven by USPS mail theft and the ease of
  mobile deposit. Washed checks deposited via mobile apps exploit the lag between deposit and
  check clearing under Reg CC funds availability requirements. The Recorded Future 2025 report
  documented a geographic shift in stolen check activity toward the Midwest and suburban/rural
  USPS routes.
sigma_compatible: false
native_query_required: true
references:
  - "FinCEN, Check Fraud SAR Trends (2023-2024)"
  - "FBI IC3, 2024 Internet Crime Report — $483M in credit card and check fraud losses"
  - "USPS OIG, Mail Theft and Check Fraud Reports"
  - "Recorded Future, Annual Payment Fraud Intelligence Report 2025 — deurbanization trend"
threat_paths:
  - TP-0009
cfpf_phase: P4
fraud_types:
  - check-fraud
  - duplicate-deposit
  - check-washing
logsource:
  product: banking
  service: check_processing
detection:
  selection:
    deposit_channel:
      - mobile
      - remote_deposit_capture
  filter_duplicate_check:
    check_number_deposit_count|gte: 2
  filter_micr_mismatch:
    micr_amount_match: false
  filter_account_age:
    account_age_days|lt: 30
  timeframe: 7d
  condition: >
    selection AND (filter_duplicate_check OR filter_micr_mismatch)
    AND filter_account_age
data_sources:
  native_fields:
    - account_id
    - check_number
    - check_amount
    - micr_line_data
    - micr_encoded_amount
    - deposit_channel
    - deposit_date
    - device_fingerprint
    - depositing_institution_id
    - account_open_date
  enrichment_required:
    - field: check_number_deposit_count
      source: Cross-institution duplicate check detection consortium or internal duplicate check database
    - field: micr_amount_match
      source: Comparison of written/printed check amount against MICR-encoded amount
    - field: account_age_days
      source: Derived from account_open_date vs deposit_date
  derived_fields:
    - amount_micr_delta
    - deposits_from_device_count
    - duplicate_institution_count
queries:
  cql: |-
    // CrowdStrike CQL for Check Washing — Altered Check Mobile Deposit
    // Detects duplicate deposits across institutions or MICR amount mismatches
    (deposit_channel="mobile" OR deposit_channel="remote_deposit_capture")
    account_age_days<30
    (check_number_deposit_count>=2 OR micr_amount_match="false")
    | amount_micr_delta := check_amount - micr_encoded_amount
    | deposits_from_device := count(account_id, as=deposits_from_device_count, field=device_fingerprint)
    | groupBy(check_number, function=[
        collect([account_id, check_amount, micr_encoded_amount, amount_micr_delta,
                 deposit_date, device_fingerprint, depositing_institution_id,
                 account_open_date, check_number_deposit_count])
      ])
    | sort(check_number_deposit_count, order=desc)
  splunk: |-
    `comment("Splunk SPL for Check Washing — Altered Check Mobile Deposit")`
    `comment("Detects duplicate check deposits or MICR line inconsistencies on mobile deposits to new accounts")`
    index=flame_banking sourcetype=flame:check_processing
      (deposit_channel="mobile" OR deposit_channel="remote_deposit_capture")
    | eval account_age_days = round((now() - strptime(account_open_date, "%Y-%m-%d")) / 86400)
    | where account_age_days < 30
    | stats count AS deposit_count dc(depositing_institution_id) AS institution_count
        values(check_amount) AS amounts values(depositing_institution_id) AS institutions
        values(device_fingerprint) AS devices
        BY check_number
    | eval amount_micr_delta = check_amount - micr_encoded_amount
    | eval risk_score = case(
        institution_count > 1 AND abs(amount_micr_delta) > 0, "critical",
        institution_count > 1, "high",
        abs(amount_micr_delta) > 500, "high",
        1=1, "medium")
    | where deposit_count > 1 OR abs(amount_micr_delta) > 0
    | table check_number, deposit_count, institution_count, amounts,
            institutions, devices, amount_micr_delta, risk_score
    | sort - risk_score
  sql: |-
    -- SQL for Check Washing — Altered Check Mobile Deposit
    -- Detects duplicate deposits across institutions or MICR amount mismatches
    WITH deposit_analysis AS (
      SELECT
        d.check_number,
        d.account_id,
        d.check_amount,
        d.micr_encoded_amount,
        ABS(d.check_amount - d.micr_encoded_amount) AS amount_micr_delta,
        d.deposit_date,
        d.device_fingerprint,
        d.depositing_institution_id,
        a.account_open_date,
        DATEDIFF(DAY, a.account_open_date, d.deposit_date) AS account_age_days,
        COUNT(*) OVER (PARTITION BY d.check_number) AS check_deposit_count,
        COUNT(DISTINCT d.depositing_institution_id) OVER (PARTITION BY d.check_number) AS institution_count
      FROM mobile_deposits d
      JOIN accounts a ON d.account_id = a.account_id
      WHERE d.deposit_channel IN ('mobile', 'remote_deposit_capture')
        AND d.deposit_date >= DATEADD(DAY, -7, CURRENT_DATE)
    )
    SELECT *
    FROM deposit_analysis
    WHERE account_age_days < 30
      AND (check_deposit_count > 1 OR amount_micr_delta > 0)
    ORDER BY check_deposit_count DESC, amount_micr_delta DESC
falsepositives:
  - Legitimate re-deposit of returned checks (e.g., NSF item re-presented by payee)
  - Minor MICR encoding errors from check printing vendors on legitimate checks
  - Business customers with high-volume remote deposit capture processing
level: high
tags:
  - attack.t1657
  - cfpf.phase4.execution
  - flame.check-fraud
  - flame.duplicate-deposit
  - flame.check-washing
