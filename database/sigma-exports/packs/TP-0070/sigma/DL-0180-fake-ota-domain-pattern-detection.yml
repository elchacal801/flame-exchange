title: Fake OTA Domain Pattern Detection — Domains Mimicking Booking.com/Expedia/Airbnb Registered < 30 Days
id: efe5474d-d15f-4485-a014-ad0357484e80
status: experimental
description: >
  Detects web traffic to recently registered domains (< 30 days old) that mimic
  major Online Travel Agency brands (Booking.com, Expedia, Airbnb) using typosquatting,
  homoglyph substitution, or brand-adjacent naming patterns. These fake OTA domains
  are the primary infrastructure for travel booking fraud credential harvesting operations.
  NordVPN/Saily identified 4,344 active fake travel domains in 2026. Average domain
  lifespan is 18 days before takedown, making registration age the highest-signal
  detection feature. Domains serving payment form pages are critical-severity indicators.
sigma_compatible: true
native_query_required: false
references:
  - "NordVPN/Saily, Travel Scam Intelligence Report (2026)"
  - "Sumsub, Travel Fraud: The Hidden Epidemic (2026)"
  - "Riskified, OTA Fraud Patterns and Detection Strategies"
threat_paths:
  - TP-0070
cfpf_phase: P1
fraud_types:
  - travel-booking-fraud
  - fake-ota
  - credential-harvesting
logsource:
  product: proxy
  service: web_traffic
detection:
  selection_domain_patterns:
    request_domain|re:
      - '(?i)(book[1i!l]ng|b00king|booking-?\w+)\.(com|net|org|info|travel|xyz|top)'
      - '(?i)(exped[1i!l]a|exp3dia|expedia-?\w+)\.(com|net|org|info|travel|xyz|top)'
      - '(?i)(a[1i!l]rbnb|airbnb-?\w+|a1rbnb)\.(com|net|org|info|travel|xyz|top)'
      - '(?i)(hotels?-?\w*book|book-?\w*travel|cheap-?\w*flight)\.(com|net|org|info|travel)'
  filter_legitimate:
    request_domain:
      - 'booking.com'
      - '*.booking.com'
      - 'expedia.com'
      - '*.expedia.com'
      - 'airbnb.com'
      - '*.airbnb.com'
      - 'hotels.com'
      - '*.hotels.com'
  filter_domain_age:
    domain_registration_age_days|lt: 30
  condition: selection_domain_patterns and not filter_legitimate and filter_domain_age
data_sources:
  native_fields:
    - request_domain
    - source_ip
    - user_agent
    - request_url
    - http_method
    - response_code
  enrichment_required:
    - field: domain_registration_age_days
      source: Domain WHOIS or passive DNS enrichment providing domain registration date
    - field: domain_registration_date
      source: WHOIS registration date lookup
    - field: ssl_certificate_age_days
      source: Certificate Transparency log enrichment
  derived_fields:
    - is_payment_page
    - brand_similarity_score
queries:
  splunk: |-
    `comment("Splunk SPL for Fake OTA Domain Pattern Detection — DL-0180")`
    `comment("Detects access to recently registered domains mimicking major OTA brands")`
    index=flame_proxy sourcetype=flame:web_traffic
    | rex field=request_domain "(?i)(?<brand_match>book[1i!l]ng|b00king|exped[1i!l]a|exp3dia|a[1i!l]rbnb|airbnb)"
    | where isnotnull(brand_match)
    | lookup domain_whois_enrichment request_domain OUTPUT domain_registration_date, domain_age_days
    | where domain_age_days < 30
    | eval is_payment_page = if(match(request_url, "(?i)(payment|checkout|pay|billing|card|credit)"), 1, 0)
    | eval risk_score = case(
        is_payment_page=1 AND domain_age_days < 7, "critical",
        is_payment_page=1, "high",
        domain_age_days < 7, "high",
        1=1, "medium")
    | stats count as request_count,
            dc(source_ip) as unique_visitors,
            values(request_url) as urls,
            max(is_payment_page) as has_payment_page
      by request_domain, domain_registration_date, domain_age_days, risk_score
    | sort - request_count
  sql: |-
    -- SQL for Fake OTA Domain Pattern Detection
    SELECT
      w.request_domain,
      d.domain_registration_date,
      DATEDIFF(DAY, d.domain_registration_date, CURRENT_DATE) AS domain_age_days,
      COUNT(*) AS request_count,
      COUNT(DISTINCT w.source_ip) AS unique_visitors,
      MAX(CASE WHEN w.request_url LIKE '%payment%' OR w.request_url LIKE '%checkout%'
               OR w.request_url LIKE '%billing%' THEN 1 ELSE 0 END) AS has_payment_page
    FROM web_traffic_logs w
    JOIN domain_whois d ON w.request_domain = d.domain_name
    WHERE (w.request_domain LIKE '%book_ng%' OR w.request_domain LIKE '%b00king%'
           OR w.request_domain LIKE '%exped_a%' OR w.request_domain LIKE '%airbnb%'
           OR w.request_domain LIKE '%a_rbnb%')
      AND w.request_domain NOT IN ('booking.com', 'expedia.com', 'airbnb.com',
                                    'hotels.com')
      AND w.request_domain NOT LIKE '%.booking.com'
      AND w.request_domain NOT LIKE '%.expedia.com'
      AND w.request_domain NOT LIKE '%.airbnb.com'
      AND DATEDIFF(DAY, d.domain_registration_date, CURRENT_DATE) < 30
    GROUP BY w.request_domain, d.domain_registration_date
    ORDER BY request_count DESC
falsepositives:
  - Legitimate new travel startups with names similar to established OTA brands
  - Regional OTA affiliates or partner sites with brand-adjacent domains
  - Travel deal aggregator sites with recently registered domains
  - Marketing campaign microsites operated by legitimate OTA brands
level: high
tags:
  - attack.t1583.001
  - cfpf.phase1.recon
  - flame.travel-booking-fraud
  - flame.fake-ota
