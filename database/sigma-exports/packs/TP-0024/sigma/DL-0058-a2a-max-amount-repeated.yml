title: Repeated A2A Payments at Maximum Per-Transaction Limit
id: 970e0f28-9acc-43a6-802f-b05e27b38dc0
status: experimental
description: >
  Detects multiple account-to-account payments where each transaction is at or near
  the maximum per-transaction limit (e.g., $2,500 for Zelle, $500,000 for FedNow).
  Fraudsters often structure payments at the exact limit to maximize extraction speed
  while avoiding aggregate-amount alerts, a behavior rarely seen in legitimate
  consumer transactions.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.zellepay.com/faq/how-much-money-can-i-send
threat_paths:
  - TP-0024
  - TP-0012
cfpf_phase: P4
fraud_types:
  - authorized-push-payment
  - wire-fraud
logsource:
  product: banking
  service: a2a_processing
detection:
  selection:
    event_type: 'a2a_payment_initiated'
    payment_rail|contains:
      - 'ZELLE'
      - 'FEDNOW'
      - 'RTP'
      - 'ACH_SAMEDAY'
  filter_at_limit:
    amount_pct_of_rail_limit|gte: 95
  condition: selection and filter_at_limit | count() by account_id > 3
  timeframe: 24h
falsepositives:
  - Customer making a large one-time purchase split across multiple payments at platform limits
  - Business account regularly transacting at high values for legitimate operations
level: high
tags:
  - cfpf.phase4.execution
  - attack.t1565
  - flame.a2a
