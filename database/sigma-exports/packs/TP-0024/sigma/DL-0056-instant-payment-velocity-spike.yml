title: Instant Payment Velocity Spike Above 30-Day Baseline
id: a6b63f49-b57c-44a8-8584-59cacee0ff2c
status: experimental
description: >
  Detects a sudden spike in instant payment frequency that significantly exceeds the
  account's established 30-day baseline. A spike is defined as the current day's
  instant payment count exceeding 3 standard deviations above the rolling 30-day
  mean, indicating potential account compromise or mule activity where the account
  is being drained rapidly.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.fincen.gov/sites/default/files/advisory/2019-10-11/FinCEN%20Advisory%20Convertible%20Virtual%20Currency%20FINAL%20508.pdf
threat_paths:
  - TP-0024
  - TP-0012
cfpf_phase: P4
fraud_types:
  - authorized-push-payment
  - wire-fraud
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection:
    event_type: 'instant_payment_initiated'
    payment_rail|contains:
      - 'ZELLE'
      - 'FEDNOW'
      - 'RTP'
      - 'ACH_SAMEDAY'
  condition: selection | count() by account_id | compare(op=gt, period=30d, stdev=3)
  timeframe: 1d
falsepositives:
  - Small business owner processing seasonal surge in vendor payments
  - Customer making multiple legitimate payments on a move-in day (deposits, utilities, services)
level: high
tags:
  - cfpf.phase4.execution
  - attack.t1565
  - flame.a2a
