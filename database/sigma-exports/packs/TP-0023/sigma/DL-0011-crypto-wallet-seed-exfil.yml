title: Crypto Wallet Seed Phrase Exfiltration
id: 52bf262a-15e1-40a4-934e-9c8b461aef21
status: experimental
description: >
  Detects wallet seed phrase and private key extraction attempts targeting cryptocurrency wallets.
  Infostealers such as RedLine, Vidar, and StealC include dedicated modules that search for
  wallet.dat files, seed phrase backups, and keystore directories for MetaMask, Exodus, Electrum,
  and other popular wallets to enable cryptocurrency theft.
references:
  - https://attack.mitre.org/techniques/T1005/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0023
  - TP-0008
cfpf_phase: P2
fraud_types:
  - data-theft
  - malware
logsource:
  product: crypto
  service: endpoint_detection
detection:
  selection_wallet_files:
    file_path|contains:
      - '\Ethereum\keystore'
      - '\Exodus\exodus.wallet'
      - '\Electrum\wallets'
      - '\Bitcoin\wallet.dat'
      - '\Atomic\Local Storage'
      - '\Coinomi\wallets'
    file_access_type: 'read'
  selection_metamask:
    file_path|contains:
      - '\nkbihfbeogaeaoehlefnkodbefgpgknn'
      - '\ejbalbakoplchlghecdalmeeeajnimhm'
    file_access_type: 'read'
  selection_seed_files:
    file_name|contains:
      - 'seed'
      - 'mnemonic'
      - 'recovery'
      - 'backup'
    file_extension|contains:
      - '.txt'
      - '.json'
      - '.dat'
  filter_wallet_apps:
    process_name|contains:
      - 'Exodus'
      - 'Electrum'
      - 'Atomic'
      - 'Coinomi'
      - 'MetaMask'
  condition: (selection_wallet_files or selection_metamask or selection_seed_files) and not filter_wallet_apps
falsepositives:
  - Legitimate wallet backup procedures initiated by the user
  - Crypto portfolio management tools that aggregate across multiple wallets
level: critical
tags:
  - cfpf.phase2.initial_access
  - attack.t1005
  - attack.t1555
