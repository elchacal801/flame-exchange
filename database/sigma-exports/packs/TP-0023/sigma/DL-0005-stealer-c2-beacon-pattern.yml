title: Stealer C2 Beacon Pattern
id: 5d0a68f0-fbab-4bcb-86da-cebf51c0e6d9
status: experimental
description: >
  Detects command-and-control callback patterns typical of Malware-as-a-Service (MaaS) stealers.
  RedLine, Lumma, and StealC use distinctive C2 communication patterns including HTTP POST
  requests with base64-encoded payloads to newly registered domains, often on non-standard ports
  or with characteristic URI patterns.
references:
  - https://attack.mitre.org/techniques/T1071/001/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0023
  - TP-0001
cfpf_phase: P2
fraud_types:
  - malware
  - data-theft
logsource:
  product: banking
  service: web_proxy
detection:
  selection_method:
    http_method: 'POST'
  selection_uri_pattern:
    url_path|contains:
      - '/gate.php'
      - '/index.php?id='
      - '/panel/gate'
      - '/api/check'
      - '/loader/'
  selection_payload:
    request_body_length|gte: 5000
    content_type|contains: 'application/x-www-form-urlencoded'
  selection_domain_age:
    domain_age_days|lte: 30
  condition: selection_method and (selection_uri_pattern or (selection_payload and selection_domain_age))
falsepositives:
  - Legitimate PHP-based applications using similar URI naming conventions
  - New SaaS platforms with recently registered domains
level: high
tags:
  - cfpf.phase2.initial_access
  - attack.t1071.001
  - attack.t1041
