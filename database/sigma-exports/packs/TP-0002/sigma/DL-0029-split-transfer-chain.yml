title: Split Transfer Chain Detection
id: f74ea92f-6a23-4c07-9bdb-c1c5a5cc393c
status: experimental
description: >
  Detects when a large inbound amount is split into multiple smaller outbound transfers
  to different beneficiaries in sequence. This layering technique is used to obscure
  the origin and destination of fraudulently obtained funds.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.fatf-gafi.org/en/publications/Methodsandtrends/Money-laundering-terrorist-financing-trends.html
threat_paths:
  - TP-0002
  - TP-0006
  - TP-0020
cfpf_phase: P4
fraud_types:
  - wire-fraud
  - payment-diversion
  - money-mule
logsource:
  product: banking
  service: wire_system
detection:
  selection_large_inbound:
    event_type:
      - 'WIRE_CREDIT'
      - 'ACH_CREDIT'
    transaction_amount|gte: 25000
  selection_multiple_outbound:
    event_type:
      - 'WIRE_INITIATION'
      - 'ACH_DEBIT'
      - 'INTERNAL_TRANSFER'
    transaction_amount|lt: 10000
  timeframe: 48h
  condition: selection_large_inbound | near selection_multiple_outbound by account_id | count(distinct beneficiary_id) by account_id > 2
falsepositives:
  - Businesses receiving large payments and distributing to multiple sub-contractors
  - Investment accounts rebalancing across multiple fund positions
level: high
tags:
  - cfpf.phase4.execution
  - attack.t1657
  - flame.wire_ach
