title: Credential Testing After Dump
id: f9dda8eb-82b7-4ada-a9c9-058569025928
status: experimental
description: >
  Detects rapid credential validation attempts occurring shortly after a credential dump event.
  After infostealers exfiltrate harvested credentials, threat actors typically run automated
  validation to identify which stolen credentials are still active, producing a burst of
  login attempts across multiple banking portals from the attacker's infrastructure.
references:
  - https://attack.mitre.org/techniques/T1110/004/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0001
  - TP-0008
cfpf_phase: P2
fraud_types:
  - credential-stuffing
  - account-takeover
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type: 'login_attempt'
    auth_result|contains:
      - 'failure'
      - 'success'
  timeframe: 15m
  condition: selection | count(distinct user_id) by source_ip > 10
falsepositives:
  - Corporate SSO gateways performing health checks against multiple accounts
  - Automated monitoring systems testing service account connectivity
level: high
tags:
  - cfpf.phase2.initial_access
  - attack.t1110.004
  - attack.t1078
