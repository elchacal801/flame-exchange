title: ACH Return Rate Anomaly
id: 48a0f270-8aff-4f84-a211-b622b5898c9d
status: experimental
description: 'Detects ACH originators with an elevated return or reversal rate exceeding normal thresholds. High ACH return
  rates (especially R10 unauthorized, R29 corporate not authorized) may indicate the account is being used to initiate unauthorized
  debits against victim accounts.

  '
sigma_compatible: false
native_query_required: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://www.nacha.org/system/files/2024-06/2024-ACH-Rules-Book.pdf
threat_paths:
- TP-0002
- TP-0001
cfpf_phase: P5
fraud_types:
- ACH-fraud
- payment-diversion
logsource:
  product: banking
  service: ach_processing
detection:
  selection_returns:
    event_type: ACH_RETURN
    return_code:
    - R10
    - R29
    - R07
    - R08
  timeframe: 30d
  condition: selection_returns
data_sources:
  native_fields:
  - event_type
  - return_code
queries:
  cql: |-
    // CrowdStrike CQL for ACH Return Rate Anomaly
    // Repository: flame-banking-ach-processing
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: selection_returns | count() by originator_id > 5
    event_type="ACH_RETURN"
    (return_code="R10" OR return_code="R29" OR return_code="R07" OR return_code="R08")
    | groupBy(originator_id, function=[count(as=event_count)])
    | event_count > 5
  splunk: |-
    `comment("Splunk SPL for ACH Return Rate Anomaly")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection_returns | count() by originator_id > 5")`
    index=flame_banking sourcetype=flame:ach_processing event_type="ACH_RETURN" (return_code="R10" OR return_code="R29" OR return_code="R07" OR return_code="R08")
    | stats count as event_count by originator_id
    | where event_count > 5
falsepositives:
- Legitimate businesses with high dispute rates due to subscription billing models
- Payroll processors during seasonal employment transitions
level: high
tags:
- cfpf.phase5.monetization
- attack.t1657
- flame.wire_ach
