title: MFA Push Bombing
id: 90bc08ab-511f-42d5-9fe1-21af23617d9f
status: experimental
description: >
  Detects rapid repeated MFA push notifications sent to the same user, a technique known as
  MFA fatigue or push bombing. Attackers who have obtained valid credentials bombard the victim
  with push authentication requests, hoping the user will approve one out of frustration or
  confusion, thereby granting the attacker access.
references:
  - https://attack.mitre.org/techniques/T1621/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0008
  - TP-0001
cfpf_phase: P2
fraud_types:
  - account-takeover
logsource:
  product: banking
  service: mfa_logs
detection:
  selection:
    event_type: 'mfa_push_sent'
    mfa_method: 'push'
  selection_denied:
    mfa_result|contains:
      - 'denied'
      - 'timeout'
      - 'ignored'
  timeframe: 10m
  condition: >
    selection
    | count() by user_id > 5
    and count(selection_denied) by user_id > 3

  # Pattern: 5+ push requests to same user in 10 minutes with 3+ denied/timed-out
  # followed by an eventual approval indicates push fatigue attack
falsepositives:
  - Connectivity issues causing MFA push retries from legitimate authentication flows
  - Users who accidentally trigger multiple login attempts from different app instances
level: high
tags:
  - cfpf.phase2.initial_access
  - attack.t1621
  - attack.t1078
