title: UCP Cart Mandate Gift Card Injection via Indirect Prompt Injection
id: f1a2b3c4-d5e6-4f7a-8b9c-0d1e2f3a4b5c
status: experimental
description: 'Detects unauthorized gift card line items appended to UCP Cart Mandate payloads by AI shopping
  agents whose context has been compromised via indirect prompt injection. Threat actors create deals aggregator
  or coupon sites containing hidden payloads that reprogram the agent''s memory during browsing. The agent then
  appends a hidden digital gift card line item to the Cart Mandate JSON-RPC payload with the recipient email
  set to an attacker-controlled address and display_status set to hidden. The additional cost may be disguised
  as Tax/Fees in the user''s UI. This rule targets Phase 3-4 (Positioning/Execution) of the attack, detecting
  the presence of gift card items with suspicious recipient addresses or hidden display status in checkout payloads.

  '
references:
- https://unit42.paloaltonetworks.com/retail-fraud-agentic-ai/
date: 2026/03/21
sigma_compatible: true
threat_paths:
- TP-0039
cfpf_phase: P3
fraud_types:
- autonomous-ai-fraud
- gift-card-fraud
- unauthorized-transaction
logsource:
  product: ecommerce
  service: ucp_checkout
detection:
  selection:
    event_type: "cart_mandate_submission"
    initiated_by: ai_agent
  condition_hidden_gift_card:
    line_item_type|contains:
    - "gift_card"
    - "e_gift_card"
    - "digital_gift_card"
    display_status: "hidden"
  condition_external_recipient:
    line_item_type|contains:
    - "gift_card"
    - "e_gift_card"
    - "digital_gift_card"
    recipient_email_matches_user: false
  condition_agent_added:
    line_item_type|contains:
    - "gift_card"
    - "e_gift_card"
    - "digital_gift_card"
    line_item_added_by: "agent_auto"
    user_intent_contains_gift_card: false
  condition: selection and (1 of condition_*)
data_sources:
  native_fields:
  - event_type
  - initiated_by
  - line_item_type
  - display_status
  - recipient_email_matches_user
  - line_item_added_by
  - user_intent_contains_gift_card
  enrichment_required:
  - field: recipient_email_matches_user
    source: User profile enrichment (compare gift card recipient email against user's known email addresses)
  - field: user_intent_contains_gift_card
    source: Intent analysis enrichment (parse user's original shopping intent for gift card purchase requests)
falsepositives:
- User explicitly requesting gift card purchases for others via agent
- Corporate bulk gift card purchasing through automated procurement agents
- Legitimate promotional gift card bundles included by merchants
level: critical
tags:
- cfpf.phase3.positioning
- cfpf.phase4.execution
- attack.t1059
- attack.t1657
- flame.ecommerce
- flame.agentic_commerce
- flame.prompt_injection
- flame.ucp
- flame.gift_card_fraud
