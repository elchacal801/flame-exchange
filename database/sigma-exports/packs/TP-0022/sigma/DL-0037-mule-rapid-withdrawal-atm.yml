title: Mule Rapid ATM Withdrawal After Inbound Transfer
id: b0175f36-f97b-4e8f-9111-1a3e7d8dfa40
status: experimental
description: 'Detects cash withdrawals at ATMs occurring shortly after an inbound wire or ACH transfer. Money mules frequently
  convert electronically received fraud proceeds to cash as quickly as possible to prevent recovery, often hitting daily ATM
  limits across multiple machines.

  '
sigma_compatible: false
native_query_required: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://www.fincen.gov/sites/default/files/shared/FIN-2016-A003.pdf
threat_paths:
- TP-0011
- TP-0022
- TP-0001
cfpf_phase: P5
fraud_types:
- money-mule
- wire-fraud
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection_inbound:
    event_type:
    - WIRE_CREDIT
    - ACH_CREDIT
    transaction_amount|gte: 2000
  selection_atm_withdrawal:
    event_type: ATM_WITHDRAWAL
    transaction_amount|gte: 500
  timeframe: 4h
  condition: selection_inbound and selection_atm_withdrawal
data_sources:
  native_fields:
  - event_type
  - transaction_amount
queries:
  cql: |-
    // CrowdStrike CQL for Mule Rapid ATM Withdrawal After Inbound Transfer
    // Repository: flame-banking-transaction-monitoring
    // Correlates inbound wire/ACH with rapid ATM cash-out within 4h
    ((event_type="WIRE_CREDIT" OR event_type="ACH_CREDIT") AND transaction_amount>=2000)
    OR (event_type="ATM_WITHDRAWAL" AND transaction_amount>=500)
    | selfJoinFilter(account_id, where=[
        {event_type="WIRE_CREDIT" OR event_type="ACH_CREDIT"}
        {event_type="ATM_WITHDRAWAL"}
      ])
    | groupBy(account_id, function=[
        count(as=event_count),
        collect([event_type, transaction_amount, @timestamp])
      ], span=4h)
    | event_count >= 2
  splunk: |-
    `comment("Splunk SPL for Mule Rapid ATM Withdrawal After Inbound Transfer")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection_inbound | near selection_atm_withdrawal by account_id")`
    index=flame_banking sourcetype=flame:transaction_monitoring
    (event_type="WIRE_CREDIT" OR event_type="ACH_CREDIT")
    transaction_amount>=2000
    event_type="ATM_WITHDRAWAL"
    transaction_amount>=500
    | transaction account_id maxspan=4h
    | where eventcount >= 2
falsepositives:
- Small business owners depositing and immediately withdrawing cash for operational expenses
- Individuals receiving legitimate payroll via direct deposit and withdrawing cash
level: high
tags:
- cfpf.phase5.monetization
- attack.t1583
- flame.mule_indicator
