title: Never-Pay Pattern — Immediate Max Utilization with Zero Payments
id: b66aa9c6-3803-4edb-8c8b-3c139fa2ff0a
status: experimental
description: >
  Detects new credit accounts with immediate high utilization and zero payment activity
  after 60 days — classic "never-pay" first-party fraud where the consumer opens an
  account with no intent to pay. Unlike bust-out schemes that involve a credit nurturing
  phase, never-pay actors maximize utilization immediately after account opening and make
  no payments whatsoever. This pattern is distinguishable from legitimate new account
  activity because at least one billing cycle has passed with zero payment response.
  The never-pay variant accounts for a significant share of first-party fraud losses,
  particularly in unsecured credit products.
sigma_compatible: false
native_query_required: true
references:
  - "LexisNexis Risk Solutions, Global State of Fraud and Identity Report (2026)"
  - "Aite-Novarica Group, First-Party Fraud: The Growing Challenge (2023)"
  - "OCC, Comptroller's Handbook: Credit Card Lending — Early-Stage Delinquency Indicators"
threat_paths:
  - TP-0016
cfpf_phase: P4
fraud_types:
  - first-party-fraud
  - bust-out
  - credit-card-fraud
logsource:
  product: banking
  service: credit_monitoring
detection:
  selection:
    account_type:
      - consumer_credit
      - credit_card
  filter_new_account:
    account_age_days|lte: 90
  filter_high_utilization:
    current_utilization_pct|gte: 75
  filter_zero_payments:
    total_payments_made: 0
  filter_billing_cycle:
    billing_cycles_elapsed|gte: 1
  condition: >
    selection AND filter_new_account AND filter_high_utilization
    AND filter_zero_payments AND filter_billing_cycle
data_sources:
  native_fields:
    - account_id
    - account_type
    - credit_limit
    - current_balance
    - current_utilization_pct
    - account_open_date
    - account_age_days
    - total_payments_made
  enrichment_required:
    - field: account_age_days
      source: Days since account opening (derived from account_open_date)
    - field: billing_cycles_elapsed
      source: Count of completed billing cycles since account opening
    - field: total_payments_made
      source: Sum of all payment transactions on the account
  derived_fields:
    - days_to_max_utilization
    - spend_velocity_per_day
queries:
  cql: |-
    // CrowdStrike CQL for Never-Pay Pattern
    // Detects new accounts with immediate high utilization and zero payments
    (account_type="consumer_credit" OR account_type="credit_card")
    account_age_days<=90
    current_utilization_pct>=75
    total_payments_made=0
    billing_cycles_elapsed>=1
    | days_to_max_utilization := account_age_days
    | spend_velocity_per_day := current_balance / account_age_days
    | groupBy(account_id, function=[
        collect([credit_limit, current_balance, current_utilization_pct,
                 account_age_days, billing_cycles_elapsed,
                 spend_velocity_per_day, account_open_date])
      ])
    | sort(current_utilization_pct, order=desc)
  splunk: |-
    `comment("Splunk SPL for Never-Pay Pattern")`
    `comment("Detects new accounts with immediate high utilization and zero payments")`
    index=flame_banking sourcetype=flame:credit_monitoring
      (account_type="consumer_credit" OR account_type="credit_card")
      account_age_days<=90
      current_utilization_pct>=75
      total_payments_made=0
      billing_cycles_elapsed>=1
    | eval spend_velocity = round(current_balance / account_age_days, 2)
    | eval risk_score = case(
        current_utilization_pct >= 95 AND billing_cycles_elapsed >= 2, "critical",
        current_utilization_pct >= 85, "high",
        1=1, "medium")
    | table account_id, account_type, credit_limit, current_balance,
            current_utilization_pct, account_age_days, billing_cycles_elapsed,
            spend_velocity, account_open_date, risk_score
    | sort - current_utilization_pct
  sql: |-
    -- SQL for Never-Pay Pattern
    -- Detects new accounts with immediate high utilization and zero payments
    SELECT
      a.account_id,
      a.account_type,
      a.credit_limit,
      a.current_balance,
      a.current_utilization_pct,
      DATEDIFF(DAY, a.account_open_date, CURRENT_DATE) AS account_age_days,
      b.billing_cycles_elapsed,
      ROUND(a.current_balance / NULLIF(DATEDIFF(DAY, a.account_open_date, CURRENT_DATE), 0), 2) AS spend_velocity_per_day,
      a.account_open_date
    FROM credit_accounts a
    JOIN billing_cycle_summary b ON a.account_id = b.account_id
    LEFT JOIN payments p ON a.account_id = p.account_id
    WHERE a.account_type IN ('consumer_credit', 'credit_card')
      AND DATEDIFF(DAY, a.account_open_date, CURRENT_DATE) <= 90
      AND a.current_utilization_pct >= 75
      AND p.account_id IS NULL
      AND b.billing_cycles_elapsed >= 1
    ORDER BY a.current_utilization_pct DESC
falsepositives:
  - Newly opened accounts used for a single large planned purchase with payment pending
  - Accounts opened near billing cycle boundary where payment is not yet due
  - Corporate cards issued to employees with centralized payment processing
level: high
tags:
  - cfpf.phase4.execution
  - flame.first-party-fraud
  - flame.never-pay
