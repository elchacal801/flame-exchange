title: Fraudulent Deed Transfer Anomaly — Deed Recording With Document Metadata Anomalies (AI Generation Indicators) on Properties With No Prior Activity
id: abb558a9-94f0-4b94-8945-053d12e379ed
status: experimental
description: >
  Detects deed recordings that exhibit document metadata anomalies indicative of AI-
  generated or forged documents, particularly on properties with no recent prior recording
  activity. The detection combines document forensic signals (AI tool signatures in PDF
  metadata, rapid creation timestamps, font inconsistencies) with property-level risk
  factors (no prior recordings in 5 years, vacant status, unencumbered, non-resident
  owner). Entrust reports a 40% YoY increase in deepfake-related fraud attempts (2026),
  with AI-forged deeds, government IDs, and notary stamps as primary vectors in real
  estate title fraud. Notary commission validation is a critical check -- invalid or
  expired notary credentials are a high-confidence fraud indicator.
sigma_compatible: false
native_query_required: true
references:
  - "Entrust, Identity Fraud Report (2026)"
  - "HousingWire, Deed Fraud on the Rise: AI-Powered Property Theft (2025)"
  - "First American, Title Fraud: Emerging Threats and Prevention Strategies"
  - "Virginia Deed Fraud Study (2025)"
threat_paths:
  - TP-0073
cfpf_phase: P4
fraud_types:
  - title-fraud
  - deed-theft
  - appraisal-fraud
logsource:
  product: real_estate
  service: deed_recordings
detection:
  selection:
    recording_type:
      - deed_transfer
      - quitclaim_deed
      - warranty_deed
      - grant_deed
  filter_document_anomaly:
    document_metadata_risk_score|gte: 40
  filter_no_prior_activity:
    prior_recordings_5yr|lte: 0
  condition: >
    selection AND (filter_document_anomaly OR filter_no_prior_activity)
data_sources:
  native_fields:
    - recording_id
    - property_id
    - property_address
    - recording_type
    - recording_date
    - grantor_name
    - grantee_name
    - notary_name
    - notary_commission_number
    - notary_state
    - document_page_count
  enrichment_required:
    - field: document_metadata_risk_score
      source: AI document forensics analysis of PDF metadata, font consistency, image artifacts, and creation timestamps
    - field: prior_recordings_5yr
      source: Count of recordings against the property in the prior 5 years from county recorder database
    - field: notary_commission_valid
      source: State notary commission database validation
    - field: property_occupancy_status
      source: Property data enrichment (county assessor, USPS vacancy data)
  derived_fields:
    - composite_risk_score
    - ai_generation_indicators
    - notary_validation_result
queries:
  cql: |-
    // CQL for Fraudulent Deed Transfer Anomaly — DL-0187
    // Detects deed recording with AI generation indicators on inactive properties
    DeedRecordings
    | recording_type = "deed_transfer" OR recording_type = "quitclaim_deed" OR recording_type = "warranty_deed" OR recording_type = "grant_deed"
    | notary_invalid := if(commission_status != "active" OR commission_expiry < now(), 1, 0)
    | no_prior_activity := if(prior_recordings_5yr <= 0, 1, 0)
    | vacant := if(property_occupancy_status = "vacant", 1, 0)
    | unencumbered := if(property_mortgage_balance <= 0 OR property_mortgage_balance = null, 1, 0)
    | ai_metadata_flag := if(document_metadata_risk_score >= 40, 1, 0)
    | rapid_creation := if(document_creation_to_modification_sec < 60, 1, 0)
    | composite_risk_score := (notary_invalid * 40) + (ai_metadata_flag * 30) + (no_prior_activity * 20) + (vacant * 15) + (unencumbered * 10) + (rapid_creation * 15)
    | composite_risk_score >= 40
    | risk_level := if(composite_risk_score >= 80, "critical", if(composite_risk_score >= 60, "high", "medium"))
    | recommendation := if(composite_risk_score >= 60, "HOLD_RECORDING", "MANUAL_REVIEW")
    | sort(composite_risk_score, order=desc)
  splunk: |-
    `comment("Splunk SPL for Fraudulent Deed Transfer Anomaly — DL-0187")`
    `comment("Detects deed recording with AI generation indicators on inactive properties")`
    index=flame_realestate sourcetype=flame:deed_recordings
      (recording_type="deed_transfer" OR recording_type="quitclaim_deed"
       OR recording_type="warranty_deed" OR recording_type="grant_deed")
    | lookup notary_commission_db notary_commission_number, notary_state
        OUTPUT commission_status, commission_expiry
    | eval notary_invalid = if(commission_status != "active"
        OR commission_expiry < now(), 1, 0)
    | eval no_prior_activity = if(prior_recordings_5yr <= 0, 1, 0)
    | eval vacant = if(property_occupancy_status="vacant", 1, 0)
    | eval unencumbered = if(property_mortgage_balance <= 0
        OR isnull(property_mortgage_balance), 1, 0)
    | eval ai_metadata_flag = if(document_metadata_risk_score >= 40, 1, 0)
    | eval rapid_creation = if(document_creation_to_modification_sec < 60, 1, 0)
    | eval composite_risk_score = (notary_invalid * 40)
        + (ai_metadata_flag * 30)
        + (no_prior_activity * 20)
        + (vacant * 15)
        + (unencumbered * 10)
        + (rapid_creation * 15)
    | where composite_risk_score >= 40
    | eval risk_level = case(
        composite_risk_score >= 80, "critical",
        composite_risk_score >= 60, "high",
        composite_risk_score >= 40, "medium")
    | eval recommendation = if(composite_risk_score >= 60, "HOLD_RECORDING", "MANUAL_REVIEW")
    | table recording_id, property_id, property_address, recording_type,
            recording_date, grantor_name, grantee_name, notary_name,
            notary_commission_number, commission_status, notary_invalid,
            document_metadata_risk_score, ai_metadata_flag, rapid_creation,
            prior_recordings_5yr, property_occupancy_status,
            composite_risk_score, risk_level, recommendation
    | sort - composite_risk_score
  sql: |-
    -- SQL for Fraudulent Deed Transfer Anomaly Detection
    -- Detects deed recording with AI generation indicators on properties with no prior activity
    SELECT
      r.recording_id,
      r.property_id,
      r.property_address,
      r.recording_type,
      r.recording_date,
      r.grantor_name,
      r.grantee_name,
      r.notary_name,
      r.notary_commission_number,
      n.commission_status,
      n.commission_expiry,
      r.document_metadata_risk_score,
      COALESCE(h.prior_recording_count, 0) AS prior_recordings_5yr,
      p.occupancy_status,
      p.mortgage_balance,
      (CASE WHEN n.commission_status != 'active' OR n.commission_expiry < CURRENT_DATE THEN 40 ELSE 0 END
       + CASE WHEN r.document_metadata_risk_score >= 40 THEN 30 ELSE 0 END
       + CASE WHEN COALESCE(h.prior_recording_count, 0) = 0 THEN 20 ELSE 0 END
       + CASE WHEN p.occupancy_status = 'vacant' THEN 15 ELSE 0 END
       + CASE WHEN p.mortgage_balance <= 0 OR p.mortgage_balance IS NULL THEN 10 ELSE 0 END
       + CASE WHEN r.document_creation_to_modification_sec < 60 THEN 15 ELSE 0 END
      ) AS composite_risk_score
    FROM deed_recordings r
    LEFT JOIN notary_commission_db n ON r.notary_commission_number = n.commission_number
                                     AND r.notary_state = n.state
    LEFT JOIN (
      SELECT property_id, COUNT(*) AS prior_recording_count
      FROM deed_recordings
      WHERE recording_date >= DATEADD(YEAR, -5, CURRENT_DATE)
      GROUP BY property_id
    ) h ON r.property_id = h.property_id
    LEFT JOIN properties p ON r.property_id = p.property_id
    WHERE r.recording_type IN ('deed_transfer', 'quitclaim_deed',
                                'warranty_deed', 'grant_deed')
      AND r.recording_date >= DATEADD(DAY, -7, CURRENT_DATE)
    HAVING composite_risk_score >= 40
    ORDER BY composite_risk_score DESC
falsepositives:
  - Legitimate property transfers on long-held family properties with no recent activity
  - Estate transfers after death of long-term owner
  - Quitclaim deeds between family members for estate planning
  - Properties in rural areas with infrequent recording activity
  - Documents scanned or digitized from paper originals (may trigger metadata anomalies)
level: high
tags:
  - cfpf.phase4.execution
  - flame.title-fraud
  - flame.deed-theft
  - flame.ai-forged-documents
