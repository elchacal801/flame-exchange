title: Rapid Contact Information Change
id: 5a835760-af28-492f-a741-a4478ecb238c
status: experimental
description: 'Detects when email, phone number, and mailing address are all changed on an account within a short window. A
  full contact information swap is a hallmark of account takeover where the attacker locks out the legitimate owner before
  executing fraud.

  '
sigma_compatible: false
native_query_required: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://www.fincen.gov/sites/default/files/shared/FIN-2016-A003.pdf
threat_paths:
- TP-0001
- TP-0005
cfpf_phase: P3
fraud_types:
- account-takeover
logsource:
  product: banking
  service: identity_management
detection:
  selection_email:
    event_type: CONTACT_CHANGE
    field_changed: email
  selection_phone:
    event_type: CONTACT_CHANGE
    field_changed: phone
  selection_address:
    event_type: CONTACT_CHANGE
    field_changed: mailing_address
  timeframe: 72h
  condition: selection_email and selection_phone and selection_address
data_sources:
  native_fields:
  - event_type
  - field_changed
queries:
  cql: |-
    // CrowdStrike CQL for Rapid Contact Information Change
    // Repository: flame-banking-identity-management
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: (selection_email and selection_phone and selection_address) | count() by account_id >= 3
    event_type="CONTACT_CHANGE"
    field_changed="email"
    event_type="CONTACT_CHANGE"
    field_changed="phone"
    event_type="CONTACT_CHANGE"
    field_changed="mailing_address"
    | groupBy(account_id, function=[count(as=event_count)])
    | event_count >= 3
  splunk: |-
    `comment("Splunk SPL for Rapid Contact Information Change")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: (selection_email and selection_phone and selection_address) | count() by account_id >= 3")`
    index=flame_banking sourcetype=flame:identity_management
    event_type="CONTACT_CHANGE"
    field_changed="email"
    event_type="CONTACT_CHANGE"
    field_changed="phone"
    event_type="CONTACT_CHANGE"
    field_changed="mailing_address"
    | stats count as event_count by account_id
    | where event_count >= 3
falsepositives:
- Customer relocating and updating all contact details with their bank simultaneously
- Account remediation after a legitimate customer service request
level: high
tags:
- cfpf.phase3.positioning
- attack.t1098
- flame.account_modification
