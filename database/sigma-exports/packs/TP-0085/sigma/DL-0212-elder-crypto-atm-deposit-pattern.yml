title: "Elder Account — Large Cash Withdrawal with Crypto ATM Deposit Indicators"
id: "d2f8a31c-7e4b-4c9a-b1d3-9f6e8a2c5d74"
status: experimental
description: >
  Detects the elder-targeted crypto ATM fraud pattern where victims aged 60+ make large
  cash withdrawals with no corresponding deposit or transfer activity within 48 hours —
  a strong indicator that funds were deposited at a crypto ATM/kiosk under the direction
  of a scammer. FBI IC3 2025 data shows 6,188 crypto ATM complaints and $257 million
  in losses from victims aged 60+ (66% of all crypto ATM fraud losses). The 48-hour gap
  between bank withdrawal and lack of corresponding activity represents the detection
  window before funds become irrecoverable on-chain. This rule targets the P4 execution
  phase where bank-side intervention can still prevent loss.
sigma_compatible: false
native_query_required: true
references:
  - "FBI IC3, 2025 Internet Crime Report — Crypto ATM/kiosk fraud: 13,460 complaints, $389M losses; 60+ victims: 6,188 complaints, $257M"
  - "FinCEN guidance on money services business obligations for crypto ATM operators"
  - "https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf"
threat_paths:
  - TP-0027
  - TP-0085
cfpf_phase: P4
fraud_types:
  - elder-exploitation
  - crypto-laundering
  - authorized-push-payment
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection:
    account_holder_age|gte: 60
    transaction_type: cash_withdrawal
    transaction_amount|gte: 5000
  filter_no_followup:
    followup_deposit_or_transfer_48h: false
  timeframe: 48h
  condition: selection AND filter_no_followup
data_sources:
  native_fields:
    - account_id
    - account_holder_age
    - transaction_type
    - transaction_amount
    - transaction_date
    - branch_id
  enrichment_required:
    - field: followup_deposit_or_transfer_48h
      source: Boolean — whether any deposit, transfer, or payment was made from the account within 48 hours of the cash withdrawal
  derived_fields:
    - withdrawal_frequency_30d
    - average_withdrawal_amount_12m
    - deviation_from_baseline
queries:
  cql: |-
    // CrowdStrike CQL for Elder Crypto ATM Deposit Pattern
    // Detects cash withdrawals by 60+ account holders with no follow-up activity
    account_holder_age>=60
    transaction_type="cash_withdrawal"
    transaction_amount>=5000
    followup_deposit_or_transfer_48h="false"
    | groupBy(account_id, function=[
        collect([account_holder_age, transaction_amount, transaction_date, branch_id]),
        count(transaction_id, as=withdrawal_count),
        sum(transaction_amount, as=total_withdrawn)
      ])
    | sort(total_withdrawn, order=desc)
  splunk: |-
    `comment("Splunk SPL for Elder Crypto ATM Deposit Pattern")`
    `comment("Detects cash withdrawals by 60+ account holders with no follow-up activity within 48h")`
    index=flame_banking sourcetype=flame:transaction_monitoring
      transaction_type="cash_withdrawal"
      account_holder_age>=60
      transaction_amount>=5000
    | eval withdrawal_time = _time
    | join type=left account_id
      [search index=flame_banking sourcetype=flame:transaction_monitoring
        (transaction_type="deposit" OR transaction_type="transfer" OR transaction_type="payment")
      | eval followup_time = _time
      | where followup_time > withdrawal_time AND followup_time < (withdrawal_time + 172800)
      | stats count AS followup_count by account_id]
    | where isnull(followup_count) OR followup_count=0
    | stats count AS withdrawal_count, sum(transaction_amount) AS total_withdrawn,
        values(branch_id) AS branches, latest(transaction_date) AS last_withdrawal
        by account_id, account_holder_age
    | sort - total_withdrawn
falsepositives:
  - Elderly customers making large cash withdrawals for legitimate purposes (home purchases, estate settlements)
  - Snowbird customers withdrawing cash before extended travel
  - Cash-preferred customers with established patterns of large withdrawals
  - Customers withdrawing funds to deposit at another institution
level: high
tags:
  - cfpf.phase4.execution
  - flame.elder-exploitation
  - flame.crypto-atm
  - flame.authorized-push-payment
