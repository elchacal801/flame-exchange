title: Abnormally High Refund Rate Per Customer Account
id: 2dc5fb46-78a2-416a-9516-db49e98a843a
status: experimental
description: >
  Detects customer accounts with an abnormally high refund-to-order ratio over a
  rolling window. Accounts exceeding a refund rate of 40% across 10 or more orders
  within 90 days are flagged as potential refund abusers or participants in
  refunding-as-a-service (RaaS) schemes, where professional refunders exploit
  return policies systematically.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://nrf.com/research/2023-retail-security-survey
threat_paths:
  - TP-0031
  - TP-0013
cfpf_phase: P5
fraud_types:
  - first-party-fraud
  - refunding-as-a-service
logsource:
  product: ecommerce
  service: order_management
detection:
  selection:
    event_type|contains:
      - 'order_completed'
      - 'refund_issued'
  aggregation:
    condition: |
      selection
      | groupby(customer_account_id)
      | where count(event_type='refund_issued') / count(event_type='order_completed') > 0.4
      | where count(event_type='order_completed') >= 10
  timeframe: 90d
  condition: aggregation
falsepositives:
  - Customers with legitimate sizing issues making frequent clothing returns
  - Product quality issues causing high return rates for specific SKUs across multiple customers
level: medium
tags:
  - cfpf.phase5.monetization
  - attack.t1565
  - flame.ecommerce
