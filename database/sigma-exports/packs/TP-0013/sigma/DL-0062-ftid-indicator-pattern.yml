title: Fake Tracking ID (FTID) Refund Fraud Indicators
id: dee21a57-2de4-4ca9-88e0-f10c5363b4df
status: experimental
description: 'Detects indicators of fake tracking ID (FTID) refund fraud, where a customer claims a package was not received
  or returned by providing a manipulated or fabricated tracking number. Indicators include tracking numbers that show delivery
  to the carrier facility but not to the customer address, tracking IDs associated with lightweight packages inconsistent
  with the order, or reuse of known FTID patterns across multiple refund claims.

  '
sigma_compatible: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://www.uspis.gov/news/scam-article/package-delivery-scams
threat_paths:
- TP-0031
- TP-0013
cfpf_phase: P4
fraud_types:
- first-party-fraud
- refunding-as-a-service
logsource:
  product: ecommerce
  service: returns_processing
detection:
  selection:
    event_type: refund_request
    refund_reason|contains:
    - item_not_received
    - return_in_transit
  filter_tracking_anomaly:
    tracking_delivery_address_match: false
  filter_weight:
    tracking_package_weight_oz|lt: 4
    order_expected_weight_oz|gt: 16
  filter_known_pattern:
    tracking_id_pattern_match: ftid_known_format
  condition: selection and (filter_tracking_anomaly or filter_weight or filter_known_pattern)
data_sources:
  native_fields:
  - event_type
  - order_expected_weight_oz
  - refund_reason
  - tracking_delivery_address_match
  - tracking_id_pattern_match
  - tracking_package_weight_oz
falsepositives:
- Carrier mis-scan delivering to wrong address requiring legitimate reshipment
- Lightweight promotional items or gift cards with valid low-weight tracking
level: high
tags:
- cfpf.phase4.execution
- attack.t1565
- flame.ecommerce
