title: Geographic Impossibility Login
id: ee20082a-9729-4d14-bd2e-642e837edafe
status: experimental
description: >
  Detects login attempts from geographically impossible locations within a short timeframe.
  When a user authenticates from one country and a second authentication occurs from a distant
  country within a window that makes physical travel impossible, it strongly indicates credential
  compromise and concurrent use by an attacker.
references:
  - https://attack.mitre.org/techniques/T1078/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0013
  - TP-0008
cfpf_phase: P2
fraud_types:
  - credential-stuffing
  - account-takeover
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type|contains:
      - 'login_success'
      - 'login_attempt'
  timeframe: 60m
  condition: >
    selection
    | near by user_id
    | where geo_distance(src.geo_lat, src.geo_lon, dst.geo_lat, dst.geo_lon) > 1000
    and time_diff < 60m

  # Correlation: two login events for same user_id where geodesic distance
  # between source IPs exceeds 1000 km within 60 minutes (impossible at ~900 km/h air travel)
falsepositives:
  - Users employing VPN services that change egress country between sessions
  - Corporate proxy chains routing through geographically distributed data centers
level: high
tags:
  - cfpf.phase2.initial_access
  - attack.t1078
  - attack.t1110.004
