title: Combo List Iteration Pattern
id: 735a9eb8-b6a9-409c-aeb2-766ceb8818f4
status: experimental
description: >
  Detects sequential username patterns typical of combo list iteration during credential stuffing
  attacks. Attackers feed sorted credential lists into stuffing tools, producing login attempts
  where usernames appear in alphabetical or near-alphabetical order with minimal timing
  variation between attempts, a pattern never seen in organic user behavior.
references:
  - https://attack.mitre.org/techniques/T1110/004/
  - https://owasp.org/www-community/attacks/Credential_stuffing
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0013
  - TP-0001
cfpf_phase: P2
fraud_types:
  - credential-stuffing
  - account-takeover
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type: 'login_attempt'
    auth_result: 'failure'
  timeframe: 10m
  condition: >
    selection
    | count(distinct username) by source_ip > 15
    and stddev(inter_event_time) by source_ip < 500ms

  # Pattern: high distinct username count with low timing variance indicates automated iteration
  # through a sorted credential list
falsepositives:
  - Automated batch user provisioning systems that test accounts sequentially
  - QA test suites running ordered account validation during deployments
level: high
tags:
  - cfpf.phase2.initial_access
  - attack.t1110.004
  - attack.t1078
