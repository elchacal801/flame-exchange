title: Credential Spray Single Password
id: be590f67-0d6b-4f3d-a796-9a013327aae7
status: experimental
description: 'Detects password spraying attacks where a single password (or small set of passwords) is tested across many
  accounts. Unlike traditional credential stuffing which uses unique username-password pairs, password spraying tries common
  or recently breached passwords against a large account population to avoid per-account lockout thresholds.

  '
sigma_compatible: false
native_query_required: true
references:
- https://attack.mitre.org/techniques/T1110/003/
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
- TP-0013
- TP-0001
cfpf_phase: P2
fraud_types:
- credential-stuffing
- account-takeover
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type: login_attempt
    auth_result: failure
  timeframe: 30m
  condition: selection
data_sources:
  native_fields:
  - auth_result
  - event_type
queries:
  cql: |-
    // CrowdStrike CQL for Credential Spray Single Password
    // Repository: flame-banking-auth-logs
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: selection | count(distinct username) by password_hash > 20 and count(distinct password_hash) by source_ip < 3
    event_type="login_attempt"
    auth_result="failure"
    | groupBy(password_hash, function=[count(as=event_count), collect(username)])
    | event_count > 20
    | groupBy(source_ip, function=[count(as=event_count), collect(password_hash)])
    | event_count < 3
  splunk: |-
    `comment("Splunk SPL for Credential Spray Single Password")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection | count(distinct username) by password_hash > 20 and count(distinct password_hash) by source_ip < 3")`
    index=flame_banking sourcetype=flame:auth_logs event_type="login_attempt" auth_result="failure"
    | stats dc(username) as unique_username by password_hash
    | where unique_username > 20
    | stats dc(password_hash) as unique_password_hash by source_ip
    | where unique_password_hash < 3
falsepositives:
- Batch account creation workflows where a default password is assigned to many accounts
- Automated test frameworks using a shared test password across test accounts
level: high
tags:
- cfpf.phase2.initial_access
- attack.t1110.003
- attack.t1078
