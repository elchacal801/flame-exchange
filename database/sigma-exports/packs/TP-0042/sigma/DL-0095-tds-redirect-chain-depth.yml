title: TDS Redirect Chain Depth Anomaly
id: a1c63e58-d9f4-4b27-8a35-7e2f0b94c6d9
status: experimental
description: 'Detects HTTP redirect chains (302, 301, or JavaScript-based redirects) exceeding a depth threshold where intermediate
  nodes are newly registered domains or have low reputation scores, indicating Traffic Distribution System (TDS) abuse. Legitimate
  web redirects rarely exceed 3 hops and typically traverse well-known CDN, analytics, or marketing infrastructure. TDS chains
  commonly use 4-7 or more hops through disposable intermediary domains to obfuscate the final destination, evade URL blocklists,
  and enable real-time traffic steering. Each hop in a TDS chain may perform user-agent filtering, geolocation checks, or
  bot detection before forwarding. This rule correlates redirect depth with domain age and reputation of intermediate nodes
  to distinguish malicious TDS chains from legitimate multi-hop redirects. Supports TP-0042 Phase 3 detection of TDS positioning
  and traffic funneling infrastructure.

  '
sigma_compatible: true
references:
- https://www.proofpoint.com/us/blog/threat-insight/traffic-distribution-systems
- https://blog.google/threat-analysis-group/tds-redirect-chains/
threat_paths:
- TP-0042
cfpf_phase: P3
fraud_types:
- tds-exploitation
logsource:
  product: dns_intelligence
  service: web_proxy
detection:
  selection:
    event_type: http_redirect_chain
    redirect_type|contains:
    - '301'
    - '302'
    - javascript_redirect
  chain_depth:
    redirect_hop_count|gte: 4
  intermediate_reputation:
    intermediate_domain_max_age_days|lte: 30
    intermediate_domain_min_reputation|lte: 20
  condition: selection and chain_depth and intermediate_reputation
data_sources:
  native_fields:
  - event_type
  - redirect_hop_count
  - redirect_type
  enrichment_required:
  - field: intermediate_domain_max_age_days
    source: WHOIS enrichment (max domain age in redirect chain)
  - field: intermediate_domain_min_reputation
    source: Reputation scoring enrichment (min reputation in redirect chain)
falsepositives:
- Advertising technology redirect chains through multiple ad exchanges
- Affiliate marketing link chains with multiple tracking intermediaries
- URL shortener services chained together by users
level: high
tags:
- cfpf.phase3.positioning
- attack.t1090.002
- flame.tds
- flame.redirect_chain
