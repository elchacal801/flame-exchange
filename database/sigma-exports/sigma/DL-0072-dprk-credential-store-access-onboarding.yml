title: Credential Store Access Anomaly During Onboarding
id: 046b411d-2570-54ed-a6e4-4860f17817f9
status: experimental
description: 'Detects new employees accessing browser credential stores, password managers, API key management systems, or
  SSO session token stores at rates significantly above peer baselines during the first 14 days of employment. DPRK IT workers
  harvest credentials, session cookies, and API keys early in their tenure for exfiltration to DPRK cyber units and as leverage
  for post-termination extortion.

  '
sigma_compatible: true
references:
- https://www.microsoft.com/en-us/security/blog/2025/06/30/jasper-sleet-north-korean-remote-it-workers-evolving-tactics-to-infiltrate-organizations/
- https://cloud.google.com/blog/topics/threat-intelligence/mitigating-dprk-it-worker-threat
threat_paths:
- TP-0034
cfpf_phase: P3
fraud_types:
- dprk-it-worker-fraud
- data-theft
logsource:
  product: endpoint
  service: edr
detection:
  selection:
    event_type|contains:
    - credential_store_access
    - password_manager_export
    - session_token_read
    - api_key_create
    user_tenure_days|lte: 14
  filter_volume:
    credential_access_count_24h|gte: 10
  condition: selection and filter_volume
data_sources:
  native_fields:
  - credential_access_count_24h
  - event_type
  enrichment_required:
  - field: user_tenure_days
    source: Account analytics enrichment (user tenure from onboarding date)
falsepositives:
- Developers configuring CI/CD pipelines that require multiple API keys during initial setup
- Security engineers performing credential audits as part of onboarding tasks
level: high
tags:
- cfpf.phase3.positioning
- attack.t1589.001
- flame.dprk
- flame.insider_threat
