title: Seller Impersonation Pattern — Property Sale Initiated by Non-Resident Owner of Vacant/Unencumbered Property With Recent Contact Info Changes
id: ddda9b5b-828d-4fd8-80d3-bd0db4aa3e8d
status: experimental
description: >
  Detects the characteristic seller impersonation pattern in real estate title fraud:
  a property sale or title transfer is initiated on a vacant, unencumbered property
  where the owner is non-resident (mailing address differs from property address) and
  the owner's contact information has been recently changed. FBI data shows $16.6B in
  total real estate fraud losses (2024), with seller impersonation of vacant property
  owners as the fastest-growing subcategory. Fraudsters target vacant, mortgage-free
  properties because there is no occupant to notice and no lender monitoring the title.
  A risk score is computed from multiple indicators: non-resident owner, vacant property,
  unencumbered, recent contact changes, and below-market listing price.
sigma_compatible: false
native_query_required: true
references:
  - "FBI IC3 Annual Report (2024)"
  - "First American, Title Fraud: Emerging Threats and Prevention Strategies"
  - "Virginia Deed Fraud Study (2025)"
  - "ALTA, Best Practices for Title Insurance and Settlement"
threat_paths:
  - TP-0073
  - TP-0006
cfpf_phase: P3
fraud_types:
  - title-fraud
  - deed-theft
  - seller-impersonation
logsource:
  product: real_estate
  service: property_transactions
detection:
  selection:
    transaction_type:
      - sale_listing
      - title_transfer
      - deed_recording
  filter_vacant_or_nonresident:
    occupancy_status: vacant
  filter_unencumbered:
    mortgage_balance|lte: 0
  filter_recent_contact_change:
    owner_contact_updated_days|lt: 90
  condition: >
    selection AND (filter_vacant_or_nonresident OR owner_address_mismatch)
    AND filter_unencumbered AND filter_recent_contact_change
data_sources:
  native_fields:
    - property_id
    - property_address
    - property_type
    - assessed_value
    - occupancy_status
    - mortgage_balance
    - owner_name
    - owner_mailing_address
    - transaction_type
    - listing_price
    - listing_date
    - seller_contact_email
    - seller_contact_phone
  enrichment_required:
    - field: owner_contact_updated_days
      source: Days since last contact information change in county records or title company CRM
    - field: owner_address_mismatch
      source: Boolean flag indicating owner mailing address differs from property address
    - field: market_value_estimate
      source: AVM (Automated Valuation Model) or recent comparable sales data
  derived_fields:
    - risk_score
    - listing_to_market_ratio
    - days_since_last_property_activity
queries:
  cql: |-
    // CQL for Seller Impersonation Pattern — DL-0186
    // Detects property sale by non-resident owner of vacant/unencumbered property
    PropertyTransactions
    | transaction_type = "sale_listing" OR transaction_type = "title_transfer" OR transaction_type = "deed_recording"
    | non_resident := if(property_address != owner_mailing_address, 1, 0)
    | unencumbered := if(mortgage_balance <= 0 OR mortgage_balance = null, 1, 0)
    | vacant := if(occupancy_status = "vacant", 1, 0)
    | recent_contact_change := if(owner_contact_updated_days < 90, 1, 0)
    | below_market := if(listing_price < assessed_value * 0.85, 1, 0)
    | risk_score := non_resident + unencumbered + vacant + recent_contact_change + below_market
    | risk_score >= 3
    | risk_level := if(risk_score >= 5, "critical", if(risk_score >= 4, "high", "medium"))
    | listing_to_market_ratio := round(listing_price / assessed_value * 100, 1)
    | sort(risk_score, order=desc)
  splunk: |-
    `comment("Splunk SPL for Seller Impersonation Pattern — DL-0186")`
    `comment("Detects property sale by non-resident owner of vacant/unencumbered property")`
    index=flame_realestate sourcetype=flame:property_transactions
      (transaction_type="sale_listing" OR transaction_type="title_transfer"
       OR transaction_type="deed_recording")
    | eval non_resident = if(property_address != owner_mailing_address, 1, 0)
    | eval unencumbered = if(mortgage_balance <= 0 OR isnull(mortgage_balance), 1, 0)
    | eval vacant = if(occupancy_status="vacant", 1, 0)
    | eval recent_contact_change = if(owner_contact_updated_days < 90, 1, 0)
    | eval below_market = if(listing_price < assessed_value * 0.85, 1, 0)
    | eval risk_score = non_resident + unencumbered + vacant + recent_contact_change + below_market
    | where risk_score >= 3
    | eval risk_level = case(
        risk_score >= 5, "critical",
        risk_score >= 4, "high",
        risk_score >= 3, "medium")
    | eval listing_to_market_ratio = round(listing_price / assessed_value * 100, 1)
    | table property_id, property_address, owner_name, assessed_value, listing_price,
            listing_to_market_ratio, occupancy_status, mortgage_balance,
            owner_contact_updated_days, non_resident, unencumbered, vacant,
            recent_contact_change, below_market, risk_score, risk_level
    | sort - risk_score
  sql: |-
    -- SQL for Seller Impersonation Pattern Detection
    -- Property sale by non-resident owner of vacant/unencumbered property
    SELECT
      p.property_id,
      p.property_address,
      p.property_type,
      p.assessed_value,
      p.occupancy_status,
      p.mortgage_balance,
      o.owner_name,
      o.owner_mailing_address,
      DATEDIFF(DAY, o.contact_last_updated, CURRENT_DATE) AS contact_updated_days_ago,
      t.transaction_type,
      t.listing_price,
      t.listing_date,
      ROUND(t.listing_price * 100.0 / NULLIF(p.assessed_value, 0), 1) AS listing_to_market_pct,
      (CASE WHEN p.property_address != o.owner_mailing_address THEN 1 ELSE 0 END
       + CASE WHEN p.mortgage_balance <= 0 OR p.mortgage_balance IS NULL THEN 1 ELSE 0 END
       + CASE WHEN p.occupancy_status = 'vacant' THEN 1 ELSE 0 END
       + CASE WHEN o.contact_last_updated >= DATEADD(DAY, -90, CURRENT_DATE) THEN 1 ELSE 0 END
       + CASE WHEN t.listing_price < p.assessed_value * 0.85 THEN 1 ELSE 0 END) AS risk_score
    FROM properties p
    JOIN property_owners o ON p.property_id = o.property_id
    JOIN property_transactions t ON p.property_id = t.property_id
    WHERE t.transaction_type IN ('sale_listing', 'title_transfer', 'deed_recording')
      AND t.listing_date >= DATEADD(DAY, -30, CURRENT_DATE)
      AND (p.occupancy_status = 'vacant' OR p.property_address != o.owner_mailing_address)
      AND (p.mortgage_balance <= 0 OR p.mortgage_balance IS NULL)
    HAVING risk_score >= 3
    ORDER BY risk_score DESC, t.listing_date DESC
falsepositives:
  - Legitimate sales of investment properties by non-resident owners
  - Estate sales of inherited vacant properties
  - Property owners with recently updated contact info due to relocation
  - Below-market listings for quick sales (divorce, financial hardship)
  - Vacant lot sales by developers or investors
level: high
tags:
  - cfpf.phase3.positioning
  - flame.title-fraud
  - flame.seller-impersonation
  - flame.deed-theft
