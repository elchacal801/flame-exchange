title: Cross-Platform Deposit and Withdrawal Chain
id: 3ba070d5-b6d5-452f-942b-955b2dcd4d44
status: experimental
description: >
  Detects a pattern where funds are received via one payment rail (e.g., ACH, wire)
  and then immediately sent out via a different payment rail (e.g., Zelle, FedNow)
  within a short window. This cross-rail chaining is a common layering technique
  used to obscure the origin of funds and complicate tracing, often associated with
  money mule operations and authorized push payment fraud monetization.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.fatf-gafi.org/en/publications/Methodsandtrends/Money-laundering-terrorist-financing-trends.html
threat_paths:
  - TP-0024
  - TP-0012
cfpf_phase: P5
fraud_types:
  - authorized-push-payment
  - wire-fraud
  - payment-diversion
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection_inbound:
    event_type: 'payment_received'
    inbound_rail|contains:
      - 'ACH_IN'
      - 'WIRE_IN'
      - 'RTP_IN'
      - 'FEDNOW_IN'
  selection_outbound:
    event_type: 'instant_payment_initiated'
    outbound_rail|contains:
      - 'ZELLE'
      - 'FEDNOW'
      - 'RTP'
      - 'ACH_SAMEDAY'
  filter_amount:
    outbound_amount_pct_of_inbound|gte: 80
  condition: (selection_inbound and selection_outbound and filter_amount) | temporal(ordered=true, maxspan=4h, by=account_id)
  timeframe: 4h
falsepositives:
  - Freelancer receiving ACH payroll and immediately paying rent via Zelle
  - Business account receiving wire payment and disbursing to vendors via instant payment
level: high
tags:
  - cfpf.phase5.monetization
  - attack.t1565
  - flame.a2a
