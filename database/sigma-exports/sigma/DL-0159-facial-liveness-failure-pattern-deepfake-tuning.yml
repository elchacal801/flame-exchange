title: Facial Liveness Failure Pattern — Iterative Deepfake Tuning
id: fb790d19-b335-4e31-951a-b8dc5d2715ca
status: experimental
description: >
  Detects repeated liveness check failures from the same device followed by eventual
  success — indicates iterative deepfake tuning where fraudsters adjust their deepfake
  parameters until they pass liveness detection. Normal users fail once (bad lighting)
  and succeed quickly; attackers show a pattern of 3+ failures with improving scores.
  Real-time face-swap applications and pre-recorded deepfake videos are used to defeat
  challenges requiring head turns, blinking, or phrase repetition. The iterative
  improvement pattern — each attempt scoring higher than the last — is a strong
  indicator of adversarial tuning against the liveness detection model.
sigma_compatible: false
native_query_required: true
references:
  - "Entrust 2025 Identity Fraud Report — deepfake liveness bypass trends"
  - "NIST SP 800-63B, Digital Identity Guidelines — biometric verification"
  - "LexisNexis Risk Solutions, Global State of Fraud and Identity Report 2026"
threat_paths:
  - TP-0029
  - TP-0018
cfpf_phase: P2
fraud_types:
  - synthetic-identity
  - document-fraud
  - ai-accelerated-fraud-infrastructure
logsource:
  product: banking
  service: document_verification
detection:
  selection_liveness_check:
    event_type: LIVENESS_CHECK
  filter_failure_pattern:
    device_fingerprint|exists: true
  condition: >
    selection_liveness_check AND filter_failure_pattern AND
    (count(liveness_result = "fail" WHERE same device_fingerprint within 24h) >= 3
    AND liveness_result = "pass" within same 24h window)
    OR (liveness_score shows monotonic increase across 3+ consecutive attempts
    from same device_fingerprint)
data_sources:
  native_fields:
    - applicant_id
    - event_type
    - liveness_timestamp
    - liveness_result
    - liveness_score
    - device_fingerprint
    - ip_address
    - session_id
  enrichment_required:
    - field: liveness_failure_count_24h
      source: Aggregation — count of liveness failures per device_fingerprint in rolling 24h window
    - field: liveness_score_trend
      source: Derived — directional trend of liveness_score across consecutive attempts
    - field: time_between_attempts
      source: Derived — interval between consecutive liveness check attempts
    - field: video_compression_anomaly
      source: Liveness session analysis — unusual video compression artifacts indicating injection
  derived_fields:
    - failure_count_before_success
    - score_improvement_pattern
    - avg_time_between_attempts
queries:
  cql: |-
    // CrowdStrike CQL for Iterative Deepfake Tuning Detection
    // Detects repeated liveness failures followed by success from same device
    event_type="LIVENESS_CHECK"
    | groupBy(device_fingerprint, function=[
        count(liveness_result = "fail", as=failure_count),
        count(liveness_result = "pass", as=success_count),
        collect([liveness_score], limit=20) as score_history,
        min(liveness_timestamp) as first_attempt,
        max(liveness_timestamp) as last_attempt
      ])
    | time_window_hours := (last_attempt - first_attempt) / 3600
    | time_window_hours <= 24
    | failure_count >= 3 AND success_count >= 1
    | select([device_fingerprint, failure_count, success_count,
              score_history, first_attempt, last_attempt,
              time_window_hours])
    | sort(failure_count, order=desc)
  splunk: |-
    `comment("Splunk SPL for Iterative Deepfake Tuning Detection")`
    `comment("Detects repeated liveness failures followed by success from same device")`
    index=flame_banking sourcetype=flame:document_verification
      event_type="LIVENESS_CHECK"
    | sort 0 device_fingerprint, liveness_timestamp
    | eventstats
        count(if(liveness_result="fail", 1, NULL)) as failure_count,
        count(if(liveness_result="pass", 1, NULL)) as success_count,
        min(liveness_timestamp) as first_attempt,
        max(liveness_timestamp) as last_attempt
        by device_fingerprint
    | where (last_attempt - first_attempt) <= 86400
        AND failure_count >= 3 AND success_count >= 1
    | streamstats current=t window=0 values(liveness_score) as score_history
        by device_fingerprint
    | dedup device_fingerprint
    | table device_fingerprint, failure_count, success_count,
            score_history, first_attempt, last_attempt
    | sort - failure_count
  sql: |-
    -- SQL for Iterative Deepfake Tuning Detection
    -- Detects repeated liveness failures followed by success from same device
    WITH liveness_stats AS (
      SELECT
        l.device_fingerprint,
        l.applicant_id,
        COUNT(CASE WHEN l.liveness_result = 'fail' THEN 1 END) AS failure_count,
        COUNT(CASE WHEN l.liveness_result = 'pass' THEN 1 END) AS success_count,
        MIN(l.liveness_timestamp) AS first_attempt,
        MAX(l.liveness_timestamp) AS last_attempt,
        DATEDIFF(HOUR, MIN(l.liveness_timestamp), MAX(l.liveness_timestamp)) AS time_window_hours,
        STRING_AGG(CAST(l.liveness_score AS VARCHAR), ',' ORDER BY l.liveness_timestamp) AS score_history
      FROM liveness_checks l
      WHERE l.event_type = 'LIVENESS_CHECK'
        AND l.liveness_timestamp >= DATEADD(HOUR, -24, CURRENT_TIMESTAMP)
      GROUP BY l.device_fingerprint, l.applicant_id
    )
    SELECT
      device_fingerprint,
      applicant_id,
      failure_count,
      success_count,
      first_attempt,
      last_attempt,
      time_window_hours,
      score_history
    FROM liveness_stats
    WHERE failure_count >= 3
      AND success_count >= 1
      AND time_window_hours <= 24
    ORDER BY failure_count DESC
falsepositives:
  - Users with poor camera quality or lighting requiring multiple genuine attempts
  - Users unfamiliar with liveness check process who need several tries
  - Network connectivity issues causing liveness check session interruptions
level: critical
tags:
  - attack.t1656
  - attack.t1204
  - cfpf.phase2.initial_access
  - flame.deepfake-detection
  - flame.liveness-bypass
  - flame.ai-accelerated-fraud-infrastructure