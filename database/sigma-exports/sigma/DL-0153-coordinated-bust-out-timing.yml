title: Coordinated Bust-Out Timing — Simultaneous Max-Utilization Across Multiple Products
id: b6480e4f-0499-40a9-8814-be0d21e2bd64
status: experimental
description: >
  Detects coordinated bust-out execution where the same identity (or linked identities)
  max out credit across multiple products within a 72-hour window. Synthetic identity
  rings time their bust-out to extract maximum value before accounts are frozen: cash
  advances, balance transfers to controlled accounts, and high-value purchases for resale
  all occur within a narrow window. When 3+ credit products associated with the same
  identity show utilization above 90% within 72 hours, and at least one involves a cash
  advance or balance transfer, this is a high-confidence bust-out indicator.
sigma_compatible: false
native_query_required: true
references:
  - "Federal Reserve, Synthetic Identity Fraud in the U.S. Payment System (2024)"
  - "Aite-Novarica, Synthetic Identity Fraud: Coordinated Bust-Out Patterns (2025)"
threat_paths:
  - TP-0003
cfpf_phase: P4
fraud_types:
  - synthetic-identity
  - bust-out
  - credit-card-fraud
  - cash-advance-fraud
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection_high_utilization:
    current_utilization_pct|gte: 90
  selection_cash_advance:
    transaction_type:
      - CASH_ADVANCE
      - BALANCE_TRANSFER
      - CONVENIENCE_CHECK
  timeframe: 72h
  condition: >
    count(distinct account_id) by identity_id >= 3
    AND selection_high_utilization
    AND at least one selection_cash_advance within timeframe
data_sources:
  native_fields:
    - identity_id
    - account_id
    - transaction_type
    - transaction_amount
    - merchant_category
    - current_utilization_pct
    - credit_limit
  derived_fields:
    - products_maxed_count
    - total_exposure
    - has_cash_advance
queries:
  cql: |-
    // CrowdStrike CQL for Coordinated Bust-Out Timing
    // Detects 3+ products maxed within 72h for same identity
    current_utilization_pct>=90
    | groupBy(identity_id, function=[
        count(field=account_id, distinct=true, as=products_maxed),
        sum(transaction_amount, as=total_exposure),
        collect([account_id, transaction_type, transaction_amount,
                 credit_limit, current_utilization_pct, merchant_category])
      ], span=72h)
    | products_maxed >= 3
    | has_cash_advance := transaction_type=/CASH_ADVANCE|BALANCE_TRANSFER|CONVENIENCE_CHECK/
    | sort(total_exposure, order=desc)
  splunk: |-
    `comment("Splunk SPL for Coordinated Bust-Out Timing")`
    `comment("Detects 3+ products maxed within 72h for same identity")`
    index=flame_banking sourcetype=flame:transaction_monitoring
      current_utilization_pct>=90
    | stats dc(account_id) AS products_maxed,
            sum(transaction_amount) AS total_exposure,
            values(account_id) AS accounts,
            values(transaction_type) AS txn_types,
            values(merchant_category) AS merchants,
            max(credit_limit) AS max_limit
      BY identity_id _time span=72h
    | where products_maxed >= 3
    | search txn_types="*CASH_ADVANCE*" OR txn_types="*BALANCE_TRANSFER*"
        OR txn_types="*CONVENIENCE_CHECK*"
    | eval risk = if(products_maxed >= 5, "critical",
                  if(total_exposure > 100000, "critical", "high"))
    | table identity_id, products_maxed, total_exposure, accounts,
            txn_types, merchants, risk
    | sort - total_exposure
  sql: |-
    -- SQL for Coordinated Bust-Out Timing
    -- Detects 3+ products maxed within 72h for same identity
    WITH maxed_products AS (
      SELECT
        t.identity_id,
        t.account_id,
        t.transaction_type,
        t.transaction_amount,
        a.credit_limit,
        a.current_utilization_pct,
        t.transaction_date
      FROM transactions t
      JOIN credit_accounts a ON t.account_id = a.account_id
      WHERE a.current_utilization_pct >= 90
        AND t.transaction_date >= DATEADD(HOUR, -72, CURRENT_TIMESTAMP)
    )
    SELECT
      identity_id,
      COUNT(DISTINCT account_id) AS products_maxed,
      SUM(transaction_amount) AS total_exposure,
      STRING_AGG(DISTINCT transaction_type, ', ') AS txn_types,
      MAX(CASE WHEN transaction_type IN ('CASH_ADVANCE', 'BALANCE_TRANSFER', 'CONVENIENCE_CHECK')
          THEN 1 ELSE 0 END) AS has_cash_advance
    FROM maxed_products
    GROUP BY identity_id
    HAVING COUNT(DISTINCT account_id) >= 3
       AND MAX(CASE WHEN transaction_type IN ('CASH_ADVANCE', 'BALANCE_TRANSFER', 'CONVENIENCE_CHECK')
               THEN 1 ELSE 0 END) = 1
    ORDER BY total_exposure DESC
falsepositives:
  - Consumers aggressively using multiple cards for large planned purchases (rare)
  - Business owners using multiple personal cards for business expenses during cash flow crunch
level: critical
tags:
  - attack.t1657
  - cfpf.phase4.execution
  - flame.synthetic-identity
  - flame.bust-out
  - flame.coordinated
