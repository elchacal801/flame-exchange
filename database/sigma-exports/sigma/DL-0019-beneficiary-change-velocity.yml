title: Beneficiary Change Velocity Anomaly
id: 5cf74ef7-5066-4957-bdb3-8b26d823d01d
status: experimental
description: >
  Detects multiple beneficiary additions or modifications on a single account within a short
  time window. Rapid beneficiary changes are a strong pre-cursor to payment diversion fraud,
  where an attacker positions new destination accounts before initiating unauthorized wires.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.fincen.gov/sites/default/files/advisory/2019-10-01/BEC_Advisory_FINAL_508.pdf
threat_paths:
  - TP-0001
  - TP-0004
  - TP-0006
cfpf_phase: P3
fraud_types:
  - account-takeover
  - payment-diversion
  - wire-fraud
logsource:
  product: banking
  service: core_banking
detection:
  selection:
    event_type:
      - 'BENEFICIARY_ADD'
      - 'BENEFICIARY_MODIFY'
      - 'BENEFICIARY_DELETE'
  timeframe: 24h
  condition: selection | count(distinct beneficiary_id) by account_id > 3
falsepositives:
  - Corporate treasury teams onboarding multiple new vendors during month-end
  - Business accounts setting up payroll beneficiaries for the first time
level: high
tags:
  - cfpf.phase3.positioning
  - attack.t1098
  - flame.account_modification
