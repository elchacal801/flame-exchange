title: AiTM Session Token Replay — Same SessionId from Multiple IPs
id: 9a4b2e7d-3f1c-8d5a-b6e2-4c7a1d9f3e08
status: experimental
description: >
  Detects potential AiTM session token replay by identifying the same Entra ID
  SessionId appearing from multiple IP addresses within a short time window. In
  an AiTM attack, the phishing proxy IP and the attacker's actual replay IP both
  appear on the same session. This is the single strongest AiTM detection signal
  in Microsoft Entra ID sign-in logs. Additional confidence comes from the error
  code sequence 50074 (MFA required) → 50140 (Keep Me Signed In) → 0 (success)
  in rapid succession with medium or high risk level.
sigma_compatible: false
native_query_required: true
references:
  - "Phishing kits and AiTM platforms: a comprehensive threat intelligence reference (2026)"
  - "Microsoft Sentinel PossibleAiTMPhishingAttemptAgainstAAD.yaml analytic rule"
  - "reprise99 Identity-PotentialAiTM.kql"
threat_paths:
  - TP-0067
cfpf_phase: P3
fraud_types:
  - aitm-phishing
  - account-takeover
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType: 0
  condition: >
    count(distinct IPAddress) by SessionId >= 2
    AND timeframe < 4 hours
data_sources:
  native_fields:
    - SessionId
    - IPAddress
    - UserPrincipalName
    - UserAgent
    - AppId
    - ResultType
    - RiskLevelDuringSignIn
    - AuthenticationRequirement
queries:
  cql: |-
    // CrowdStrike CQL for AiTM Session Token Replay Detection
    // Detects same SessionId used from multiple IPs (proxy + attacker)
    #repo="azure_signinlogs"
    ResultType="0"
    | groupBy([SessionId, UserPrincipalName], function=[count(field=IPAddress, distinct=true, as=IPCount), collect([IPAddress], as=IPs), collect([UserAgent], as=UserAgents), collect([AppId], as=AppIds), min(@timestamp, as=MinTime), max(@timestamp, as=MaxTime), collect([RiskLevelDuringSignIn], as=RiskLevels)], span=4h)
    | IPCount >= 2
    | select([UserPrincipalName, SessionId, IPCount, IPs, UserAgents,
              AppIds, MinTime, MaxTime, RiskLevels])
    | sort(IPCount, order=desc)
  kql: |-
    // KQL: AiTM Session Token Replay Detection
    // Detects same SessionId used from multiple IPs (proxy + attacker)
    let timeWindow = 4h;
    SigninLogs
    | where TimeGenerated > ago(24h)
    | where ResultType == 0
    | summarize
        IPCount = dcount(IPAddress),
        IPs = make_set(IPAddress),
        UserAgents = make_set(UserAgent),
        AppIds = make_set(AppId),
        MinTime = min(TimeGenerated),
        MaxTime = max(TimeGenerated),
        RiskLevels = make_set(RiskLevelDuringSignIn)
      by SessionId, UserPrincipalName
    | where IPCount >= 2
    | where datetime_diff('hour', MaxTime, MinTime) <= 4
    | project UserPrincipalName, SessionId, IPCount, IPs, UserAgents,
              AppIds, MinTime, MaxTime, RiskLevels

  splunk: |-
    `comment("Splunk SPL for AiTM Session Token Replay Detection")`
    `comment("Same SessionId from multiple IPs indicates token replay")`
    index=azure sourcetype=azure:aad:signin ResultType=0
    | stats dc(IPAddress) AS ip_count,
            values(IPAddress) AS ips,
            values(UserAgent) AS user_agents,
            values(AppId) AS app_ids,
            min(_time) AS first_seen,
            max(_time) AS last_seen,
            values(RiskLevelDuringSignIn) AS risk_levels
      BY SessionId, UserPrincipalName
    | where ip_count >= 2
    | eval window_hours = round((last_seen - first_seen) / 3600, 2)
    | where window_hours <= 4
    | sort - ip_count

falsepositives:
  - Users connecting through VPN that changes IP mid-session
  - Load-balanced corporate proxies presenting different egress IPs
  - Mobile users transitioning between WiFi and cellular networks
level: high
tags:
  - attack.t1550.004
  - attack.t1539
  - attack.t1557
  - cfpf.phase3.positioning
  - flame.aitm
  - flame.session-replay
  - flame.mfa-bypass
