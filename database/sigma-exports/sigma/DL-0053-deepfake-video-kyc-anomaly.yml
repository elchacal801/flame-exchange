title: Deepfake Anomalies in Video KYC Session
id: 5c37b4de-19e8-483a-b781-57d2e0d77be8
status: experimental
description: >
  Detects anomalies during video KYC (Know Your Customer) sessions that may indicate
  the use of deepfake technology. Indicators include irregular frame rates suggesting
  real-time face-swapping, inconsistent lighting between face and background, lip-sync
  desynchronization, unnatural eye-blink patterns, and face-boundary artifacts.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://pages.nist.gov/frvt/html/frvt_morph.html
threat_paths:
  - TP-0018
cfpf_phase: P2
fraud_types:
  - deepfake-fraud
  - impersonation
logsource:
  product: banking
  service: video_kyc
detection:
  selection:
    event_type: 'video_kyc_session'
    session_status: 'in_progress'
  filter_frame_anomaly:
    frame_rate_variance|gt: 8.0
  filter_lipsync:
    lip_sync_offset_ms|gt: 150
  filter_blink:
    blink_rate_per_minute|lt: 3
  filter_lighting:
    face_background_lighting_delta|gt: 40
  condition: selection and (filter_frame_anomaly or filter_lipsync or filter_blink or filter_lighting)
falsepositives:
  - Poor internet connection causing frame drops and variable frame rates
  - Unusual ambient lighting conditions in the caller's environment
  - Customer wearing heavy makeup or glasses affecting facial analysis
level: high
tags:
  - cfpf.phase2.targeting
  - attack.t1656
  - flame.deepfake
