title: Scam Merchant High-Velocity Transaction Pattern
id: b8c35d72-6ea1-4f09-8d4b-1a7c9e0f63d5
status: experimental
description: 'Detects merchant accounts exhibiting high initial transaction velocity, elevated chargeback ratios, and short
  account age — a pattern consistent with purchase scam merchant operations. Recorded Future identified 3,600+ scam merchant
  accounts in 2025, a 2.5x increase from 2024, operating across 40+ countries and 230+ acquirers. Scam merchants typically
  process high transaction volumes within their first 30-90 days to extract maximum revenue before chargeback volume triggers
  acquirer intervention and account termination. Normal new merchant ramp-up is fewer than 50 transactions per day in the
  first 30 days, ramping to 200+ by day 90. Scam merchants frequently exceed 200 transactions per day within the first two
  weeks, combined with chargeback rates exceeding 1.5% within 60 days of account opening. This rule also flags merchants with
  account ages under 90 days that have already accumulated chargeback ratios above scheme monitoring thresholds.

  '
sigma_compatible: true
references:
- https://www.recordedfuture.com/research/annual-payment-fraud-intelligence-report-2025
threat_paths:
- TP-0036
cfpf_phase: P4
fraud_types:
- purchase-scam
- brand-impersonation
logsource:
  product: ecommerce
  service: merchant_monitoring
detection:
  selection_velocity:
    merchant_account_age_days|lte: 90
    daily_transaction_count|gte: 200
  selection_chargeback:
    merchant_account_age_days|lte: 90
    chargeback_ratio_pct|gte: 1.5
  selection_combined:
    merchant_account_age_days|lte: 30
    daily_transaction_count|gte: 100
    unique_cards_per_day|gte: 80
    chargeback_ratio_pct|gte: 0.8
  condition: selection_velocity or selection_chargeback or selection_combined
data_sources:
  native_fields:
  - merchant_account_age_days
  - unique_cards_per_day
  enrichment_required:
  - field: chargeback_ratio_pct
    source: Payment analytics enrichment (chargeback ratio calculation)
  - field: daily_transaction_count
    source: Account analytics enrichment (daily transaction count aggregation)
falsepositives:
- Legitimate new merchants running launch promotions or flash sales with high initial transaction volumes
- Seasonal merchants (holiday, event-driven) with compressed selling periods
- Marketplace merchants migrating transaction history from another acquirer
level: high
tags:
- cfpf.phase4.execution
- attack.t1657
- flame.ecommerce
- flame.purchase_scam
- flame.merchant_fraud
