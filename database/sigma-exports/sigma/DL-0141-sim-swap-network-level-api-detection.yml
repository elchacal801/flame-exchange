title: SIM Swap Network-Level API Detection — Pre-MFA SIM Change Verification
id: 1e6b8a3d-4c2f-7e9a-b5d8-3f1a6c9e2b07
status: experimental
description: >
  Detects potential SIM swap attacks by querying network-level APIs before MFA code
  delivery. SIM swap fraud surged 1,055% in the UK (3,000 cases in 2024). Three
  network-level APIs provide the most effective detection: SIM Swap Check (has the
  SIM been changed recently?), Number Verification (is the number still assigned to
  the expected device?), and Call Forwarding Signal (is call forwarding active?).
  Correlating positive signals from these APIs with subsequent MFA authentication
  attempts provides high-confidence SIM swap detection.
sigma_compatible: false
native_query_required: true
references:
  - "Organized fraud detection in 2026: a technical landscape report — SIM swap detection"
threat_paths:
  - TP-0008
cfpf_phase: P2
fraud_types:
  - account-takeover
logsource:
  product: telecom
  service: number_intelligence
detection:
  selection:
    api_type:
      - sim_swap_check
      - number_verification
      - call_forwarding_signal
  condition: >
    sim_swap_check.recently_swapped == true
    OR number_verification.device_mismatch == true
    OR call_forwarding_signal.forwarding_active == true
data_sources:
  native_fields:
    - api_type
    - phone_number
    - sim_swap_check_result
    - sim_swap_timestamp
    - number_verification_result
    - device_match_status
    - call_forwarding_status
    - forwarding_destination
queries:
  cql: |-
    // CrowdStrike CQL for SIM Swap Network-Level API Detection
    // Correlates SIM change signals with MFA authentication attempts
    #repo="flame_telecom" #event_type="number_intelligence"
    | case {
        sim_swap_recently="true" | sim_risk := "HIGH";
        device_mismatch="true" | sim_risk := "HIGH";
        call_forwarding_active="true" | sim_risk := "MEDIUM";
        * | sim_risk := "LOW";
      }
    | sim_risk="HIGH" OR sim_risk="MEDIUM"
    | selfJoinFilter(phone_number, where=[
        {#repo="flame_telecom" sim_risk="HIGH" OR sim_risk="MEDIUM"},
        {#repo="flame_banking" #event_type="mfa_events" mfa_channel="SMS"}
      ])
    | select([@timestamp, phone_number, customer_id, sim_risk,
              sim_swap_recently, sim_swap_timestamp,
              device_mismatch, call_forwarding_active, mfa_result])
    | sort(@timestamp, order=desc)
  splunk: |-
    `comment("Splunk SPL for SIM Swap Network-Level API Detection")`
    `comment("Correlates SIM change signals with MFA authentication attempts")`
    index=flame_telecom sourcetype=flame:number_intelligence
    | eval sim_risk = case(
        sim_swap_recently == "true", "HIGH",
        device_mismatch == "true", "HIGH",
        call_forwarding_active == "true", "MEDIUM",
        1=1, "LOW"
      )
    | where sim_risk IN ("HIGH", "MEDIUM")
    | join type=inner max=0 phone_number [
      search index=flame_banking sourcetype=flame:mfa_events
      | where mfa_channel = "SMS"
      | where _time > relative_time(now(), "-1h")
    ]
    | table _time, phone_number, customer_id, sim_risk,
            sim_swap_recently, sim_swap_timestamp,
            device_mismatch, call_forwarding_active,
            mfa_result

  sql: |-
    -- SQL: Correlate SIM swap signals with MFA authentication
    SELECT
        n.phone_number,
        n.check_timestamp,
        n.sim_swap_recently,
        n.sim_swap_date,
        n.device_mismatch,
        n.call_forwarding_active,
        m.mfa_event_time,
        m.mfa_result,
        m.customer_id,
        CASE
            WHEN n.sim_swap_recently = TRUE THEN 'HIGH'
            WHEN n.device_mismatch = TRUE THEN 'HIGH'
            WHEN n.call_forwarding_active = TRUE THEN 'MEDIUM'
        END AS risk_level
    FROM number_intelligence_checks n
    JOIN mfa_events m ON n.phone_number = m.phone_number
    WHERE m.mfa_channel = 'SMS'
      AND m.mfa_event_time BETWEEN n.check_timestamp
          AND DATEADD(hour, 1, n.check_timestamp)
      AND (n.sim_swap_recently = TRUE
           OR n.device_mismatch = TRUE
           OR n.call_forwarding_active = TRUE)
    ORDER BY n.check_timestamp DESC

falsepositives:
  - Legitimate SIM replacements (lost/damaged phone)
  - Carrier-initiated SIM migrations (network upgrades)
  - Users activating call forwarding for legitimate reasons
level: high
tags:
  - attack.t1111
  - cfpf.phase2.initial_access
  - flame.sim-swap
  - flame.mfa-bypass
