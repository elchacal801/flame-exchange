title: Carrier Change Authentication Correlation
id: 26bb606a-5507-42e3-8405-a5e48094aac8
status: experimental
description: 'Detects a carrier or SIM change event immediately followed by an authentication attempt on a banking platform.
  SIM swap attacks involve social engineering or insider compromise at a mobile carrier to port the victim''s phone number
  to an attacker-controlled SIM, after which the attacker uses SMS-based MFA to access accounts. The tight temporal correlation
  between carrier change and login is the key indicator.

  '
sigma_compatible: false
native_query_required: true
references:
- https://attack.mitre.org/techniques/T1111/
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
- TP-0008
- TP-0001
cfpf_phase: P2
fraud_types:
- account-takeover
- esim-hijacking
logsource:
  product: telecom
  service: identity_management
detection:
  selection_carrier_change:
    event_type|contains:
    - sim_swap
    - carrier_change
    - number_port
    status: completed
  selection_auth:
    event_type: login_attempt
    mfa_method: sms
    mfa_result: success
  timeframe: 120m
  condition: selection_carrier_change and selection_auth
data_sources:
  native_fields:
  - event_type
  - mfa_method
  - mfa_result
  - status
queries:
  cql: |-
    // CrowdStrike CQL for Carrier Change Authentication Correlation
    // Repository: flame-telecom-identity-management
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: selection_carrier_change | followed_by selection_auth on phone_number within 120m
    (event_type="sim_swap" OR event_type="carrier_change" OR event_type="number_port")
    status="completed"
    event_type="login_attempt"
    mfa_method="sms"
    mfa_result="success"
    // Sequential correlation — use CrowdStrike NGSIEM sequence detection
    // Correlate stages sequentially on phone_number within 120m
  splunk: |-
    `comment("Splunk SPL for Carrier Change Authentication Correlation")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: selection_carrier_change | followed_by selection_auth on phone_number within 120m")`
    index=flame_telecom sourcetype=flame:identity_management
    (event_type="sim_swap" OR event_type="carrier_change" OR event_type="number_port")
    status="completed"
    event_type="login_attempt"
    mfa_method="sms"
    mfa_result="success"
    | transaction phone_number maxspan=120m
    | where eventcount >= 2
    `comment("Sequential correlation across stages")`
falsepositives:
- Legitimate users who switch carriers and immediately log in to their banking apps
- Planned device upgrades where users authenticate on new hardware right after activation
level: critical
tags:
- cfpf.phase2.initial_access
- attack.t1111
- attack.t1078
