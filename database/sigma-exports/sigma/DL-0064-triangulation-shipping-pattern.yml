title: Triangulation Fraud Shipping Pattern Detection
id: bc8cdbb5-644d-421f-a1c6-28f6bbe03182
status: experimental
description: >
  Detects orders where the shipping address differs from the billing address and
  matches known drop-ship or reshipping patterns associated with triangulation fraud.
  In triangulation fraud, a fraudster lists goods on a marketplace, collects payment
  from a victim buyer, then purchases the item from a legitimate retailer using stolen
  payment credentials, shipping directly to the victim. Indicators include shipping to
  known drop addresses, freight forwarders, or addresses seen across multiple unrelated
  accounts.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.europol.europa.eu/publications-events/publications/e-commerce-fraud
threat_paths:
  - TP-0030
  - TP-0013
cfpf_phase: P4
fraud_types:
  - identity-theft
  - first-party-fraud
logsource:
  product: ecommerce
  service: order_management
detection:
  selection:
    event_type: 'order_placed'
    billing_shipping_address_match: false
  filter_drop_address:
    shipping_address_type|contains:
      - 'freight_forwarder'
      - 'reshipper'
      - 'po_box'
      - 'commercial_mailbox'
  filter_shared_address:
    shipping_address_distinct_accounts|gt: 3
  filter_velocity:
    shipping_address_orders_7d|gt: 5
  condition: selection and (filter_drop_address or filter_shared_address or filter_velocity)
falsepositives:
  - Legitimate gift orders shipped to recipients at different addresses
  - Corporate purchasing departments using centralized receiving addresses
  - Customers shipping to workplace address for package security
level: high
tags:
  - cfpf.phase4.execution
  - attack.t1583
  - flame.ecommerce
