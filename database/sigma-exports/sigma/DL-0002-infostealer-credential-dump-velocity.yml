title: Infostealer Credential Dump Velocity
id: ea53b54f-b0f3-4660-a072-40db4491bc11
status: experimental
description: >
  Detects rapid credential dump patterns where many unique credentials are harvested from a single
  host in a short timeframe. Infostealers such as RedLine, Lumma, and Vidar typically exfiltrate
  dozens to hundreds of stored credentials within seconds of execution, producing a burst of
  credential-access events from one endpoint.
references:
  - https://attack.mitre.org/techniques/T1555/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0001
  - TP-0023
cfpf_phase: P2
fraud_types:
  - data-theft
  - malware
  - account-takeover
logsource:
  product: banking
  service: endpoint_detection
detection:
  selection:
    event_type: 'credential_access'
    action: 'credential_read'
  filter_legitimate:
    process_name|endswith:
      - '\lsass.exe'
      - '\services.exe'
  timeframe: 5m
  condition: selection and not filter_legitimate | count(distinct target_credential) by host_id > 20
falsepositives:
  - Legitimate credential manager software performing bulk synchronization
  - Enterprise password vault agents rotating stored credentials
level: high
tags:
  - cfpf.phase2.initial_access
  - attack.t1555
  - attack.t1555.003
