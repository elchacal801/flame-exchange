title: Salary Direct Deposit Rapid Cryptocurrency Conversion
id: 785dad0d-0f29-536e-b7d2-816b8db1844f
status: experimental
description: >
  Detects patterns where salary direct deposit payments are rapidly converted to
  cryptocurrency (USDT, USDC, BTC) within 48 hours of deposit, particularly when
  the receiving account was recently opened or when multiple employee accounts
  show the same conversion pattern through the same exchange or payment
  processor. DPRK IT workers convert salary to cryptocurrency for transfer to
  regime-controlled wallets, often using daily conversion limits to avoid AML
  alerts.
references:
  - https://www.justice.gov/opa/pr/justice-department-announces-nationwide-actions-combat-illicit-north-korean-government
  - https://www.ic3.gov/PSA/2025/PSA250723-4
threat_paths:
  - TP-0034
cfpf_phase: P5
fraud_types:
  - dprk-it-worker-fraud
  - crypto-laundering
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection_deposit:
    transaction_type: 'ACH_IN'
    transaction_category: 'payroll'
  selection_conversion:
    outbound_type|contains:
      - 'crypto_exchange'
      - 'p2p_crypto'
      - 'wire_to_exchange'
    time_since_deposit_hours|lte: 48
  condition: selection_deposit | near selection_conversion

  # Correlation: flag when the same crypto exchange or wallet address receives
  # converted salary from multiple employee accounts at the same employer.
falsepositives:
  - Employees who routinely invest a portion of salary in cryptocurrency through automated transfers
  - Cryptocurrency industry employees whose compensation is partially crypto-denominated
level: medium
tags:
  - cfpf.phase5.monetization
  - attack.t1657
  - flame.dprk
  - flame.crypto
