title: Credential Spray Single Password
id: be590f67-0d6b-4f3d-a796-9a013327aae7
status: experimental
description: >
  Detects password spraying attacks where a single password (or small set of passwords) is tested
  across many accounts. Unlike traditional credential stuffing which uses unique username-password
  pairs, password spraying tries common or recently breached passwords against a large account
  population to avoid per-account lockout thresholds.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0013
  - TP-0001
cfpf_phase: P2
fraud_types:
  - credential-stuffing
  - account-takeover
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type: 'login_attempt'
    auth_result: 'failure'
  timeframe: 30m
  condition: >
    selection
    | count(distinct username) by password_hash > 20
    and count(distinct password_hash) by source_ip < 3

  # Pattern: very few unique password hashes attempted against many unique usernames
  # indicates a spray attack with one or two passwords across the account base
falsepositives:
  - Batch account creation workflows where a default password is assigned to many accounts
  - Automated test frameworks using a shared test password across test accounts
level: high
tags:
  - cfpf.phase2.initial_access
  - attack.t1110.003
  - attack.t1078
