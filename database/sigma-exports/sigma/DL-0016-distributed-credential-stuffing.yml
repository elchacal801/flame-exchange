title: Distributed Credential Stuffing
id: 4802a77f-cc87-4dc5-b861-aacaf4a21d7c
status: experimental
description: >
  Detects low-and-slow distributed credential stuffing attacks spread across multiple source IPs
  to evade per-IP rate limiting. Advanced attackers use residential proxy networks and botnets to
  distribute attempts, making each source IP appear benign while the aggregate attack targets
  many accounts. This rule aggregates failed login patterns across source IPs sharing common
  characteristics.
references:
  - https://attack.mitre.org/techniques/T1110/004/
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
threat_paths:
  - TP-0013
  - TP-0001
cfpf_phase: P2
fraud_types:
  - credential-stuffing
  - account-takeover
logsource:
  product: banking
  service: auth_logs
detection:
  selection:
    event_type: 'login_attempt'
    auth_result: 'failure'
  selection_characteristics:
    user_agent|re: '^Mozilla/5\.0.*$'
  timeframe: 30m
  condition: >
    selection and selection_characteristics
    | count(distinct source_ip) by user_agent > 20
    and count(distinct username) by user_agent > 50
    and max(count() by source_ip) < 5

  # Pattern: many source IPs, each with few attempts, but sharing the same user_agent string
  # and collectively targeting many distinct accounts
falsepositives:
  - Large-scale legitimate user activity from a popular browser version during peak hours
  - CDN or reverse-proxy traffic aggregation that normalizes user-agent strings
level: medium
tags:
  - cfpf.phase2.initial_access
  - attack.t1110.004
  - attack.t1090
