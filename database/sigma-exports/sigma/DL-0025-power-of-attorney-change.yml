title: Power of Attorney or Authorized Signer Change
id: 4c0ba92e-b598-4c70-bfd0-8f0fcc60017c
status: experimental
description: >
  Detects changes to power of attorney designations or authorized signers on commercial
  and business accounts. Fraudsters may socially engineer or forge POA documents to gain
  control of business accounts, enabling them to initiate high-value transactions.
references:
  - https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
  - https://www.fincen.gov/sites/default/files/shared/FIN-2022-A002.pdf
threat_paths:
  - TP-0004
  - TP-0005
  - TP-0006
cfpf_phase: P3
fraud_types:
  - account-takeover
  - wire-fraud
logsource:
  product: banking
  service: core_banking
detection:
  selection:
    event_type:
      - 'POA_ADD'
      - 'POA_MODIFY'
      - 'AUTHORIZED_SIGNER_ADD'
      - 'AUTHORIZED_SIGNER_MODIFY'
    account_type:
      - 'commercial'
      - 'business'
      - 'corporate'
      - 'trust'
  selection_high_value:
    account_balance|gte: 50000
  condition: selection and selection_high_value
falsepositives:
  - Legitimate corporate governance changes such as new CFO or treasurer appointment
  - Succession planning updates on trust accounts
level: high
tags:
  - cfpf.phase3.positioning
  - attack.t1098
  - flame.account_modification
