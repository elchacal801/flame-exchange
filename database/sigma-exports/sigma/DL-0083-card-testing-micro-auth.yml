title: Card Testing Micro-Authorization Velocity Spike
id: 3f8d2a71-c5b4-4e69-9a18-6d4e7b2f9c35
status: experimental
description: 'Detects high velocity of sub-dollar ($0.01-$0.99) authorization attempts from the same merchant or source against
  multiple distinct card numbers, a pattern characteristic of automated card testing operations. Recorded Future''s 2025 report
  identified over 1,350 tester merchant accounts, with 94% being newly registered merchants. Normal merchant sub-dollar authorization
  rates are under 0.5% of total authorizations. Card testing operations generate authorization streams where sub-dollar transactions
  dominate, decline rates exceed 70%, and unique card numbers per source per hour reach 50-500+. This rule targets Phase 4
  of TP-0038, detecting the execution of automated card validation at scale through micro-authorization patterns that deviate
  from legitimate merchant transaction profiles.

  '
sigma_compatible: true
references:
- https://www.recordedfuture.com/research/annual-payment-fraud-intelligence-report-2025
threat_paths:
- TP-0038
cfpf_phase: P4
fraud_types:
- card-testing
- data-theft
logsource:
  product: ecommerce
  service: payment_gateway
detection:
  selection:
    transaction_amount|lt: 1.0
    event_type|contains:
    - authorization
    - auth_request
  aggregation:
    count|gte: 50
    groupby: merchant_id
    timeframe: 1h
  filter_card_diversity:
    dc_card_number_hash|gte: 30
  filter_decline_rate:
    decline_rate|gte: 0.5
  condition: selection and aggregation and filter_card_diversity and filter_decline_rate
data_sources:
  native_fields:
  - count
  - dc_card_number_hash
  - event_type
  - groupby
  - timeframe
  - transaction_amount
  enrichment_required:
  - field: decline_rate
    source: Payment analytics enrichment (decline rate calculation over window)
falsepositives:
- Subscription services performing periodic micro-authorizations for card-on-file validation
- Payment processors conducting legitimate batch card verification for account updates
- Charitable organizations processing high volumes of small donations during fundraising events
level: high
tags:
- cfpf.phase4.execution
- attack.t1110.001
- flame.ecommerce
- flame.card_testing
- flame.tester_merchant
