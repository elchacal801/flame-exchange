title: Voice Biometric Confidence Score Anomaly for Known Caller
id: d44fc65a-1d6c-4666-aa2e-d1615ad7e49b
status: experimental
description: 'Detects when a voice biometric verification score for a previously enrolled caller falls below an acceptable
  confidence threshold, which may indicate a deepfake or voice-clone attempt impersonating a legitimate customer. Legitimate
  callers typically produce scores above 85; scores between 40-70 with a previously stable voiceprint warrant investigation.

  '
sigma_compatible: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://pages.nist.gov/frvt/reportcards/speaker/overview.html
threat_paths:
- TP-0007
- TP-0018
cfpf_phase: P4
fraud_types:
- deepfake-fraud
- impersonation
logsource:
  product: banking
  service: voice_authentication
detection:
  selection:
    event_type: voice_biometric_verify
    enrollment_status: enrolled
  filter_low_score:
    voice_confidence_score|lt: 70
  filter_historical_high:
    historical_avg_score|gte: 85
  condition: selection and filter_low_score and filter_historical_high
data_sources:
  native_fields:
  - enrollment_status
  - event_type
  enrichment_required:
  - field: historical_avg_score
    source: Behavioral baseline enrichment (rolling average from analytics platform)
  - field: voice_confidence_score
    source: Voice biometric engine scoring (real-time voice verification)
falsepositives:
- Caller with a cold, sore throat, or other temporary vocal condition
- Poor telephone line quality or high background noise environment
- Caller using a different handset or headset than during enrollment
level: high
tags:
- cfpf.phase4.execution
- attack.t1656
- flame.deepfake
