title: Transaction Amount Clustering Near Reporting Threshold
id: 792fa821-b18b-4745-9977-a533feec41b6
status: experimental
description: 'Detects transactions that cluster just below regulatory reporting thresholds ($3,000 for international transfers,
  $10,000 for CTR filing). Structuring transactions to evade reporting requirements is itself a federal offense and a strong
  indicator of money laundering or fraud monetization.

  '
sigma_compatible: false
native_query_required: true
references:
- https://www.fsisac.com/hubfs/Knowledge/Fraud/CyberFraudPreventionFramework.pdf
- https://www.fincen.gov/sites/default/files/shared/CTR_Overview.pdf
threat_paths:
- TP-0002
- TP-0020
cfpf_phase: P5
fraud_types:
- wire-fraud
- money-mule
logsource:
  product: banking
  service: transaction_monitoring
detection:
  selection_under_10k:
    event_type:
    - WIRE_INITIATION
    - ACH_DEBIT
    - CASH_DEPOSIT
    transaction_amount|gte: 9000
    transaction_amount|lt: 10000
  selection_under_3k:
    event_type:
    - WIRE_INITIATION
    - INTERNATIONAL_TRANSFER
    transaction_amount|gte: 2800
    transaction_amount|lt: 3000
  timeframe: 7d
  condition: (selection_under_10k
data_sources:
  native_fields:
  - event_type
  - transaction_amount
queries:
  cql: |-
    // CrowdStrike CQL for Transaction Amount Clustering Near Reporting Threshold
    // Repository: flame-banking-transaction-monitoring
    // Aggregation that cannot be expressed in Sigma:
    // Original condition: (selection_under_10k | count() by account_id > 2) or (selection_under_3k | count() by account_id > 2)
    (event_type="WIRE_INITIATION" OR event_type="ACH_DEBIT" OR event_type="CASH_DEPOSIT")
    transaction_amount>=9000
    transaction_amount<10000
    (event_type="WIRE_INITIATION" OR event_type="INTERNATIONAL_TRANSFER")
    transaction_amount>=2800
    transaction_amount<3000
    | groupBy(account_id, function=[count(as=event_count)])
    | event_count > 2
    | groupBy(account_id, function=[count(as=event_count)])
    | event_count > 2
  splunk: |-
    `comment("Splunk SPL for Transaction Amount Clustering Near Reporting Threshold")`
    `comment("Aggregation that cannot be expressed in Sigma")`
    `comment("Original condition: (selection_under_10k | count() by account_id > 2) or (selection_under_3k | count() by account_id > 2)")`
    index=flame_banking sourcetype=flame:transaction_monitoring
    (event_type="WIRE_INITIATION" OR event_type="ACH_DEBIT" OR event_type="CASH_DEPOSIT")
    transaction_amount>=9000
    transaction_amount<10000
    (event_type="WIRE_INITIATION" OR event_type="INTERNATIONAL_TRANSFER")
    transaction_amount>=2800
    transaction_amount<3000
    | stats count as event_count by account_id
    | where event_count > 2
    | stats count as event_count by account_id
    | where event_count > 2
falsepositives:
- Small business owners with legitimately recurring transactions that happen to fall near thresholds
- Payroll deposits that naturally cluster at consistent amounts
level: high
tags:
- cfpf.phase5.monetization
- attack.t1657
- flame.wire_ach
